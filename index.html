function lev(a,b){
  const m=a.length, n=b.length, d=[];
  for(let i=0;i<=m;i++) d[i]=[i];
  for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}

function setSession(j){
  st.session = {
    access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at:j.expires_at || Math.floor(Date.now()/1000)+(j.expires_in||3600),
    user:{id:j.user.id, email:j.user.email}
  };
  LS.set('sb.session', st.session);
}
let refreshP = null;
function refreshSession(){
  if(refreshP) return refreshP;
  refreshP = (async () => {
    const rt = st.session && st.session.refresh_token;
    if(!rt){ const e = new Error('Sesi berakhir'); e.auth = true; throw e; }
    let res;
    try{
      res = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:rt})});
    }catch(e){ throw new NetErr(); }
    if(res.status>=500) throw new NetErr('server');
    if(!res.ok){ const e = new Error('Sesi berakhir'); e.auth = true; throw e; }
    setSession(await res.json());
  })().finally(()=>{ refreshP = null; });
  return refreshP;
}
async function api(path, o){
  o = o || {};
  if(!st.session){ const e = new Error('Belum login'); e.auth = true; throw e; }
  if(st.session.expires_at - Date.now()/1000 < 60) await refreshSession();
  for(let attempt=0; attempt<2; attempt++){
    const h = Object.assign({apikey:SB_KEY, Authorization:'Bearer '+st.session.access_token}, o.headers||{});
    if(o.body!==undefined) h['Content-Type'] = 'application/json';
    let res;
    try{ res = await fetch(SB_URL+path, {method:o.method||'GET', headers:h, body:o.body!==undefined?JSON.stringify(o.body):undefined}); }
    catch(e){ throw new NetErr(); }
    if(res.status===401 && attempt===0){ await refreshSession(); continue; }
    return res;
  }
}
async function failure(res){
  let j = {}; try{ j = await res.json(); }catch(e){}
  let msg = j.message || j.msg || j.error_description || j.error || ('Kesalahan '+res.status);
  if(j.code && FRIENDLY[j.code]) msg = FRIENDLY[j.code];
  const e = new Error(msg); e.status = res.status; e.code = j.code; return e;
}
async function jget(path){ const r = await api(path); if(!r.ok) throw await failure(r); return r.json(); }
async function patchRow(path, body){
  const r = await api(path, {method:'PATCH', headers:{Prefer:'return=representation'}, body});
  if(!r.ok) throw await failure(r);
  const rows = await r.json();
  if(!rows.length){ const e = new Error(FRIENDLY['42501']); e.status = 403; throw e; }
  return rows;
}

  if(st.session.expires_at - Date.now()/1000 < 60) await refreshSession();

  try{
    res = await fetch(FN_URL, {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer '+st.session.access_token, 'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  }catch(e){ throw new NetErr(); }
  let j = {}; try{ j = await res.json(); }catch(e){}
  if(!res.ok){
    let msg = j.error || j.message || ('Kesalahan '+res.status);
    if(res.status===404) msg = 'Fungsi pengelola staf belum dipasang di Supabase.';
    if(res.status===401 && !j.error) msg = 'Fungsi staf menolak sesi ini. Matikan Verify JWT pada fungsi staff-admin, atau login ulang.';
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return j;
}

    if(op.k==='fruit' && !fids.has(op.row.id)){ fids.add(op.row.id); fr.push({id:op.row.id, name:op.row.name, hidden:false, unit:op.row.unit||'kg', pcs_weight:op.row.pcs_weight||null, _p:true}); }
    if(op.k==='supply' && !sids.has(op.row.id)){ sids.add(op.row.id); sp.push({id:op.row.id, name:op.row.name, unit:op.row.unit, min_stock:op.row.min_stock==null?null:op.row.min_stock, hidden:false, _p:true}); }
    if(op.k==='entry') op.rows.forEach(r => { if(!em.has(r.id)) em.set(r.id, Object.assign({}, r, {created_at:new Date(op.ts).toISOString(), _p:true})); });
    if(op.k==='sentry') op.rows.forEach(r => { if(!sem.has(r.id)) sem.set(r.id, Object.assign({}, r, {created_at:new Date(op.ts).toISOString(), _p:true})); });
    if(op.k==='del') del.add(op.id);
    if(op.k==='sdel') sdel.add(op.id);
  });
  st.queue.forEach(op => { if(op.k==='upd'){ const m = op.t==='supply_entries' ? sem : em, c0 = m.get(op.id); if(c0) m.set(op.id, Object.assign({}, c0, op.patch, {_edited:true})); } });
  const mark = (e, set) => (set.has(e.id) && !e.deleted_at) ? Object.assign({}, e, {deleted_at:new Date().toISOString()}) : e;
  const all = Array.from(em.values()).map(e => mark(e, del));
  const sAll = Array.from(sem.values()).map(e => mark(e, sdel));
  const fmap = {}; fr.forEach(f => { fmap[f.id] = f; });
  const smap = {}; sp.forEach(s => { smap[s.id] = s; });
  memo = {v:st.ver, all, live:all.filter(e=>!e.deleted_at), fruits:fr, fmap, sAll, sLive:sAll.filter(e=>!e.deleted_at), supplies:sp, smap};
  return memo;
}
const fruitName = id => { const f = derived().fmap[id]; return f ? f.name : '(buah dihapus)'; };
const findFruit = name => { const l = name.toLowerCase(); return derived().fruits.find(f => f.name.trim().toLowerCase()===l) || null; };

function stock(){
  const d = derived(), m = {};
  const get = id => m[id] || (m[id] = {masuk:0,produksi:0,eceran:0,waste:0,koreksi:0,frozen:0,dari_freezer:0,fnet:0});
  d.fruits.forEach(f => get(f.id));
  d.live.forEach(e => {
    const r = get(e.fruit_id); r[e.type] += Number(e.kg); if(e.type==='frozen') r.fnet += Number(e.kg_net||0);
    const f = d.fmap[e.fruit_id];
    if(isPcs(f) && e.type!=='dari_freezer'){ r.p = r.p || {}; r.p[e.type] = (r.p[e.type]||0) + pcsOf(e, f); }
  });
  Object.values(m).forEach(r => {
    const p = r.p || {}, g = k => p[k]||0;
    // Stok gudang dalam pcs (hanya untuk buah yang dihitung per pcs)
    r.stokPcs = Math.round((g('masuk') + g('koreksi') - g('produksi') - g('eceran') - g('waste') - g('frozen'))*100)/100;
    // Stok gudang: buah yang dibekukan dihitung masuk produksi (berat kotor keluar dari gudang)
    r.stok = Math.round((r.masuk + r.koreksi - r.produksi - r.eceran - r.waste - r.frozen)*100)/100;
    // Stok freezer: berat bersih yang dibekukan dikurangi yang diambil ke dapur
    r.freezer = Math.round((r.fnet - r.dari_freezer)*100)/100;
  });
  return m;
}
function monthStats(m){
  const r = {masuk:0,produksi:0,eceran:0,waste:0,koreksi:0,frozen:0,dari_freezer:0,fnet:0,kupas:0,cats:{},stages:{},fruits:{},yield:{},kotor:0,bersih:0,noNet:0,noNetF:{},direct:0,dapur:{},segar:0,beku:0};
  derived().live.filter(e => e.entry_date.startsWith(m)).forEach(e => {
    const k = Number(e.kg); r[e.type] += k;
    const name = fruitName(e.fruit_id);
    const f = r.fruits[name] || (r.fruits[name] = {masuk:0,waste:0,kupas:0});
    if(e.type==='masuk') f.masuk += k;
    if(e.type==='produksi' || e.type==='frozen'){
      if(e.kg_net!=null){
        // Sisa kupas (kulit, biji) = berat kotor dikurangi berat bersih. Dipisah dari waste:
        // sisa kupas dipantau lewat rendemen, waste hanya yang bisa dikendalikan (busuk, memar, jatuh, lainnya).
        const net = Number(e.kg_net), peel = Math.max(0, k-net);
        const y = r.yield[name] || (r.yield[name] = {kotor:0,bersih:0});
        y.kotor += k; y.bersih += net; r.kotor += k; r.bersih += net; if(e.type==='frozen') r.fnet += net;
        r.kupas += peel; f.kupas += peel;
      } else if(isDirect(e)){ r.direct += k; }
      else { r.noNet += k; r.noNetF[name] = (r.noNetF[name]||0) + k; }
    }
    // Buah masuk dapur produksi (berat bersih): segar dari kupas + beku dari freezer, dipakai bersama
    if((e.type==='produksi' && (e.kg_net!=null || isDirect(e))) || e.type==='dari_freezer'){
      const dp = r.dapur[e.fruit_id] || (r.dapur[e.fruit_id] = {segar:0, beku:0});
      if(e.type==='produksi'){ const v = e.kg_net!=null ? Number(e.kg_net) : k; dp.segar += v; r.segar += v; } else { dp.beku += k; r.beku += k; }
    }
    if(e.type==='waste'){
      if(e.category==='kupas'){ r.waste -= k; r.kupas += k; f.kupas += k; }   // catatan lama kategori sisa kupas
      else {
        f.waste += k;
        r.cats[e.category] = (r.cats[e.category]||0) + k;
        r.stages[e.stage] = (r.stages[e.stage]||0) + k;
      }
    }
  });
  r.pct = r.masuk>0 ? r.waste/r.masuk*100 : null;              // waste terkendali (tanpa sisa kupas)
  r.rend = r.kotor>0 ? r.bersih/r.kotor*100 : null;              // rendemen: bersih dibagi kotor
  r.pctAll = r.masuk>0 ? (r.waste+r.kupas)/r.masuk*100 : null;  // gabungan, hanya untuk perbandingan
  return r;
}
function detail(e){
  const p = [];
  if(e.pcs!=null && e.type!=='koreksi' && e.kg!=null) p.push(kg(Number(e.kg)));
  if(e.type==='masuk'){ if(e.price) p.push(rp(e.price)+'/kg'); if(e.origin) p.push(e.origin); if(e.ripe_date) p.push('estimasi siap '+dateLabel(e.ripe_date)); }
  if(e.type==='produksi' || e.type==='frozen'){ if(e.kg_net!=null){ const n = Number(e.kg_net), g = Number(e.kg); p.push('bersih '+kg(n)+', hasil '+pct(g>0?n/g*100:0)); } if(e.type==='produksi' && e.menu) p.push(e.menu); }
  if(e.type==='eceran' && e.price) p.push(rp(e.price)+'/kg');
  if(e.type==='waste'){ p.push(CATS[e.category]||e.category); p.push('tahap '+(STAGES[e.stage]||e.stage).toLowerCase()); }
  if(isDirect(e)) p.push('utuh, tanpa kupas');
  else if(e.note) p.push(e.note);
  p.push('oleh '+profName(e.created_by)+(e.created_at?', pukul '+timeLabel(Date.parse(e.created_at)):''));
  if(e.edit_count>0) p.push('diubah '+e.edit_count+'x'+(e.edited_by?' oleh '+profName(e.edited_by):'')+(e.edited_at?', '+dtLabel(Date.parse(e.edited_at)):''));
  if(e._edited) p.push('perubahan belum terkirim');
  return p.join(', ');
}

const INS_KEYS = ['id','entry_date','type','fruit_id','kg','price','origin','menu','category','stage','note','created_by'];
const insPayload = r => { const o = {}; INS_KEYS.forEach(k => { o[k] = r[k]===undefined ? null : r[k]; }); if(r.kg_net!=null) o.kg_net = r.kg_net; if(r.pcs!=null) o.pcs = r.pcs; if(r.ripe_date) o.ripe_date = r.ripe_date; return o; };
const SINS_KEYS = ['id','entry_date','type','supply_id','qty','price','note','created_by'];
const sinsPayload = r => { const o = {}; SINS_KEYS.forEach(k => { o[k] = r[k]===undefined ? null : r[k]; }); if(r.loc!=null) o.loc = r.loc; return o; };

function enqueue(op){ op.ts = Date.now(); st.queue.push(op); saveQueue(); }

function remapFruit(oldId, newId){
  st.queue.forEach(o => { if(o.k==='entry') o.rows.forEach(r => { if(r.fruit_id===oldId) r.fruit_id = newId; }); });
}
async function sendOp(op){
  if(op.k==='fruit'){
    const body = {id:op.row.id, name:op.row.name};
    if(st.migrated6 && op.row.unit==='pcs'){ body.unit = 'pcs'; body.pcs_weight = op.row.pcs_weight==null ? null : op.row.pcs_weight; }
    const r = await api('/rest/v1/fruits?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}, body});
    if(r.ok) return;
    const e = await failure(r);
    if(r.status===409 || e.code==='23505'){
      const list = await jget('/rest/v1/fruits?select=id,name');
      const hit = list.find(f => f.name.trim().toLowerCase()===op.row.name.trim().toLowerCase());
      if(hit){ remapFruit(op.row.id, hit.id); return; }
    }
    throw e;
  }
  if(op.k==='entry'){
    const r = await api('/rest/v1/entries?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}, body:op.rows.map(insPayload)});
    if(!r.ok) throw await failure(r);
    return;
  }
  if(op.k==='del'){
    await patchRow('/rest/v1/entries?id=eq.'+encodeURIComponent(op.id), {deleted_at:op.at});
    return;
  }
  if(op.k==='upd'){
    await patchRow('/rest/v1/'+op.t+'?id=eq.'+encodeURIComponent(op.id), op.patch);
    return;
  }
  if(op.k==='supply'){
    const r = await api('/rest/v1/supplies?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}, body:{id:op.row.id, name:op.row.name, unit:op.row.unit, min_stock:op.row.min_stock==null?null:op.row.min_stock}});
    if(r.ok) return;
    const e = await failure(r);
    if(r.status===409 || e.code==='23505'){
      const list = await jget('/rest/v1/supplies?select=id,name');
      const hit = list.find(s => s.name.trim().toLowerCase()===op.row.name.trim().toLowerCase());
      if(hit){ st.queue.forEach(o => { if(o.k==='sentry') o.rows.forEach(x => { if(x.supply_id===op.row.id) x.supply_id = hit.id; }); }); return; }
    }
    throw e;
  }
  if(op.k==='sentry'){
    const r = await api('/rest/v1/supply_entries?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}, body:op.rows.map(sinsPayload)});
    if(!r.ok) throw await failure(r);
    return;
  }
  if(op.k==='sdel'){
    await patchRow('/rest/v1/supply_entries?id=eq.'+encodeURIComponent(op.id), {deleted_at:op.at});
    return;
  }
}
function describeOp(op){
  if(op.k==='fruit') return 'Buah baru '+op.row.name;
  if(op.k==='supply') return 'Bahan baru '+op.row.name;
  if(op.k==='del' || op.k==='sdel') return 'Hapus satu catatan';
  if(op.k==='upd') return 'Ubah satu catatan';
  if(op.k==='sentry'){ const r = op.rows[0]; return STYPES[r.type].label+' '+fq(Number(r.qty),sUnit(r.supply_id))+' '+sName(r.supply_id); }
  if(op.rows.length>1){
    const r0 = op.rows[0];
    if(r0.note && r0.note.indexOf('Kupas')===0) return 'Kupas '+fruitName(r0.fruit_id)+' (freezer dan dapur)';
    if(op.rows.every(r=>r.type==='koreksi')) return op.rows.length+' koreksi opname';
    return op.rows.length+' catatan impor';
  }
  const r = op.rows[0]; return typeLbl(r)+' '+qtyLbl(r)+' '+fruitName(r.fruit_id);
}
let flushing = false;
async function flush(){
  if(flushing || !st.session) return;
  flushing = true;
  try{
    while(st.queue.length){
      const op = st.queue[0];
      try{ await sendOp(op); st.queue.shift(); saveQueue(); }
      catch(e){
        if(e.net || e.auth || e.status>=500 || e.status===429 || e.status===408) throw e;
        st.rejected.push({desc:describeOp(op), msg:e.message, at:Date.now()});
        st.queue.shift(); saveQueue();
        toast('Satu catatan ditolak server. Ketuk status di atas untuk melihat.');
      }
    }
  } finally { flushing = false; }
}
async function pull(){
  const uid = st.session.user.id;
  const [me, profiles, settings] = await Promise.all([
    jget('/rest/v1/profiles?select=id,email,full_name,role,active&id=eq.'+uid),
    jget('/rest/v1/profiles?select=id,email,full_name,role,active&order=full_name.asc'),
    jget('/rest/v1/settings?select=waste_target&id=eq.1')
  ]);
  // Satuan buah (butuh 6-update.sql). Kalau kolomnya belum ada, semua buah dihitung dalam kg.
  let fruits;
  try{ fruits = await jget('/rest/v1/fruits?select=id,name,hidden,unit,pcs_weight&order=name.asc'); st.migrated6 = true; }
  catch(e){ if(e.net || e.auth) throw e; fruits = await jget('/rest/v1/fruits?select=id,name,hidden&order=name.asc'); st.migrated6 = false; }
  // 7-update.sql: berat rata-rata pcs opsional (catatan buah pcs boleh tanpa berat)
  if(st.migrated6 && !st.migrated7){
    try{ const r = await api('/rest/v1/rpc/db_features', {method:'POST', body:{}}); if(r.ok){ const j = await r.json(); st.migrated7 = !!(j && j.pcs_tanpa_berat); } }
    catch(e){ if(e.net || e.auth) throw e; }
  }
  const from = st.cursor ? new Date(st.cursor-300000).toISOString() : null;
  let off = 0, maxMs = st.cursor||0;
  for(;;){
    let p = '/rest/v1/entries?select=*&order=updated_at.asc,id.asc&limit=1000&offset='+off;
    if(from) p += '&updated_at=gte.'+encodeURIComponent(from);
    const rows = await jget(p);
    rows.forEach(r => { st.entries.set(r.id, r); const ms = Date.parse(r.updated_at); if(ms>maxMs) maxMs = ms; });
    if(rows.length<1000) break;
    off += 1000;
  }
  // Bahan dan kemasan (butuh 3-update.sql di database)
  try{
    const sups = await jget('/rest/v1/supplies?select=id,name,unit,min_stock,hidden&order=name.asc');
    const sfrom = st.sCursor ? new Date(st.sCursor-300000).toISOString() : null;
    let soff = 0, smax = st.sCursor||0;
    for(;;){
      let sp = '/rest/v1/supply_entries?select=*&order=updated_at.asc,id.asc&limit=1000&offset='+soff;
      if(sfrom) sp += '&updated_at=gte.'+encodeURIComponent(sfrom);
      const srows = await jget(sp);
      srows.forEach(r => { st.sEntries.set(r.id, r); const ms = Date.parse(r.updated_at); if(ms>smax) smax = ms; });
      if(srows.length<1000) break;
      soff += 1000;
    }
    st.supplies = sups; st.sCursor = smax; st.migrated = true;
    // Pembaruan 4 (freezer dan stok gudang/dapur): ada kolom loc di supply_entries
    if(!st.migrated2){
      try{ await jget('/rest/v1/supply_entries?select=loc&limit=1'); st.migrated2 = true; }
      catch(e2){ if(e2.net || e2.auth) throw e2; st.migrated2 = false; }
    }
  }catch(e){
    if(e.net || e.auth) throw e;
    if(e.status===404 || e.status===400 || e.code==='PGRST205' || e.code==='42P01'){ st.migrated = false; st.migrated2 = false; }
    else throw e;
  }
  // Paraf harian (butuh 5-update.sql di database)
  try{
    st.reviews = await jget('/rest/v1/daily_reviews?select=review_date,role,reviewed_by,note,created_at&review_date=gte.'+addDays(todayStr(),-60)+'&order=review_date.desc');
    st.migrated5 = true;
  }catch(e){
    if(e.net || e.auth) throw e;
    st.reviews = []; st.migrated5 = false;
  }
  // 8-update.sql: kolom estimasi masak (ripe_date) pada catatan masuk
  try{ await jget('/rest/v1/entries?select=ripe_date&limit=1'); st.migrated8 = true; }
  catch(e){ if(e.net || e.auth) throw e; st.migrated8 = false; }
  // 9-update.sql: manager boleh mengubah catatan (kolom edit_count menandakan fitur aktif)
  try{ await jget('/rest/v1/entries?select=edit_count&limit=1'); st.migrated9 = true; }
  catch(e){ if(e.net || e.auth) throw e; st.migrated9 = false; }
  st.cursor = maxMs;
  st.me = me[0] || null; st.profiles = profiles; st.fruits = fruits;
  st.settings = settings[0] || {waste_target:null};
  st.lastSync = Date.now();
  saveCache(); bump();
}
async function sync(manual){
  if(!st.session) return;
  if(st.syncing){ st.again = true; return; }
  if(!navigator.onLine){ updateHeader(); if(manual) toast('Sedang offline. Catatan terkirim otomatis saat sinyal kembali.'); return; }
  st.syncing = true; updateHeader();
  try{
    await flush();
    await pull();
    st.netFail = false;
    afterSync();
    if(manual) toast('Data sudah terbaru');
  }catch(e){
    if(e.auth) forceLogin('Sesi berakhir. Silakan login lagi.');
    else if(e.net) st.netFail = true;
    else if(manual) toast('Gagal sinkron: '+e.message);
  }finally{
    st.syncing = false; updateHeader();
    if(st.again){ st.again = false; setTimeout(()=>sync(), 300); }
  }
}
function afterSync(){
  if(!st.ready) return;
  if(!st.me || !st.me.active){ renderBlocked(); return; }
  updateNav(); updateHeader();
  if(ui.tab==='catat' || ui.tab==='opname' || (ui.tab==='bahan' && ui.sub==='catat')) return;
  const y = window.scrollY; keepForm(render); window.scrollTo(0,y);
}

const norm = t => String(t==null?'':t).toLowerCase();
const matchQ = (q, ...parts) => { q = norm(q).trim(); return !q || parts.some(p => norm(p).includes(q)); };
function searchBar(key, ph){
  return `<label class="srch"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" data-q="${key}" placeholder="${esc(ph)}" value="${esc(ui.q[key]||'')}" autocomplete="off" enterkeyhint="search" aria-label="${esc(ph)}"></label>`;

function carousel(cards, label, emptyMsg){

// Status pemeraman: batch buah masuk yang masih ada di gudang (FIFO: yang masuk lebih dulu dianggap keluar lebih dulu)
function ripeStatus(){
  const d = derived(), s = stock(), today = todayStr(), out = [];
  const byFruit = {};
  d.live.forEach(e => { if(e.type==='masuk') (byFruit[e.fruit_id] = byFruit[e.fruit_id] || []).push(e); });
  Object.entries(byFruit).forEach(([fid, list]) => {
    const f = d.fmap[fid], r = s[fid]; if(!f || !r) return;
    const P = isPcs(f), qty = e => P ? pcsOf(e, f) : Number(e.kg||0);
    let left = P ? r.stokPcs : r.stok; if(!(left>0)) return;
    list.sort((a,b)=>b.entry_date.localeCompare(a.entry_date) || Date.parse(b.created_at)-Date.parse(a.created_at));
    for(const e of list){
      if(left<=0.001) break;
      const q = Math.min(qty(e), left); left -= q;
      if(!e.ripe_date || q<=0) continue;
      const days = daysBetween(today, e.ripe_date);
      out.push({f, e, q, P, days, st: days < -RIPE_LATE ? 'late' : days<=0 ? 'now' : 'wait'});
    }
  });
  return out.sort((a,b)=>a.days-b.days);
}
const ripeTxt = x => x.st==='late' ? `lewat ${-x.days} hari` : x.days===0 ? 'siap hari ini' : x.days<0 ? `siap sejak ${-x.days} hari lalu` : x.days===1 ? 'besok' : `${x.days} hari lagi`;
function ripeBox(){
  const l = ripeStatus(); if(!l.length) return '';
  const ready = l.filter(x=>x.st!=='wait').length;
  const items = l.slice(0,8).map(x=>`<div class="ripe-i ${x.st}"><span><strong>${esc(x.f.name)}</strong> ${x.P?fpcs(x.q):kg(x.q)}<br><span class="hint">masuk ${esc(dateLabel(x.e.entry_date))}</span></span><b>${ripeTxt(x)}</b></div>`).join('');
  return `<section class="card ripe-box"><h2>${ready?`${ready} batch siap diproses atau dibekukan`:'Status pemeraman'}</h2><div class="ripe-l">${items}</div>
    ${l.length>8?`<p class="hint" style="margin-top:6px">Dan ${l.length-8} batch lainnya.</p>`:''}
    <p class="hint" style="margin-top:8px">Dari estimasi saat catat buah masuk. Batch yang lebih dulu masuk dianggap sudah terpakai lebih dulu.</p></section>`;
}
function lowBox(){

async function submitEntry(form){
  const fd = new FormData(form), t = ui.type;
  if(!catTypes().includes(t)){ toast('Perananmu tidak bisa membuat catatan ini.'); return; }
  const typed = normName(fd.get('fruit')), known = findFruit(typed);
  const num = k => parseFloat(String(fd.get(k)||'').replace(',','.'));
  const u = String(fd.get('u')||'kg'), q = num('kg'), pcsF = u==='pcs';
  const date = String(fd.get('date')||''), errs = [];
  if(!date) errs.push('Isi tanggal.'); else if(date>todayStr()) errs.push('Tanggal tidak boleh di masa depan.');
  if(!typed) errs.push('Isi jenis buah.');
  if(pcsF && !isPcs(known)) errs.push('Satuan pcs hanya untuk buah yang diatur pcs. Pilih ulang buahnya.');
  let kgv = toKg(q, u, known), pcs = pcsF ? q : null;
  if(!isFinite(q) || q<=0) errs.push('Isi jumlah lebih dari 0.');
  else {
    if(pcsF){ const a = num('act'); if(isFinite(a) && a>0) kgv = a; }
    // Buah pcs tanpa berat rata-rata dan tidak ditimbang: kg kosong (hanya pcs). Kupas tetap butuh berat.
    if(kgv==null){ if(t==='kupas') errs.push(`Timbang berat kotor ${known?known.name:'buah'} dan isi di kolom berat (wajib untuk kupas).`); }
    else if(!(kgv>0)) errs.push('Jumlah terlalu kecil. Periksa lagi angkanya.');
    else if(kgv>99999) errs.push('Jumlah terlalu besar. Periksa lagi angkanya.');
  }
  const r2 = n => Math.round(n*100)/100;
  const mk = (type, kgx, x) => Object.assign({id:uuid(), entry_date:date, type, fruit_id:null, kg:kgx==null?null:r2(kgx), price:null, origin:null, menu:null, category:null, stage:null, note:null, created_by:st.me.id}, x||{});
  // Harga disimpan per kg. Buah pcs tanpa berat: harga per pcs dicatat di kolom catatan.
  const priceIn = num('price'), okP = isFinite(priceIn) && priceIn>=0;
  const price = okP ? (pcsF ? (kgv>0 ? r2(priceIn*pcs/kgv) : null) : priceIn) : null;
  const pNote = okP && pcsF && !(kgv>0) ? `Harga ${rp(priceIn)}/pcs` : null;
  let rows = [], net = null;
  if(t==='masuk'){
    const o = String(fd.get('origin')||'').trim(), rv = String(fd.get('ripe')||'').trim(), rd = parseInt(rv,10);
    let ripe_date = null;
    if(rv!==''){ if(!isFinite(rd) || rd<0 || rd>60) errs.push('Estimasi siap diproses diisi 0 sampai 60 hari, atau kosongkan.'); else ripe_date = date ? addDays(date, rd) : null; }
    rows = [mk('masuk', kgv, {price, origin:o||null, pcs, note:pNote, ripe_date})];
  }
  if(t==='eceran') rows = [mk('eceran', kgv, {price, pcs, note:pNote})];
  if(t==='dapur'){
    if(kgv==null) errs.push(`Timbang ${known?known.name:'buah'} dan isi beratnya (wajib untuk catatan ke dapur).`);
    const menu = String(fd.get('menu')||'').trim() || null;
    rows = [mk('produksi', kgv, {pcs, menu, note:DIRECT_NOTE})];
  }
  if(t==='dari_freezer'){
    if(!st.migrated2) errs.push('Fitur freezer belum aktif. Minta manager menjalankan 4-update.sql di Supabase.');
    rows = [mk('dari_freezer', kgv, {note: u==='bks' ? `${nf.format(q)} bungkus` : null})];
  }
  if(t==='waste'){
    const cat = String(fd.get('cat')||'') || null, stage = String(fd.get('stage')||'') || null, n = String(fd.get('note')||'').trim() || null;
    if(!cat) errs.push('Pilih kategori waste.');
    if(!stage) errs.push('Pilih tahap terjadinya waste.');
    if(cat==='lainnya' && !n) errs.push('Tulis alasan waste pada catatan.');
    rows = [mk('waste', kgv, {category:cat, stage, note:n, pcs})];
  }
  if(t==='kupas'){
    net = toKg(num('net'), String(fd.get('nu')||'kg'), null);
    const dest = destOpts().includes(ui.dest) ? ui.dest : destOpts()[0], menu = String(fd.get('menu')||'').trim() || null;
    if(!isFinite(net) || net<=0) errs.push('Isi berat bersih setelah dikupas, lebih dari 0.');
    else if(kgv!=null && isFinite(kgv) && net>kgv+0.0001) errs.push('Berat bersih tidak boleh lebih besar dari berat kotor.');
    if(!st.migrated) errs.push('Database belum diperbarui. Minta manager menjalankan 3-update.sql di Supabase.');
    if(dest!=='dapur' && !st.migrated2) errs.push('Fitur freezer belum aktif. Minta manager menjalankan 4-update.sql di Supabase.');
    if(!errs.length){
      if(dest==='dapur') rows = [mk('produksi', kgv, {kg_net:r2(net), menu, pcs})];
      else if(dest==='freezer') rows = [mk('frozen', kgv, {kg_net:r2(net), pcs, note:`${bks(net)} masuk freezer`})];
      else {
        const z = toKg(num('z'), String(fd.get('zu')||'bks'), null);
        if(!(z>0)) errs.push('Isi jumlah yang masuk freezer.');
        else if(z>=net) errs.push('Yang masuk freezer harus lebih kecil dari berat bersih.');
        else {
          // Berat kotor dan pcs dibagi sebanding dengan berat bersih, supaya hasil kupas kedua bagian sama
          const share = z/net, gF = r2(kgv*share), gD = r2(r2(kgv)-gF);
          const nF = Math.min(r2(z), gF), nD = Math.min(r2(r2(net)-nF), gD);
          const pF = pcs!=null ? r2(pcs*share) : null, pD = pcs!=null ? r2(pcs-pF) : null;
          const note = `Kupas ${kg(kgv)}: freezer ${kg(nF)} (${bks(nF)}), dapur ${kg(nD)}`;
          if(gF<=0 || gD<=0 || nF<=0 || nD<=0) errs.push('Pembagian terlalu kecil. Periksa lagi angkanya.');
          else rows = [mk('frozen', gF, {kg_net:nF, pcs:pF>0?pF:null, note}), mk('produksi', gD, {kg_net:nD, menu, pcs:pD>0?pD:null, note})];
        }
      }
    }
  }
  rows.forEach(r => { if(r.pcs==null || !st.migrated6) delete r.pcs; if(!r.ripe_date || !st.migrated8) delete r.ripe_date; });
  if(rows.some(r => !allowedTypes().includes(r.type))) errs.push('Perananmu tidak bisa membuat catatan ini.');
  const box = $('#f-err');
  if(errs.length){ box.innerHTML = `<div class="err" role="alert"><ul>${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; box.scrollIntoView({block:'center'}); return; }
  box.innerHTML = '';
  let fname = known ? known.name : typed;
  if(!known){
    const sim = derived().fruits.find(f => similar(f.name, typed));
    if(sim){
      const okNew = await ask('Buah baru?', `"${typed}" mirip dengan "${sim.name}" yang sudah ada. Simpan sebagai buah baru?`, 'Ya, buah baru');
      if(!okNew){ const fi = $('#f-fruit'); if(fi) fi.focus(); return; }
    }
  }
  if(t!=='masuk'){
    const sx = known ? stock()[known.id] : null, fz = t==='dari_freezer';
    const avail = sx ? (fz ? sx.freezer : (pcsF ? sx.stokPcs : sx.stok)) : 0, need = pcsF ? q : kgv;
    if(need > avail + 0.001){
      const show = pcsF ? fpcs : kg;
      const msg = fz
        ? `Stok freezer ${fname} tercatat ${kg(avail)} (${bks(Math.max(0,avail))}), sedangkan yang akan diambil ${kg(kgv)}. Pastikan catatan kupas ke freezer sudah diisi. Tetap simpan?`
        : `Stok ${fname} tercatat ${show(avail)}, sedangkan yang akan dicatat keluar ${show(need)}. Pastikan catatan buah masuk sudah diisi. Tetap simpan?`;
      if(!await ask('Stok tidak cukup', msg, 'Tetap simpan')) return;
    }
  }
  if(net!=null){
    const ref = yieldRef(known ? known.id : null, fname), p = net/kgv*100;
    const dv = ref ? yieldDev(p, ref.p) : null;
    if(dv==='low' || dv==='high'){
      const ok = await ask(dv==='low' ? 'Hasil kupas di bawah biasanya' : 'Hasil kupas jauh di atas biasanya', `Hasil ${fname} ${pct(p)} (${kg(net)} bersih dari ${kg(kgv)} kotor). Biasanya sekitar ${pct(ref.p)}. ${dv==='low'?'Pastikan angkanya tidak salah ketik.':'Bagus kalau benar, tapi pastikan timbangan kotor dan bersih tidak tertukar atau salah ketik.'} Tetap simpan?`, 'Tetap simpan');
      if(!ok){ const ni = $('#f-net'); if(ni) ni.focus(); return; }
    }
  }
  let fid = known ? known.id : uuid();
  if(!known) enqueue({k:'fruit', row:{id:fid, name:typed}});
  rows.forEach(r => { r.fruit_id = fid; });
  enqueue({k:'entry', rows});
  ui.draft = {date, fruit:fname};
  ui.unit[t] = u; if(t==='kupas'){ ui.unit.net = String(fd.get('nu')||'kg'); if(fd.get('zu')) ui.unit.z = String(fd.get('zu')); }
  saveUnits();
  const qty = pcsF ? fpcs(q) : (u==='bks' ? `${nf.format(q)} bungkus (${kg(kgv)})` : kg(kgv));
  let msg = `Tersimpan: ${t==='kupas'?'kupas':t==='dapur'?'ke dapur':TYPES[t].label.toLowerCase()} ${qty} ${fname}`;
  if(t==='kupas'){
    const fz = rows.find(r=>r.type==='frozen'), dp = rows.find(r=>r.type==='produksi');
    msg += `, hasil ${pct(net/kgv*100)}` + (fz?`, freezer ${kg(fz.kg_net)} (${bks(fz.kg_net)})`:'') + (dp?`, dapur ${kg(dp.kg_net)}`:'');
  }
  toast(msg + (known ? '' : '. Buah baru masuk ke daftar.'));
  render(); updateHeader(); sync();
}

function bars(obj, labels){
  const tot = Object.values(obj).reduce((a,b)=>a+b,0);
  if(!tot) return '<p class="hint">Belum ada waste tercatat pada bulan ini.</p>';
  return '<div class="bars">'+Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<div><div class="bar-l"><span>${esc(labels[k]||k)}</span><b>${kg(v)} (${pct(v/tot*100)})</b></div><div class="bar-t"><i style="width:${(v/tot*100).toFixed(1)}%"></i></div></div>`).join('')+'</div>';
}
/* =====================================================================
   Grafik (SVG inline, tanpa library) dan analisis bahan
   ===================================================================== */
const VIZ = {a:'#1F7A57', b:'#2A78D6', w:'#C2561A'};
const W = 320;
const dshort = d => new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const addDays = (d,n) => { const [y,m,dd] = d.split('-').map(Number); const t = new Date(y,m-1,dd+n); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); };
const daysIn = m => { const [y,mo] = m.split('-').map(Number); return new Date(y,mo,0).getDate(); };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const cnum = n => n>=1000 ? nf1.format(n/1000)+' rb' : nf1.format(Math.round(n*10)/10);
function niceMax(v){
  if(!(v>0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v/p;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
}
function topRound(x,y,w,h,r){
  if(h<=0) return '';
  r = Math.min(r, w/2, h);
  return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
}
function gridY(mx, L, R, T, B, fmt){
  const H = B-T;
  return [0,.5,1].map(f => {
    const y = B - H*f, v = mx*f;
    return `<line class="ax" x1="${L}" x2="${R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`;
  }).join('');
}
/* Kolom berkelompok. series: [{name,color,vals}], target: angka atau null, lastLabel: tampilkan nilai di kolom terakhir */
function colChart(labels, series, o){
  o = o || {};
  const fmt = o.fmt || cnum, tipFmt = o.tipFmt || fmt;
  const L = 34, R = W-4, T = 16, B = 128, H = B-T, n = labels.length, slot = (R-L)/n;
  let top = 0; series.forEach(s => s.vals.forEach(v => { if(v>top) top = v; }));
  if(o.target!=null && o.target>top) top = o.target;
  const mx = niceMax(top*1.08);
  const ns = series.length, bw = Math.min(ns>1?15:24, slot*0.7/ns), gap = ns>1?2:0, gw = ns*bw+(ns-1)*gap;
  const y = v => B - H*(v/mx);
  let g = gridY(mx, L, R, T, B, fmt), hits = '';
  labels.forEach((lb, i) => {
    const cx = L + slot*i + slot/2, x0 = cx - gw/2;
    series.forEach((s, k) => {
      const v = s.vals[i]; if(!(v>0)) return;
      const h = Math.max(2, H*(v/mx)), bx = x0 + k*(bw+gap);
      g += `<path d="${topRound(bx, B-h, bw, h, 4)}" fill="${s.color}"/>`;
    });
    if(o.lastLabel && i===n-1){
      series.forEach((s, k) => { const v = s.vals[i]; if(v>0) g += `<text class="vl" x="${x0 + k*(bw+gap) + bw/2}" y="${y(v)-5}" text-anchor="middle">${fmt(v)}</text>`; });
    }
    g += `<text x="${cx}" y="${B+16}" text-anchor="middle">${esc(lb)}</text>`;
    const tip = lb + '\n' + series.map(s => s.name+': '+tipFmt(s.vals[i]||0)).join('\n');
    hits += `<rect class="hit" tabindex="0" role="img" aria-label="${esc(tip.replace(/\n/g,', '))}" data-tip="${esc(tip)}" x="${L+slot*i}" y="${T-6}" width="${slot}" height="${H+30}"/>`;
  });
  if(o.target!=null){
    const ty = y(o.target);
    g += `<line class="tg" x1="${L}" x2="${R}" y1="${ty}" y2="${ty}"/><text x="${L+4}" y="${ty-4}" text-anchor="start">${esc(o.targetLabel||'Target')}</text>`;
  }
  return `<svg class="viz" viewBox="0 0 ${W} ${B+24}" role="group" aria-label="${esc(o.label||'Grafik')}">${g}${hits}</svg>`;
}
/* Garis kecil satu seri dengan wash 10%. vals: angka, labels: label x, unit: satuan */
function lineChart(labels, tips, vals, unit, color){
  const L = 4, R = W-14, T = 18, B = 66, H = B-T, n = vals.length;
  const mx = niceMax(Math.max.apply(null, vals.concat([0]))*1.1);
  const xs = i => n>1 ? L + (R-L)*i/(n-1) : (L+R)/2, ys = v => B - H*(v/mx);
  const pts = vals.map((v,i) => [xs(i), ys(v)]);
  const line = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
  const area = line + `L${pts[n-1][0].toFixed(1)},${B}L${pts[0][0].toFixed(1)},${B}Z`;
  let hits = '';
  const step = (R-L)/Math.max(1,n-1);
  vals.forEach((v,i) => {
    const tip = tips[i]+'\n'+fq(v, unit);
    hits += `<rect class="hit" tabindex="0" role="img" aria-label="${esc(tip.replace(/\n/g,': '))}" data-tip="${esc(tip)}" x="${(xs(i)-step/2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${B+22}"/>`;
  });
  const last = pts[n-1];
  return `<svg class="viz" viewBox="0 0 ${W} ${B+22}" role="group">
    <line class="ax" x1="${L}" x2="${R}" y1="${B}" y2="${B}"/><line class="ax" x1="${L}" x2="${R}" y1="${T}" y2="${T}"/>
    <text x="${L}" y="${T-5}">${cnum(mx)}</text>
    <path d="${area}" fill="${color}" fill-opacity=".1"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="${color}" stroke="#fff" stroke-width="2"/>
    <text x="${L}" y="${B+16}">${esc(labels[0])}</text><text x="${R}" y="${B+16}" text-anchor="end">${esc(labels[n-1])}</text>${hits}</svg>`;
}
function legend(items){ return `<div class="leg">${items.map(i=>`<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`; }
function tableHtml(head, rows){
  return `<div class="tw"><table><thead><tr>${head.map((h,i)=>`<th${i?' class="n"':''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="n"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function meter(pctVal, target){
  const mx = Math.max(target!=null?target*2:0, pctVal*1.15, 5);
  const col = target==null ? VIZ.a : (pctVal<=target ? VIZ.a : pctVal<=target*1.25 ? '#E0A020' : VIZ.w);
  return `<div class="meter" role="img" aria-label="Waste ${pct(pctVal)}${target!=null?' dari target '+pct(target):''}"><i style="width:${Math.min(100,pctVal/mx*100).toFixed(1)}%;background:${col}"></i>${target!=null?`<u style="left:${(target/mx*100).toFixed(1)}%"><span>Target ${pct(target)}</span></u>`:''}</div>`;
}

/* ---------- Tooltip (sentuh atau arahkan) ---------- */
let tipEl = null, tipFor = null;
function showTip(el){
  if(!tipEl){ tipEl = document.createElement('div'); tipEl.id = 'tip'; tipEl.setAttribute('role','tooltip'); document.body.appendChild(tipEl); }
  tipFor = el; tipEl.innerHTML = esc(el.getAttribute('data-tip')).replace(/\n/g,'<br>');
  const r = el.getBoundingClientRect(), tw = tipEl.offsetWidth || 160;
  let x = r.left + r.width/2 - tw/2; x = Math.max(8, Math.min(window.innerWidth - tw - 8, x));
  tipEl.style.left = x+'px'; tipEl.style.top = Math.max(8, r.top - (tipEl.offsetHeight||44) - 6)+'px';
  tipEl.classList.add('on');
}
function hideTip(){ if(tipEl) tipEl.classList.remove('on'); tipFor = null; }
document.addEventListener('pointerover', e => { if(e.pointerType==='mouse'){ const t = e.target.closest('[data-tip]'); if(t) showTip(t); else hideTip(); } });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if(t) showTip(t); });
document.addEventListener('focusout', hideTip);
document.addEventListener('pointerdown', e => { const t = e.target.closest('[data-tip]'); if(t && e.pointerType!=='mouse') showTip(t); else if(!t) hideTip(); });
window.addEventListener('scroll', hideTip, {passive:true});
document.addEventListener('scroll', e => { const t = e.target; if(t && t.classList && t.classList.contains('car-track')) carUpdate(t); }, true);

/* ---------- Analisis stok bahan ---------- */
function supAnchor(m){ const end = m+'-'+pad(daysIn(m)); return end < todayStr() ? end : todayStr(); }
const STATUS = {
  aman:{label:'Aman', icon:'✓'}, menipis:{label:'Menipis', icon:'!'}, segera:{label:'Segera beli', icon:'!'},
  habis:{label:'Habis', icon:'✕'}, minus:{label:'Stok minus', icon:'✕'}, nodata:{label:'Belum ada pemakaian', icon:'–'}
};
function analyzeSupplies(m){
  const d = derived(), s = supplyStock(), anchor = supAnchor(m), from = addDays(anchor, -27), m2 = st.migrated2;
  const rows = [];
  d.supplies.filter(x => !x.hidden || (s[x.id] && s[x.id].stok!==0)).forEach(x => {
    const r = s[x.id] || {stok:0,gudang:0,dapur:0,masuk:0,pakai:0,rusak:0};
    const ent = d.sLive.filter(e => e.supply_id===x.id);
    const first = ent.reduce((a,e) => (!a || e.entry_date<a) ? e.entry_date : a, null);
    const use28 = ent.filter(e => e.type==='pakai' && e.entry_date>=from && e.entry_date<=anchor).reduce((t,e)=>t+Number(e.qty),0);
    const bad28 = ent.filter(e => e.type==='rusak' && e.entry_date>=from && e.entry_date<=anchor).reduce((t,e)=>t+Number(e.qty),0);
    const span = first ? Math.max(7, Math.min(28, daysBetween(first, anchor)+1)) : 28;
    const rate = use28>0 ? use28/span : 0;
    const total = m2 ? r.gudang + r.dapur : r.stok;
    const left = rate>0 ? Math.max(0, total/rate) : null;
    let status = 'aman';
    if((m2 && (r.gudang<0 || r.dapur<0)) || (!m2 && r.stok<0)) status = 'minus';
    else if(rate>0 && total<=0) status = 'habis';
    else if(left!=null && left<=7) status = 'segera';
    else if((left!=null && left<=14) || (x.min_stock!=null && (m2?r.gudang:r.stok) <= Number(x.min_stock))) status = 'menipis';
    else if(rate===0 && !ent.length) status = 'nodata';
    const buy = rate>0 ? Math.max(0, Math.ceil(rate*14 - total)) : 0;
    rows.push({x, r, total, rate, left, status, buy, use28, bad28, badPct: (use28+bad28)>0 ? bad28/(use28+bad28)*100 : null});
  });
  const rank = {minus:0, habis:1, segera:2, menipis:3, aman:4, nodata:5};
  rows.sort((a,b) => rank[a.status]-rank[b.status] || (a.left==null?1e9:a.left)-(b.left==null?1e9:b.left) || a.x.name.localeCompare(b.x.name,'id'));
  return rows;
}
function supTrend(mode, m){
  const d = derived(), anchor = supAnchor(m), bk = [];
  if(mode==='bulan'){
    for(let i=5;i>=0;i--){ const mm = addMonths(m,-i); bk.push({s:mm+'-01', e:mm+'-'+pad(daysIn(mm)), label:monthShort(mm), full:monthLabel(mm)}); }
  } else {
    for(let k=7;k>=0;k--){ const e = addDays(anchor,-7*k), s0 = addDays(e,-6); bk.push({s:s0, e, label:dshort(s0), full:dshort(s0)+' – '+dshort(e)}); }
  }
  const use = {};
  d.sLive.forEach(e => {
    if(e.type!=='pakai') return;
    const b = bk.findIndex(x => e.entry_date>=x.s && e.entry_date<=x.e); if(b<0) return;
    const a = use[e.supply_id] || (use[e.supply_id] = bk.map(()=>0)); a[b] += Number(e.qty);
  });
  return {bk, use};
}

function viewLapBahan(m){
  if(!st.migrated) return `<section class="card empty"><h2>Database belum diperbarui</h2><p>Analisis bahan butuh pembaruan database. Minta manager menjalankan 3-update.sql di Supabase.</p></section>`;
  const rows = analyzeSupplies(m);
  if(!rows.length) return `<section class="card empty"><h2>Belum ada bahan</h2><p>Tambahkan bahan di tab Bahan, lalu catat pemakaiannya. Analisis muncul setelah ada catatan.</p></section>`;
  const urgent = rows.filter(r => ['minus','habis','segera'].includes(r.status)).length;
  const thin = rows.filter(r => r.status==='menipis').length;
  const use = rows.reduce((t,r)=>t+r.use28,0), bad = rows.reduce((t,r)=>t+r.bad28,0);
  const tiles = `<section class="grid2">
      <div><span class="lbl">Perlu dibeli segera</span><br><strong>${urgent} bahan</strong></div>
      <div><span class="lbl">Stok menipis</span><br><strong>${thin} bahan</strong></div></section>`;
  const list = rows.map(r => {
    const x = r.x, S = STATUS[r.status], m2 = st.migrated2;
    const stock = m2 ? `${fq(r.r.gudang,x.unit)} di gudang, ${fq(r.r.dapur,x.unit)} di dapur` : fq(r.r.stok,x.unit);
    return `<article class="an">
      <div class="an-h"><strong>${esc(x.name)}</strong><span class="pill st-${r.status}"><span aria-hidden="true">${S.icon}</span>${S.label}</span></div>
      <dl>
        <div><dt>Stok sekarang</dt><dd>${esc(stock)}</dd></div>
        <div><dt>Pemakaian rata-rata</dt><dd>${r.rate>0?fq(Math.round(r.rate*10)/10,x.unit)+' per hari':'–'}</dd></div>
        <div><dt>Perkiraan cukup untuk</dt><dd>${r.left==null?'–':(r.left<1?'kurang dari 1 hari':'±'+nf.format(Math.floor(r.left))+' hari')}</dd></div>
        <div><dt>Rusak atau hilang (28 hari)</dt><dd>${r.badPct==null?'–':pct(r.badPct)}</dd></div>
      </dl>
      ${r.buy>0?`<p class="buy">Saran beli sekitar <b>${fq(r.buy,x.unit)}</b> agar cukup 14 hari.</p>`:''}
    </article>`;
  }).join('');
  const mode = ui.tmode, tr = supTrend(mode, m);
  const ranked = rows.filter(r => tr.use[r.x.id] && tr.use[r.x.id].some(v=>v>0)).sort((a,b) => tr.use[b.x.id].reduce((p,c)=>p+c,0) - tr.use[a.x.id].reduce((p,c)=>p+c,0));
  const labels = tr.bk.map(b => b.label);
  const cards = ranked.slice(0,8).map(r => {
    const v = tr.use[r.x.id], tot = v.reduce((p,c)=>p+c,0), last = v[v.length-1], prev = v[v.length-2] || 0;
    const delta = prev>0 ? ((last-prev)/prev*100) : null;
    const tl = tr.bk.map((b,i)=>b.full);
    return `<div class="sm"><div class="sm-h"><strong>${esc(r.x.name)}</strong><span>${fq(tot,r.x.unit)} total</span></div>
      ${lineChart(labels, tl, v, r.x.unit, VIZ.a)}
      <p class="hint">${mode==='bulan'?'Bulan ini':'Minggu terakhir'} ${fq(last,r.x.unit)}${delta==null?'':', '+(delta>=0?'naik ':'turun ')+pct(Math.abs(delta))+' dari sebelumnya'}.</p></div>`;
  }).join('');
  const tableRows = ranked.map(r => [r.x.name+' ('+r.x.unit+')'].concat(tr.use[r.x.id].map(v => nf.format(Math.round(v*10)/10))));
  const trendSec = `<section class="card sec"><h2>Tren pemakaian</h2>
      <div class="chips" role="group" aria-label="Rentang tren" style="margin-bottom:10px"><button class="chip" data-act="tmode" data-v="minggu" aria-pressed="${mode==='minggu'}">8 minggu</button><button class="chip" data-act="tmode" data-v="bulan" aria-pressed="${mode==='bulan'}">6 bulan</button></div>
      ${ranked.length ? `<div class="sm-grid">${cards}</div>${ranked.length>8?'<p class="hint" style="margin-top:8px">Menampilkan 8 bahan dengan pemakaian terbanyak.</p>':''}
      <details class="dt"><summary>Lihat angka</summary>${tableHtml(['Bahan'].concat(labels), tableRows)}</details>`
      : '<p class="hint">Belum ada catatan pemakaian pada rentang ini. Catat "Dipakai" di tab Bahan agar tren muncul.</p>'}
    </section>`;
  const sm = supMonth(m), m2 = st.migrated2;
  const sRows = Object.entries(sm).sort((a,b)=>sName(a[0]).localeCompare(sName(b[0]),'id')).map(([id,v])=>`<tr><td>${esc(sName(id))}</td><td class="n">${fq(v.masuk,'')}</td>${m2?`<td class="n">${fq(v.pindah,'')}</td>`:''}<td class="n">${fq(v.pakai,'')}</td><td class="n">${fq(v.rusak,'')}</td><td>${esc(sUnit(id))}</td></tr>`).join('');
  const recap = `<section class="card sec"><h2>Rekap ${esc(monthLabel(m))}</h2><div class="tw"><table><thead><tr><th>Bahan</th><th class="n">${m2?'Masuk gudang':'Masuk'}</th>${m2?'<th class="n">Pindah</th>':''}<th class="n">Dipakai</th><th class="n">Rusak</th><th>Sat.</th></tr></thead><tbody>${sRows||`<tr><td colspan="${m2?6:5}" class="hint">Belum ada data bulan ini.</td></tr>`}</tbody></table></div></section>`;
  return `${tiles}
    <section class="card sec"><h2>Analisis stok</h2><div class="sm-grid" style="grid-template-columns:1fr">${list}</div>
      <p class="hint" style="margin-top:12px">Perkiraan memakai rata-rata pemakaian 28 hari terakhir dan stok gudang ditambah dapur. Makin rutin pemakaian dicatat, makin akurat angkanya.${bad>0?` Rusak atau hilang: ${pct(bad/(use+bad)*100)} dari total pemakaian.`:''}</p></section>
    ${trendSec}${recap}`;
}

// Buah yang masuk dapur produksi (bersih): segar dari kupas langsung + beku dari freezer, dipakai bersama
function dapurSec(cur){

function viewLapBuah(m, cur, prev){
  const target = parseFloat(st.settings.waste_target);
  let tag = '', cmp = '';
  if(cur.pct!=null && isFinite(target)){
    tag = cur.pct<=target ? `<span class="tag ok">Dalam target ${pct(target)}</span>` : `<span class="tag bad">Di atas target ${pct(target)}</span>`;
  }
  if(cur.pct!=null && prev.pct!=null){
    const df = cur.pct-prev.pct;
    cmp = Math.abs(df)<0.05 ? `Sama dengan ${esc(monthLabel(addMonths(m,-1)))}.` :
      `${df>0?'Naik':'Turun'} ${nf1.format(Math.abs(Math.round(df*10)/10))} poin dibanding ${esc(monthLabel(addMonths(m,-1)))}.`;
  }
  const fr = Object.entries(cur.fruits).filter(([,v])=>v.masuk||v.waste||v.kupas).sort((a,b)=>b[1].waste-a[1].waste);
  const frRows = fr.length ? fr.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="n">${kg(v.masuk)}</td><td class="n">${kg(v.waste)}</td><td class="n">${v.masuk>0?pct(v.waste/v.masuk*100):'–'}</td><td class="n muted">${kg(v.kupas)}</td></tr>`).join('')
    : '<tr><td colspan="5" class="hint">Belum ada data bulan ini.</td></tr>';
  const months = [5,4,3,2,1,0].map(i=>addMonths(m,-i));
  const tp = months.map(x=>monthStats(x).pct);
  const hasTrend = tp.some(v=>v!=null);
  const trendChart = hasTrend ? colChart(months.map(monthShort), [{name:'Waste', color:VIZ.w, vals:tp.map(v=>v==null?0:Math.round(v*10)/10)}],
    {fmt:v=>nf1.format(Math.round(v*10)/10)+'%', target:isFinite(target)?target:null, targetLabel:isFinite(target)?'Target '+pct(target):null, lastLabel:true, label:'Waste terkendali per bulan'}) : '<p class="hint">Belum ada data waste.</p>';
  // Buah masuk dan keluar per minggu pada bulan terpilih
  const nd = daysIn(m), nw = Math.ceil(nd/7), inW = new Array(nw).fill(0), outW = new Array(nw).fill(0);
  derived().live.filter(e => e.entry_date.startsWith(m)).forEach(e => {
    const w = Math.min(nw-1, Math.floor((Number(e.entry_date.slice(8,10))-1)/7)), k = Number(e.kg);
    if(e.type==='masuk') inW[w] += k;
    if(e.type==='produksi' || e.type==='frozen' || e.type==='eceran') outW[w] += k;
  });
  const wl = inW.map((_,i)=> (i*7+1)+'–'+Math.min(nd,(i+1)*7));
  const flowSer = [{name:'Masuk', color:VIZ.a, vals:inW.map(v=>Math.round(v*10)/10)}, {name:'Keluar', color:VIZ.b, vals:outW.map(v=>Math.round(v*10)/10)}];
  const flowHas = inW.some(v=>v>0) || outW.some(v=>v>0);
  const flowSec = `<section class="card sec"><h2>Buah masuk dan keluar per minggu</h2>${flowHas ? legend(flowSer)+colChart(wl, flowSer, {fmt:v=>cnum(v), tipFmt:v=>kg(v), label:'Buah masuk dan keluar per minggu'})+`<details class="dt"><summary>Lihat angka</summary>${tableHtml(['Tanggal','Masuk','Keluar'], wl.map((l,i)=>[l, kg(inW[i]), kg(outW[i])]))}</details><p class="hint" style="margin-top:6px">Keluar = ke produksi, ke freezer, dan eceran (dalam kg).</p>` : '<p class="hint">Belum ada data bulan ini.</p>'}</section>`;
  // Rendemen (hasil kupas) per buah: berat bersih dibagi berat kotor, dibanding acuan timbang
  const yEntries = Object.entries(cur.yield).sort((a,b)=>b[1].kotor-a[1].kotor);
  const refOf = n => { const fo = findFruit(n); const r = yieldRef(fo ? fo.id : null, n); return r; };
  const yRows = yEntries.map(([n,v])=>{
    const p = v.bersih/v.kotor*100, ref = refOf(n), off = ref && yieldDev(p, ref.p)==='low';
    return `<tr${off?' class="off"':''}><td>${esc(n)}</td><td class="n">${kg(v.kotor)}</td><td class="n">${kg(v.bersih)}</td><td class="n"><b>${pct(p)}</b></td></tr>`;
  }).join('');
  const yTot = cur.kotor>0 ? `<tr><td><b>Total</b></td><td class="n"><b>${kg(cur.kotor)}</b></td><td class="n"><b>${kg(cur.bersih)}</b></td><td class="n"><b>${pct(cur.rend)}</b></td></tr>` : '';
  const yBars = yEntries.length ? '<div class="bars" style="margin-bottom:14px">'+yEntries.map(([n,v])=>{ const p = v.bersih/v.kotor*100, ref = refOf(n); return `<div><div class="bar-l"><span>${esc(n)}</span><b>${pct(p)}${ref?` <span class="hint">/ acuan ${pct(ref.p)}</span>`:''}</b></div><div class="bar-t"><i style="width:${Math.min(100,p).toFixed(1)}%;background:${VIZ.a}"></i>${ref?`<s style="left:${Math.min(100,ref.p).toFixed(1)}%" title="Acuan"></s>`:''}</div></div>`; }).join('')+'</div>' : '';
  const noNet = Object.entries(cur.noNetF);
  const yieldSec = `<section class="card sec"><h2>Rendemen per buah</h2>
    <p class="hint">Rendemen = berat bersih (daging) dibagi berat kotor (buah utuh) dari catatan Kupas. Makin tinggi makin baik. Garis tipis = acuan.</p>
    <div style="margin-top:12px">${yBars}</div>
    <div class="tw"><table class="fit"><thead><tr><th>Buah</th><th class="n">Kotor</th><th class="n">Bersih</th><th class="n">Rendemen</th></tr></thead><tbody>${yRows?yRows+yTot:'<tr><td colspan="4" class="hint">Belum ada catatan kupas dengan berat bersih bulan ini.</td></tr>'}</tbody></table></div>
    ${noNet.length?`<p class="hint" style="margin-top:8px">Tidak dihitung (kupas tanpa berat bersih, catatan lama): ${noNet.map(([n,k])=>`${esc(n)} ${kg(k)}`).join(', ')}.</p>`:''}
    <p class="hint" style="margin-top:8px">Acuan: hasil timbang Okt 2026 (alpukat 36%, mangga 41%, nangka 45%), atau rata-rata 90 hari buah itu kalau sudah ada minimal 3 catatan. Baris merah = hasil lebih dari ${YIELD_TOL} poin di bawah acuan, cek timbangan atau cara kupas. Hasil di atas acuan tidak ditandai.</p></section>`;
  return `<section class="card kpi"><span class="sub">Waste terkendali ${esc(monthLabel(m))}</span>
      <p class="big">${cur.pct==null?'–':pct(cur.pct)}</p>
      ${cur.pct!=null?meter(cur.pct, isFinite(target)?target:null):''}
      <p class="sub">${cur.masuk>0?`${kg(cur.waste)} busuk, memar, jatuh, dan lainnya dari ${kg(cur.masuk)} buah masuk.`:'Belum ada buah masuk pada bulan ini.'}</p>
      ${tag}${cmp?`<p class="sub">${cmp}</p>`:''}
      <p class="hint">Sisa kupas (kulit dan biji) tidak dihitung di sini. Lihat rendemen di bawah.</p></section>
    <section class="card kpi rend"><span class="sub">Rendemen kupas ${esc(monthLabel(m))}</span>
      <p class="big">${cur.rend==null?'–':pct(cur.rend)}</p>
      <p class="sub">${cur.kotor>0?`${kg(cur.bersih)} daging bersih dari ${kg(cur.kotor)} buah utuh yang dikupas. Sisa kupas ${kg(cur.kupas)}.`:'Belum ada catatan kupas dengan berat bersih bulan ini.'}</p>
      ${cur.pctAll!=null?`<p class="hint">Kalau digabung (waste + sisa kupas): ${pct(cur.pctAll)} dari buah masuk.</p>`:''}</section>
    <section class="grid2">
      <div><span class="lbl">Masuk</span><br><strong>${kg(cur.masuk)}</strong></div>
      <div><span class="lbl">Ke produksi</span><br><strong>${kg(cur.produksi+cur.frozen)}</strong>${cur.frozen>0?`<br><span class="hint">termasuk ${kg(cur.frozen)} ke freezer</span>`:''}</div>
      <div><span class="lbl">Eceran</span><br><strong>${kg(cur.eceran)}</strong></div>
      <div><span class="lbl">Koreksi opname</span><br><strong>${skg(cur.koreksi)}</strong></div>
      ${st.migrated2?`<div><span class="lbl">Dibekukan (bersih)</span><br><strong>${kg(cur.fnet)}</strong></div>
      <div><span class="lbl">Dari freezer ke dapur</span><br><strong>${kg(cur.dari_freezer)}</strong></div>`:''}
    </section>
    <section class="card sec"><h2>Waste terkendali 6 bulan terakhir</h2>${trendChart}${hasTrend?`<details class="dt"><summary>Lihat angka</summary>${tableHtml(['Bulan','Waste'], months.map((x,i)=>[monthLabel(x), tp[i]==null?'–':pct(tp[i])]))}</details>`:''}</section>
    ${flowSec}
    <section class="card sec"><h2>Waste per kategori</h2>${bars(cur.cats, CATS)}</section>
    <section class="card sec"><h2>Waste per tahap</h2>${bars(cur.stages, STAGES)}</section>
    <section class="card sec"><h2>Waste per jenis buah</h2><p class="hint">Waste = busuk, memar, jatuh, lainnya. Sisa kupas ditampilkan terpisah sebagai pembanding, tidak dihitung dalam %.</p><div class="tw" style="margin-top:10px"><table class="fit"><thead><tr><th>Buah</th><th class="n">Masuk</th><th class="n">Waste</th><th class="n">%</th><th class="n">Kupas</th></tr></thead><tbody>${frRows}</tbody></table></div></section>
    ${yieldSec}
    ${dapurSec(cur)}
    ${canManage()?'<button class="btn" data-act="export-csv">Unduh CSV bulan ini</button>':''}`;

function viewRiwayat(){
  const f = ui.filter, rd = ui.rd, today = todayStr();
  const typeOk = e => f==='semua' || (f==='dapur' ? isDirect(e) : f==='produksi' ? (e.type==='produksi' && !isDirect(e)) : e.type===f);
  const dateOk = e => (!rd.from || e.entry_date>=rd.from) && (!rd.to || e.entry_date<=rd.to);
  const listFor = () => derived().live.filter(typeOk).filter(dateOk)
    .filter(e=>matchQ(ui.q.riwayat, fruitName(e.fruit_id), typeLbl(e), detail(e), dateLabel(e.entry_date), e.entry_date))
    .sort((a,b)=>b.entry_date.localeCompare(a.entry_date)||Date.parse(b.created_at)-Date.parse(a.created_at));
  const chips = ['semua','masuk','produksi','dapur'].concat(st.migrated2?['frozen','dari_freezer']:[]).concat(['eceran','waste','koreksi']).map(k=>`<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${k===f}">${k==='semua'?'Semua':k==='dapur'?'Ke dapur':TYPES[k].label}</button>`).join('');
  // Filter tanggal transaksi: pilihan cepat + rentang bebas
  const quick = [['all','Semua tanggal','',''],['today','Hari ini',today,today],['yday','Kemarin',addDays(today,-1),addDays(today,-1)],['7d','7 hari',addDays(today,-6),today],['month','Bulan ini',thisMonth()+'-01',today]];
  const qSel = (quick.find(([,,a,b])=>a===rd.from && b===rd.to)||[''])[0];
  const dchips = quick.map(([k,l,a,b])=>`<button class="chip" data-act="rd" data-from="${a}" data-to="${b}" aria-pressed="${k===qSel}">${l}</button>`).join('');
  const dsec = `<div class="dfilter"><div class="chips">${dchips}</div>
    <div class="drange"><input type="date" id="rd-from" value="${esc(rd.from)}" max="${today}" aria-label="Dari tanggal"><span>sampai</span><input type="date" id="rd-to" value="${esc(rd.to)}" max="${today}" aria-label="Sampai tanggal">
    ${rd.from||rd.to?'<button type="button" class="btn sm ghost" data-act="rd" data-from="" data-to="">Hapus filter</button>':''}</div></div>`;
  const rowsFor = list => list.slice(0,150).map(e=>`<div class="he ${e._p?'pend':''}"><div class="he-b">
      <div class="he-t"><span class="badge b-${e.type}">${esc(typeLbl(e))}</span><strong>${esc(fruitName(e.fruit_id))}</strong>${e._p?'<span class="badge b-pend">Belum terkirim</span>':''}</div>
      <span class="he-d">${esc(dateLabel(e.entry_date))}, ${esc(detail(e))}</span></div>
      <div style="text-align:right"><div class="he-k">${qtyLbl(e)}</div><div class="he-a">${canEdit(e)?`<button class="x ed" data-act="edit" data-id="${esc(e.id)}">Ubah</button>`:''}${canDelete(e)?`<button class="x" data-act="del" data-id="${esc(e.id)}">Hapus</button>`:''}</div></div></div>`).join('');
  window.__rwList = () => { const list = listFor(), n = $('#rw-n'); if(n) n.textContent = list.length+' catatan'; return list.length?`<div class="hist">${rowsFor(list)}</div>${list.length>150?'<p class="hint">Menampilkan 150 catatan terbaru. Unduh CSV di tab Laporan untuk data lengkap.</p>':''}`:`<section class="card empty"><h2>${ui.q.riwayat?'Tidak ada catatan yang cocok':'Belum ada catatan'}</h2><p>${ui.q.riwayat?'Coba kata lain, misalnya nama buah, jenis catatan, atau tanggal.':'Catatan yang disimpan semua staf akan muncul di sini.'}</p></section>`; };
  return `<div class="row" style="justify-content:space-between;align-items:center"><div class="hint" id="rw-n">${listFor().length} catatan</div>${canManage()?'<button class="btn sm" data-act="settings">Pengaturan</button>':''}</div>
    ${searchBar('riwayat','Cari buah atau jenis')}${dsec}<div class="chips">${chips}</div>
    <div id="lst">${window.__rwList()}</div>`;
}

// Pilihan satuan buah: berat (kg, bisa dicatat dalam gram) atau pcs sungguhan dengan berat rata-rata per pcs
function unitFields(px, unit, w){
  if(!st.migrated6) return canManage() ? `<p class="hint">Pilihan hitung per pcs aktif setelah 6-update.sql dijalankan di Supabase. Sampai saat itu semua buah dihitung dalam kg.</p>` : '';
  return `<div class="field"><label for="${px}-unit">Dihitung dengan</label>
      <select id="${px}-unit" name="unit"><option value="kg" ${unit!=='pcs'?'selected':''}>Berat (kg atau gram), untuk buah yang ditimbang</option><option value="pcs" ${unit==='pcs'?'selected':''}>Pcs (per buah), untuk buah yang dihitung per biji</option></select></div>
    <div class="field" id="${px}-ww" ${unit==='pcs'?'':'hidden'}><label for="${px}-w">Berat rata-rata 1 pcs (gram)${st.migrated7?', boleh kosong':''}</label>
      <input id="${px}-w" name="pcs_weight" type="number" inputmode="decimal" min="1" step="any" value="${esc(w||'')}" placeholder="${st.migrated7?'Kosongkan kalau tidak ditimbang':'Contoh: 1500'}">
      <p class="hint">${st.migrated7
        ? 'Kalau diisi, berat buah yang tidak ditimbang ikut dihitung di waste % dan laporan. Kalau kosong, buah ini dihitung per pcs saja, dan berat hanya tercatat dari catatan yang ditimbang. Untuk catatan kupas, berat kotor tetap harus ditimbang.'
        : 'Dipakai untuk menghitung berat (waste %, laporan) kalau buah tidak ditimbang. Timbang beberapa buah lalu ambil rata-ratanya.'}</p></div>`;
}
function updateUnitForm(sel){ const px = sel.id.split('-')[0], w = document.getElementById(px+'-ww'); if(w) w.hidden = sel.value!=='pcs'; }
function readUnit(fd, errBox){
  if(!st.migrated6) return {unit:'kg', pcs_weight:null};
  const unit = String(fd.get('unit')||'kg')==='pcs' ? 'pcs' : 'kg';
  if(unit==='kg') return {unit, pcs_weight:null};
  const raw = String(fd.get('pcs_weight')||'').trim(), w = parseFloat(raw.replace(',','.'));
  if(!raw && st.migrated7) return {unit, pcs_weight:null};
  if(!isFinite(w) || w<=0){ errBox.innerHTML = `<div class="err" role="alert">${raw?'Berat rata-rata harus lebih dari 0 gram.':'Isi berat rata-rata 1 pcs dalam gram.'}</div>`; return null; }
  return {unit, pcs_weight:Math.round(w*100)/100};
}

function submitEdit(form){
  const id = form.dataset.id, kind = form.dataset.kind, d = derived(), isF = kind==='entries';
  const e = (isF ? d.all : d.sAll).find(x=>x.id===id); if(!e || !canEdit(e)) return;
  const fd = new FormData(form), g = k => fd.get(k), r2 = n => Math.round(n*100)/100, errs = [], patch = {};
  const put = (k, v) => { const o = e[k]==null ? null : e[k]; const same = (typeof v==='number' && o!=null) ? Number(o)===v : (o===v); if(!same) patch[k] = v; };
  const date = String(g('date')||''); if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || date>todayStr()) errs.push('Isi tanggal yang benar, tidak boleh lewat dari hari ini.');
  put('entry_date', date);
  const note = g('note')==null ? null : (String(g('note')).trim() || null);
  if(isF){
    const f = d.fmap[String(g('ref'))], P = f && isPcs(f) && e.type!=='dari_freezer', kor = e.type==='koreksi';
    const needKg = ['produksi','frozen','dari_freezer'].includes(e.type);
    const kgv = pnum(g('kg')), pcs = P ? pnum(g('pcs')) : null;
    const bad = v => v==null || !isFinite(v) || (kor ? v===0 : v<=0);
    if(P){
      if(bad(pcs)) errs.push(kor ? 'Isi jumlah koreksi pcs, tidak boleh 0.' : 'Jumlah pcs harus lebih dari 0.');
      if(kgv!=null && bad(kgv)) errs.push('Berat harus lebih dari 0, atau kosongkan.');
      if(kgv==null && needKg) errs.push('Berat wajib diisi untuk catatan jenis ini.');
    } else if(bad(kgv)) errs.push(kor ? 'Isi jumlah koreksi, tidak boleh 0.' : 'Berat harus lebih dari 0.');
    put('fruit_id', String(g('ref')));
    put('kg', kgv==null ? null : r2(kgv));
    if(P) put('pcs', r2(pcs));
    if(fd.has('net')){
      const net = pnum(g('net'));
      if(net==null || !isFinite(net) || net<=0) errs.push('Berat bersih harus lebih dari 0.');
      else if(kgv!=null && net>kgv) errs.push('Berat bersih tidak boleh lebih besar dari berat kotor.');
      put('kg_net', net==null ? null : r2(net));
    }
    if(fd.has('price')){ const p = pnum(g('price')); if(p!=null && (!isFinite(p) || p<0)) errs.push('Harga tidak boleh minus.'); put('price', p==null ? null : p); }
    if(fd.has('origin')) put('origin', String(g('origin')||'').trim() || null);
    if(fd.has('ripe')){ const rv = String(g('ripe')||''); if(rv && rv<date) errs.push('Estimasi siap tidak boleh sebelum tanggal masuk.'); put('ripe_date', rv || null); }
    if(fd.has('menu')) put('menu', String(g('menu')||'').trim() || null);
    if(fd.has('category')){ put('category', String(g('category'))); put('stage', String(g('stage'))); }
    if(fd.has('note')) put('note', note);
  } else {
    const qty = pnum(g('qty')), kor = e.type==='koreksi';
    if(qty==null || !isFinite(qty) || (kor ? qty===0 : qty<=0)) errs.push(kor ? 'Isi jumlah koreksi, tidak boleh 0.' : 'Jumlah harus lebih dari 0.');
    put('supply_id', String(g('ref'))); put('qty', qty==null ? null : r2(qty));
    if(fd.has('loc')) put('loc', String(g('loc')));
    if(fd.has('price')){ const p = pnum(g('price')); if(p!=null && (!isFinite(p) || p<0)) errs.push('Harga tidak boleh minus.'); put('price', p==null ? null : p); }
    if(e.type==='rusak' && !note) errs.push('Alasan rusak wajib diisi.');
    put('note', note);
  }
  const box = $('#e-err');
  if(errs.length){ box.innerHTML = `<div class="err" role="alert">${esc(errs[0])}</div>`; return; }
  if(!Object.keys(patch).length){ dlg.close(); toast('Tidak ada yang berubah.'); return; }
  dlg.close();
  const pendOp = st.queue.find(o => o.k===(isF?'entry':'sentry') && o.rows.some(r=>r.id===id));
  if(pendOp){ Object.assign(pendOp.rows.find(r=>r.id===id), patch); saveQueue(); }
  else enqueue({k:'upd', t:kind, id, patch});
  toast('Catatan diperbarui'); render(); updateHeader(); sync();
}

function download(name, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:mime}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCsv(){
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head = ['tanggal','jenis','buah','kg','pcs','kg_bersih','harga_per_kg','asal','menu','kategori_waste','tahap','catatan','dicatat_oleh'];
  const rows = derived().live.filter(e=>e.entry_date.startsWith(ui.month))
    .sort((a,b)=>a.entry_date.localeCompare(b.entry_date)||Date.parse(a.created_at)-Date.parse(b.created_at))
    .map(e=>[e.entry_date,typeLbl(e),fruitName(e.fruit_id),e.kg,e.pcs,e.kg_net,e.price,e.origin,e.menu,e.category?CATS[e.category]:'',e.stage?STAGES[e.stage]:'',e.note,profName(e.created_by)].map(q).join(','));
  download(`stok-buah-${ui.month}.csv`, '\ufeff'+[head.join(',')].concat(rows).join('\r\n'), 'text/csv;charset=utf-8');
}

const sName = id => { const s = derived().smap[id]; return s ? s.name : '(bahan dihapus)'; };
const sUnit = id => { const s = derived().smap[id]; return s ? s.unit : ''; };
const fq = (n,u) => nf.format(Math.round(n*100)/100)+(u?' '+u:'');
const sfq = (n,u) => (n>0?'+':n<0?'−':'')+fq(Math.abs(n),u);
const findSupply = name => { const l = name.toLowerCase(); return derived().supplies.find(s => s.name.trim().toLowerCase()===l) || null; };
const allowedSTypes = () => (ROLE_STYPES[myRole()] || []).filter(t => st.migrated2 || !NEW_STYPES.includes(t));

const locOf = e => e.loc==='dapur' ? 'dapur' : 'gudang';
function supplyStock(){
  const d = derived(), m = {};
  const get = id => m[id] || (m[id] = {masuk:0,pindah:0,pakai:0,rusak:0,koreksi:0,rG:0,rD:0,kG:0,kD:0});
  d.supplies.forEach(s => get(s.id));
  d.sLive.forEach(e => {
    const r = get(e.supply_id), q = Number(e.qty);
    r[e.type] += q;
    if(e.type==='rusak'){ if(locOf(e)==='dapur') r.rD += q; else r.rG += q; }
    if(e.type==='koreksi'){ if(locOf(e)==='dapur') r.kD += q; else r.kG += q; }
  });
  const rd = n => Math.round(n*100)/100;
  Object.values(m).forEach(r => {
    r.gudang = rd(r.masuk + r.kG - r.pindah - r.rG);
    r.dapur = rd(r.pindah + r.kD - r.pakai - r.rD);
    r.stok = rd(r.masuk + r.koreksi - r.pakai - r.rusak);   // total gudang + dapur
  });
  return m;
}

  if(!st.migrated) return [];
  const s = supplyStock(), lv = r => st.migrated2 ? r.gudang : r.stok;
  return derived().supplies.filter(x => !x.hidden && x.min_stock!=null && lv(s[x.id]||{stok:0,gudang:0}) <= Number(x.min_stock));
}
function supMonth(m){

function updateYield(){
  const box = $('#yield-box'); if(!box) return;

// Hasil kupas yang biasa untuk satu buah: rata-rata 90 hari terakhir (min. 3 catatan), atau angka acuan timbang.
function yieldRef(fid, name, skipId){
  const since = addDays(todayStr(), -90);
  let k = 0, n = 0, c = 0;
  if(fid) derived().live.forEach(e => {
    if(e.fruit_id!==fid || e.id===skipId || (e.type!=='produksi' && e.type!=='frozen') || e.kg_net==null || e.entry_date<since) return;
    k += Number(e.kg); n += Number(e.kg_net); c++;
  });
  if(c>=3 && k>0) return {p:n/k*100, src:'rata-rata '+c+' catatan 90 hari terakhir'};
  const r = YIELD_REF[String(name||'').trim().toLowerCase()];
  return r ? {p:r, src:'hasil timbang acuan'} : null;
}
function yieldOff(e){
  if((e.type!=='produksi' && e.type!=='frozen') || e.kg_net==null || !(Number(e.kg)>0)) return null;
  const ref = yieldRef(e.fruit_id, fruitName(e.fruit_id), e.id), p = Number(e.kg_net)/Number(e.kg)*100;
  const dv = ref ? yieldDev(p, ref.p) : null;
  return dv==='low' || dv==='high' ? {p, ref, dv} : null;
}

async function submitSupply(form){
  const fd = new FormData(form), t = ui.stype;
  if(!allowedSTypes().includes(t)){ toast('Perananmu tidak bisa membuat catatan ini.'); return; }
  const typed = normName(fd.get('item'));
  const row = {id:uuid(), entry_date:String(fd.get('date')||''), type:t, supply_id:null,
    qty:parseFloat(String(fd.get('qty')||'').replace(',','.')), price:null, note:null, created_by:st.me.id};
  const errs = [];
  if(!row.entry_date) errs.push('Isi tanggal.'); else if(row.entry_date>todayStr()) errs.push('Tanggal tidak boleh di masa depan.');
  if(!typed) errs.push('Isi nama bahan.');
  if(!isFinite(row.qty) || row.qty<=0) errs.push('Isi jumlah lebih dari 0.');
  else if(row.qty>9999999) errs.push('Jumlah terlalu besar. Periksa lagi angkanya.');
  const price = parseFloat(fd.get('price')); if(isFinite(price) && price>=0) row.price = price;
  const note = String(fd.get('note')||'').trim(); if(note) row.note = note;
  if(t==='rusak' && !note) errs.push('Tulis alasan rusak atau hilang.');
  if(t==='rusak' && st.migrated2){ const lc = String(fd.get('loc')||''); if(lc==='gudang' || lc==='dapur') row.loc = lc; else errs.push('Pilih lokasi rusak atau hilang: gudang atau dapur produksi.'); }
  let sup = typed ? findSupply(typed) : null;
  if(typed && !sup && !canManage()) errs.push('Bahan "'+typed+'" belum ada di daftar. Minta admin atau manager menambahkannya.');
  if(!st.migrated) errs.push('Database belum diperbarui. Minta manager menjalankan 3-update.sql di Supabase.');
  if(t==='pindah' && !st.migrated2) errs.push('Fitur gudang dan dapur belum aktif. Minta manager menjalankan 4-update.sql di Supabase.');
  const box = $('#f-err');
  if(errs.length){ box.innerHTML = `<div class="err" role="alert"><ul>${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; box.scrollIntoView({block:'center'}); return; }
  box.innerHTML = '';
  if(!sup){
    const sim = derived().supplies.find(x => similar(x.name, typed));
    if(sim){
      const okNew = await ask('Bahan baru?', `"${typed}" mirip dengan "${sim.name}" yang sudah ada. Simpan sebagai bahan baru?`, 'Ya, bahan baru');
      if(!okNew){ const i = $('#s-item'); if(i) i.focus(); return; }
    }
  }
  if(t!=='masuk'){
    const sx = sup ? supplyStock()[sup.id] : null, m2 = st.migrated2;
    const where = !m2 ? null : (t==='pindah' ? 'gudang' : t==='pakai' ? 'dapur' : (row.loc||'gudang'));
    const avail = sx ? (m2 ? (where==='dapur' ? sx.dapur : sx.gudang) : sx.stok) : 0;
    if(row.qty > avail + 0.001){
      const label = !m2 ? 'Stok' : (where==='dapur' ? 'Stok dapur produksi' : 'Stok gudang');
      const tip = (!m2 || where==='gudang') ? 'Pastikan catatan bahan masuk sudah diisi.' : 'Pastikan catatan pindah ke dapur sudah diisi.';
      const ok = await ask('Stok tidak cukup', `${label} ${sup?sup.name:typed} tercatat ${fq(avail,sup?sup.unit:'')}, sedangkan yang akan dicatat ${fq(row.qty,sup?sup.unit:'')}. ${tip} Tetap simpan?`, 'Tetap simpan');
      if(!ok) return;
    }
  }
  let unit = sup ? sup.unit : '';
  if(sup) row.supply_id = sup.id;
  else { unit = String(fd.get('unit')||'pcs'); row.supply_id = uuid(); enqueue({k:'supply', row:{id:row.supply_id, name:typed, unit, min_stock:null}}); }
  enqueue({k:'sentry', rows:[row]});
  const nm = sup ? sup.name : typed;
  ui.sdraft = {date:row.entry_date, item:nm};
  toast(`Tersimpan: ${STYPES[t].label.toLowerCase()} ${fq(row.qty,unit)} ${nm}${sup?'':'. Bahan baru masuk ke daftar.'}`);
  render(); updateHeader(); sync();
}

const opKey = () => 'sb.opname.'+uidNow();
// Satu baris koreksi opname. Buah pcs: selisih dihitung dalam pcs, beratnya dari berat rata-rata per pcs.
function opRow(f, phys, label){
  if(!f) return null;
  const r = stock()[f.id] || {stok:0, stokPcs:0}, P = isPcs(f), r2 = n => Math.round(n*100)/100;
  const sys = P ? r.stokPcs : r.stok, dl = r2(phys-sys);
  if(dl===0) return null;
  const kgv = P ? (hasW(f) ? r2(dl*pcsKg(f)) : null) : dl;
  if(kgv===0) return null;   // selisih terlalu kecil untuk dicatat dalam kg
  const row = {id:uuid(), entry_date:todayStr(), type:'koreksi', fruit_id:f.id, kg:kgv, price:null, origin:null, menu:null, category:null, stage:null,
    note:`${label}: fisik ${P?fpcs(phys):kg(phys)}, sistem ${P?fpcs(sys):kg(sys)}`, created_by:st.me.id};
  if(P) row.pcs = dl;
  return row;
}
function opList(){
  const d = derived(), s = stock();
  return d.fruits.filter(f => !f._p && (!f.hidden || (s[f.id] && mainStok(f,s[f.id])!==0))).sort((a,b)=>a.name.localeCompare(b.name,'id'));
}

  const s = stock(), saved = LS.get(opKey(), {}), list = opList();
  if(!list.length) return `<section class="card empty"><h2>Belum ada buah</h2><p>Tambahkan buah dulu lewat Kelola daftar buah.</p></section>`;

      <div class="kg op-in"><input id="op-${esc(f.id)}" data-op="${esc(f.id)}" type="number" inputmode="decimal" step="any" min="0" placeholder="–" value="${esc(saved[f.id]==null?'':saved[f.id])}"><span>${isPcs(f)?'pcs':'kg'}</span></div>

function opVal(i){ const t = String(i.value||'').trim().replace(',','.'); if(t==='') return null; const v = parseFloat(t); return isFinite(v) ? v : NaN; }
function updateOpRow(i, quiet){
  const fid = i.dataset.op, out = document.getElementById('opd-'+fid), v = opVal(i);
  const f = derived().fmap[fid], P = isPcs(f), r0 = stock()[fid]||{stok:0,stokPcs:0}, sys = P ? r0.stokPcs : r0.stok;
  if(!quiet){ const sv = LS.get(opKey(), {}); if(v==null) delete sv[fid]; else sv[fid] = i.value; LS.set(opKey(), sv); }
  if(out){
    if(v==null){ out.textContent = ''; out.className = 'op-d'; }
    else if(isNaN(v) || v<0){ out.textContent = 'Angka tidak valid'; out.className = 'op-d bad'; }
    else { const dl = Math.round((v-sys)*100)/100, dkg = P ? (hasW(f) ? dl*pcsKg(f) : OPNAME_BIG) : dl; out.textContent = dl===0 ? 'Sama' : 'Selisih '+(P?spcs(dl):skg(dl)); out.className = 'op-d '+(dl===0?'ok':Math.abs(dkg)>=OPNAME_BIG?'bad':'mid'); }
  }
  if(!quiet) updateOpSum();
}
function updateOpSum(){
  const box = $('#op-sum'); if(!box) return;
  let n = 0, diff = 0, tot = 0;
  document.querySelectorAll('[data-op]').forEach(i => { const v = opVal(i); if(v==null || isNaN(v) || v<0) return; n++; const row = opRow(derived().fmap[i.dataset.op], v, ''); if(row){ diff++; tot += Math.abs(row.kg||0); } });
  box.innerHTML = n ? `<b>${n}</b> buah diisi, <b>${diff}</b> berbeda dari sistem${tot>0?` (total selisih sekitar ${kg(tot)})`:''}.` : 'Belum ada buah yang diisi.';
}
async function submitOpAll(form){
  const s = stock(), rows = [], bad = [];
  form.querySelectorAll('[data-op]').forEach(i => {
    const v = opVal(i), fid = i.dataset.op; if(v==null) return;
    if(isNaN(v) || v<0){ bad.push(fruitName(fid)); return; }

  });
  const err = $('#op-err');
  if(bad.length){ err.innerHTML = `<div class="err" role="alert">Periksa angka untuk: ${esc(bad.join(', '))}. Isi 0 atau lebih.</div>`; return; }
  err.innerHTML = '';
  const filled = Array.from(form.querySelectorAll('[data-op]')).filter(i => opVal(i)!=null).length;
  if(!filled){ err.innerHTML = '<div class="err" role="alert">Belum ada buah yang diisi.</div>'; return; }
  if(!rows.length){ LS.del(opKey()); toast('Semua stok fisik sama dengan sistem. Tidak ada koreksi.'); ui.tab = 'stok'; render(); return; }
  const tot = rows.reduce((t,r)=>t+Math.abs(r.kg||0),0);
  const ok = await ask('Simpan hasil opname?', `${rows.length} buah akan dikoreksi${tot>0?` (total selisih sekitar ${kg(tot)})`:''}. ${filled-rows.length} buah lain sudah sama dengan sistem.`, 'Simpan koreksi');
  if(!ok) return;
  enqueue({k:'entry', rows});
  LS.del(opKey());
  toast(`Opname tersimpan: ${rows.length} koreksi`);
  ui.tab = 'stok'; render(); updateHeader(); sync(); window.scrollTo(0,0);
}

const dayOf = iso => { const t = new Date(iso); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); };
const reviewOf = (day, role) => st.reviews.find(r => r.review_date===day && r.role===role) || null;
function unsignedDays(n){
  // Hari dengan catatan dalam n hari terakhir (sebelum hari ini) yang belum diparaf peran ini
  const role = myRole(), d = derived(), out = [], have = new Set(d.live.map(e=>e.entry_date).concat(d.sLive.map(e=>e.entry_date)));
  for(let i=1;i<=n;i++){ const x = addDays(todayStr(), -i); if(have.has(x) && !reviewOf(x, role)) out.push(x); }
  return out;
}
function checksFor(day){
  const d = derived(), out = [], s = stock();
  const live = d.live.filter(e => e.entry_date===day);
  if(day===todayStr()){
    d.fruits.forEach(f => { const r = s[f.id]; if(!r) return;
      if(isPcs(f) ? r.stokPcs<0 : r.stok<0) out.push({lv:'bad', t:`Stok ${f.name} minus ${isPcs(f)?fpcs(r.stokPcs):kg(r.stok)}`, h:'Catatan masuk kemungkinan belum diisi.'});
      if(st.migrated2 && r.freezer<0) out.push({lv:'bad', t:`Stok freezer ${f.name} minus ${kg(r.freezer)}`, h:'Ada catatan dari freezer tanpa catatan ke freezer.'}); });
    lowSupplies().forEach(x => out.push({lv:'mid', t:`${x.name} hampir habis`, h:`Batas minimum ${fq(Number(x.min_stock),x.unit)}.`}));
    ripeStatus().filter(x=>x.st!=='wait').forEach(x => out.push({lv: x.st==='late'?'bad':'mid', t:`${x.f.name} ${x.P?fpcs(x.q):kg(x.q)} ${ripeTxt(x)}`, h:`Masuk ${dateLabel(x.e.entry_date)}. Proses atau bekukan supaya tidak jadi waste.`}));
  }
  live.forEach(e => {
    const y = yieldOff(e);
    if(y) out.push({lv: y.dv==='low'?'bad':'mid', t:`Hasil kupas ${fruitName(e.fruit_id)} ${pct(y.p)}${y.dv==='high'?', jauh di atas biasanya':''}`, h:`Biasanya sekitar ${pct(y.ref.p)}. ${y.dv==='high'?'Bagus kalau benar, cek timbangan supaya tidak tertukar. ':''}${kg(Number(e.kg_net))} dari ${kg(Number(e.kg))}, oleh ${profName(e.created_by)}.`});
    if(e.type==='koreksi' && (Math.abs(Number(e.kg))>=OPNAME_BIG || (e.kg==null && e.pcs!=null))) out.push({lv:'mid', t:`Koreksi opname ${fruitName(e.fruit_id)} ${qtyLbl(e)}`, h:`Oleh ${profName(e.created_by)}.`});
    if(e.type==='waste' && e.category==='lainnya') out.push({lv:'mid', t:`Waste ${fruitName(e.fruit_id)} ${qtyLbl(e)} (lainnya)`, h:`${e.note?e.note.replace(/[.\s]+$/,'')+'. ':''}Oleh ${profName(e.created_by)}.`});
  });
  const dels = d.all.filter(e => e.deleted_at && dayOf(e.deleted_at)===day).concat(d.sAll.filter(e => e.deleted_at && dayOf(e.deleted_at)===day));
  if(dels.length) out.push({lv:'mid', t:`${dels.length} catatan dihapus`, h:'Cek di Riwayat kalau penghapusannya tidak jelas alasannya.'});
  return out;
}
