<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14513B">
<title>Stok Buah Kapten Juz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --ink:#10281F; --green:#14513B; --leaf:#2E7D57; --mango:#E9902A;
  --paper:#F4F6F0; --card:#FFFFFF; --line:#DAE1D6; --muted:#566860;
  --waste:#A8480F; --wastebg:#FBEBDD; --okbg:#E2F0E6; --danger:#B3261E;
  --c-masuk:#14513B; --c-produksi:#5A7D2A; --c-eceran:#2F5D7C; --c-waste:#A8480F; --c-koreksi:#5B4B8A;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--green);color:#F4F6F0;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.top small{font-size:14px;color:#CFE3D6}
main{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{font-size:20px}
.empty p{color:var(--muted)}

.btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.waste{background:var(--waste);border-color:var(--waste);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;min-height:36px;font-size:15px}
.btn.danger{color:var(--danger);border-color:#E8B9B4}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--green);font-weight:600;text-decoration:underline;cursor:pointer;text-align:left}

/* Stok */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.sum .lbl{font-size:14px;color:var(--muted)}
.sum strong{font-size:26px;letter-spacing:-.01em}
.sum .w strong{color:var(--waste)}
.fc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.fc.neg{border-color:var(--danger)}
.fc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fc h3{font-size:20px}
.stk{font-size:15px;color:var(--muted)}
.stk strong{font-size:30px;color:var(--ink);letter-spacing:-.02em}
.warn{font-size:15px;color:var(--danger);font-weight:600}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.mini dt{font-size:13px;color:var(--muted)}
.mini dd{margin:0;font-weight:700;font-size:15px}
.mini .w dd{color:var(--waste)}

/* Catat */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#E6EBE2;padding:5px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 2px;font-weight:700;font-size:15px;cursor:pointer;min-height:44px;color:var(--ink)}
.seg button[aria-selected="true"]{color:#fff}
.seg .seg-masuk[aria-selected="true"]{background:var(--c-masuk)}
.seg .seg-produksi[aria-selected="true"]{background:var(--c-produksi)}
.seg .seg-eceran[aria-selected="true"]{background:var(--c-eceran)}
.seg .seg-waste[aria-selected="true"]{background:var(--c-waste)}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:48px}
textarea{min-height:76px;resize:vertical}
.kg{display:flex;align-items:center;gap:10px}
.kg input{font-size:34px;font-weight:700;text-align:right;letter-spacing:-.02em;min-height:64px}
.kg span{font-size:22px;font-weight:700;color:var(--muted)}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{background:#FCE9E7;color:#7C1A13;border-radius:10px;padding:10px 14px;font-size:15px}
.err ul{margin:0;padding-left:18px}
.hint{font-size:14px;color:var(--muted)}

/* Laporan */
.mbar{display:flex;gap:8px;align-items:center}
.mbar input{text-align:center;font-weight:700}
.mbar .btn{padding:0;width:48px;flex:none;font-size:22px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--waste)}
.kpi .sub{color:var(--muted)}
.tag{display:inline-block;align-self:flex-start;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.tag.ok{background:var(--okbg);color:var(--green)}
.tag.bad{background:var(--wastebg);color:var(--waste)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.grid2 .lbl{font-size:14px;color:var(--muted)}
.grid2 strong{font-size:20px}
.sec h2{font-size:18px;margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-l{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:4px}
.bar-t{height:12px;background:#EDF0EA;border-radius:6px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--waste);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:14px;padding:6px 4px;border-bottom:1.5px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
.trend{display:flex;gap:8px;align-items:flex-end;height:150px}
.trend>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:13px;color:var(--muted)}
.trend i{display:block;width:100%;max-width:44px;background:#E3B28B;border-radius:6px 6px 0 0}
.trend .cur i{background:var(--waste)}
.trend b{color:var(--ink);font-size:13px}

/* Riwayat */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hist{display:flex;flex-direction:column;gap:10px}
.he{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.he-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.he-t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.he-t strong{font-size:17px}
.he-d{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.he-k{font-weight:800;font-size:18px;white-space:nowrap}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700;color:#fff}
.b-masuk{background:var(--c-masuk)}.b-produksi{background:var(--c-produksi)}.b-eceran{background:var(--c-eceran)}.b-waste{background:var(--c-waste)}.b-koreksi{background:var(--c-koreksi)}
.x{border:0;background:transparent;color:var(--danger);font-weight:700;font-size:14px;padding:8px;cursor:pointer;min-height:40px}

.fr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fr-t{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.fr-t .hint{flex-basis:100%}
.fl2{display:flex;flex-direction:column;gap:10px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
/* Nav, dialog, toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;min-height:60px}
.tabs button[aria-current="page"]{color:var(--green)}
.tabs button[aria-current="page"] svg{stroke:var(--green)}
.tabs svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);color:var(--ink)}
dialog::backdrop{background:rgba(16,40,31,.55)}
.dl{padding:20px;display:flex;flex-direction:column;gap:14px}
.dl h2{font-size:20px}
.dl p{color:var(--muted)}
.dl hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}
.fl{display:flex;flex-direction:column;gap:8px}
.fl>div{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:380px){.mini{grid-template-columns:1fr 1fr}.kpi .big{font-size:46px}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><h1 id="ttl">Stok buah</h1><small id="dt"></small></div></header>
<main id="app"></main>
<nav class="tabs" aria-label="Menu utama">
  <button data-act="tab" data-v="stok"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Stok</button>
  <button data-act="tab" data-v="catat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Catat</button>
  <button data-act="tab" data-v="laporan"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Laporan</button>
  <button data-act="tab" data-v="riwayat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Riwayat</button>
</nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- Konstanta ---------- */
const KEY = 'stokbuah.v1';
const TYPES = {
  masuk:{label:'Masuk'}, produksi:{label:'Ke produksi'}, eceran:{label:'Eceran'},
  waste:{label:'Waste'}, koreksi:{label:'Koreksi opname'}
};
const CATS = {
  busuk:'Busuk atau terlalu matang', rusak:'Memar atau rusak', kupas:'Sisa kupas',
  jatuh:'Jatuh atau tumpah', lainnya:'Lainnya'
};
const STAGES = {gudang:'Gudang', produksi:'Produksi', eceran:'Eceran'};
const DEFAULT_FRUITS = ['Alpukat','Mangga','Nangka','Pisang','Nanas','Jeruk','Melon','Semangka','Pepaya','Stroberi'];

/* ---------- Util ---------- */
const $ = s => document.querySelector(s);
const app = $('#app'), dlg = $('#dlg'), toastEl = $('#toast');
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const thisMonth = () => todayStr().slice(0,7);
const addMonths = (m,n) => { const [y,mo] = m.split('-').map(Number); const d = new Date(y,mo-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const nf = new Intl.NumberFormat('id-ID',{maximumFractionDigits:2});
const nf1 = new Intl.NumberFormat('id-ID',{maximumFractionDigits:1});
const kg = n => nf.format(Math.round(n*100)/100)+' kg';
const skg = n => (n>0?'+':n<0?'\u2212':'')+nf.format(Math.abs(Math.round(n*100)/100))+' kg';
const pct = n => nf1.format(Math.round(n*10)/10)+'%';
const rp = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
const dateLabel = d => new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const monthLabel = m => new Date(m+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
const monthShort = m => new Date(m+'-01T00:00:00').toLocaleDateString('id-ID',{month:'short'});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const normName = s => cap(String(s==null?'':s).trim().replace(/\s+/g,' '));
function lev(a,b){
  const m=a.length, n=b.length, d=[];
  for(let i=0;i<=m;i++) d[i]=[i];
  for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function similar(a,b){ a=a.toLowerCase(); b=b.toLowerCase(); return Math.min(a.length,b.length)>=4 && lev(a,b)<=1; }

/* ---------- Data ---------- */
function fresh(){ return {v:1, fruits:DEFAULT_FRUITS.slice(), hidden:[], entries:[], settings:{user:'', target:''}}; }
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return fresh();
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.entries) || !Array.isArray(d.fruits)) return fresh();
    d.settings = Object.assign({user:'',target:''}, d.settings||{});
    d.hidden = Array.isArray(d.hidden) ? d.hidden : [];
    return d;
  }catch(e){ return fresh(); }
}
let S = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('Gagal menyimpan. Penyimpanan browser penuh atau diblokir.'); return false; }
}
const ui = {tab:'stok', type:'masuk', month:thisMonth(), filter:'semua', draft:{date:todayStr(), fruit:'', user:''}};
ui.draft.user = S.settings.user || '';

function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(()=>toastEl.classList.remove('on'), 2800);
}

/* ---------- Perhitungan ---------- */
function stock(){
  const m = {};
  const get = f => m[f] || (m[f] = {masuk:0,produksi:0,eceran:0,waste:0,koreksi:0});
  S.fruits.forEach(get);
  S.entries.forEach(e => { get(e.fruit)[e.type] += e.kg; });
  Object.values(m).forEach(r => { r.stok = Math.round((r.masuk + r.koreksi - r.produksi - r.eceran - r.waste)*100)/100; });
  return m;
}
const activeFruits = () => S.fruits.filter(f => !S.hidden.includes(f));
const findFruit = name => { const l = name.toLowerCase(); return S.fruits.find(f => f.toLowerCase()===l) || null; };
function quickFruits(){
  const act = activeFruits(), out = [];
  S.entries.slice().sort((a,b)=>b.ts-a.ts).forEach(e => { if(out.length<8 && act.includes(e.fruit) && !out.includes(e.fruit)) out.push(e.fruit); });
  act.slice().sort((a,b)=>a.localeCompare(b,'id')).forEach(f => { if(out.length<8 && !out.includes(f)) out.push(f); });
  return out;
}
function monthStats(m){
  const r = {masuk:0,produksi:0,eceran:0,waste:0,koreksi:0,kupas:0,cats:{},stages:{},fruits:{}};
  S.entries.filter(e => e.date.startsWith(m)).forEach(e => {
    r[e.type] += e.kg;
    const f = r.fruits[e.fruit] || (r.fruits[e.fruit] = {masuk:0,waste:0});
    if(e.type==='masuk') f.masuk += e.kg;
    if(e.type==='waste'){
      f.waste += e.kg;
      r.cats[e.cat] = (r.cats[e.cat]||0) + e.kg;
      r.stages[e.stage] = (r.stages[e.stage]||0) + e.kg;
      if(e.cat==='kupas') r.kupas += e.kg;
    }
  });
  r.pct = r.masuk>0 ? r.waste/r.masuk*100 : null;
  r.pctNet = r.masuk>0 ? (r.waste-r.kupas)/r.masuk*100 : null;
  return r;
}
function detail(e){
  const p = [];
  if(e.type==='masuk'){ if(e.price) p.push(rp(e.price)+'/kg'); if(e.origin) p.push(e.origin); }
  if(e.type==='produksi' && e.menu) p.push(e.menu);
  if(e.type==='eceran' && e.price) p.push(rp(e.price)+'/kg');
  if(e.type==='waste'){ p.push(CATS[e.cat]||e.cat); p.push('tahap '+(STAGES[e.stage]||e.stage).toLowerCase()); if(e.note) p.push(e.note); }
  if(e.type==='koreksi' && e.note) p.push(e.note);
  if(e.user) p.push('oleh '+e.user);
  return p.join(', ');
}

/* ---------- Dialog ---------- */
function openDlg(html){
  if(dlg.open) dlg.close();
  dlg.onclose = null; dlg.returnValue = '';
  dlg.innerHTML = html; dlg.showModal();
}
function ask(title, body, okLabel){
  return new Promise(res => {
    openDlg(`<form method="dialog" class="dl"><h2>${esc(title)}</h2><p>${esc(body)}</p>
      <div class="row"><button class="btn ghost" value="no">Batal</button><button class="btn pri" value="yes" autofocus>${esc(okLabel||'Ya, lanjut')}</button></div></form>`);
    dlg.onclose = () => res(dlg.returnValue==='yes');
  });
}
dlg.addEventListener('click', e => { if(e.target===dlg) dlg.close(); });

/* ---------- Tampilan: Stok ---------- */
function viewStok(){
  if(!S.entries.length){
    return `<section class="card empty"><h2>Belum ada catatan</h2>
      <p>Mulai dengan mencatat buah yang baru masuk. Stok tiap buah dihitung otomatis dari catatan masuk, keluar, dan waste.</p>
      <button class="btn pri" data-act="tab" data-v="catat">Catat buah masuk</button>
      <button class="btn" data-act="fruits">Atur daftar buah</button></section>`;
  }
  const st = stock();
  const names = Object.keys(st).sort((a,b)=>a.localeCompare(b,'id'));
  const total = names.reduce((s,n)=>s+Math.max(0,st[n].stok),0);
  const ms = monthStats(thisMonth());
  const cards = names.map(n => {
    const r = st[n]; const neg = r.stok < 0;
    if(S.hidden.includes(n) && r.stok===0) return '';
    return `<article class="fc ${neg?'neg':''}">
      <div class="fc-h"><h3>${esc(n)}</h3><button class="btn sm" data-act="opname" data-fruit="${esc(n)}">Hitung fisik</button></div>
      <p class="stk"><strong>${kg(r.stok)}</strong> di gudang</p>
      ${neg?'<p class="warn">Stok minus. Ada catatan keluar yang belum punya catatan masuk.</p>':''}
      <dl class="mini">
        <div><dt>Masuk</dt><dd>${kg(r.masuk)}</dd></div>
        <div><dt>Produksi</dt><dd>${kg(r.produksi)}</dd></div>
        <div><dt>Eceran</dt><dd>${kg(r.eceran)}</dd></div>
        <div class="w"><dt>Waste</dt><dd>${kg(r.waste)}</dd></div>
      </dl></article>`;
  }).join('');
  return `<section class="sum">
      <div><span class="lbl">Total stok sekarang</span><strong>${kg(total)}</strong></div>
      <div class="w"><span class="lbl">Waste ${esc(monthLabel(thisMonth()))}</span><strong>${ms.pct==null?'\u2013':pct(ms.pct)}</strong></div>
    </section>${cards}<button class="btn" data-act="fruits">Kelola daftar buah</button>`;
}

/* ---------- Tampilan: Catat ---------- */
function viewCatat(){
  const t = ui.type, d = ui.draft;
  const opts = activeFruits().sort((a,b)=>a.localeCompare(b,'id')).map(f=>`<option value="${esc(f)}"></option>`).join('');
  const quick = quickFruits().map(f=>`<button type="button" class="chip" data-act="pick-fruit" data-fruit="${esc(f)}" aria-pressed="${f===d.fruit}">${esc(f)}</button>`).join('');
  let extra = '';
  if(t==='masuk') extra = `

async function submitEntry(form){
  const fd = new FormData(form), t = ui.type;
  const e = {id:uid(), ts:Date.now(), type:t, date:String(fd.get('date')||''), fruit:normName(fd.get('fruit')),
    kg:parseFloat(String(fd.get('kg')||'').replace(',','.')), user:String(fd.get('user')||'').trim()};
  const errs = [];
  if(!e.date) errs.push('Isi tanggal.'); else if(e.date>todayStr()) errs.push('Tanggal tidak boleh di masa depan.');
  if(!e.fruit) errs.push('Isi jenis buah.');
  if(!isFinite(e.kg) || e.kg<=0) errs.push('Isi berat lebih dari 0 kg.');
  if(!e.user) errs.push('Isi nama pencatat.');
  const price = parseFloat(fd.get('price')); if(isFinite(price) && price>=0) e.price = price;
  if(t==='masuk'){ const o = String(fd.get('origin')||'').trim(); if(o) e.origin = o; }
  if(t==='produksi'){ const m = String(fd.get('menu')||'').trim(); if(m) e.menu = m; }
  if(t==='waste'){
    e.cat = String(fd.get('cat')||''); e.stage = String(fd.get('stage')||''); const n = String(fd.get('note')||'').trim(); if(n) e.note = n;
    if(!e.cat) errs.push('Pilih kategori waste.');
    if(!e.stage) errs.push('Pilih tahap terjadinya waste.');
    if(e.cat==='lainnya' && !e.note) errs.push('Tulis alasan waste pada catatan.');
  }
  const box = $('#f-err');
  if(errs.length){ box.innerHTML = `<div class="err" role="alert"><ul>${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; box.scrollIntoView({block:'center'}); return; }
  box.innerHTML = '';
  const known = findFruit(e.fruit);
  if(known) e.fruit = known;
  else {
    const sim = S.fruits.find(f => similar(f, e.fruit));
    if(sim){
      const okNew = await ask('Buah baru?', `"${e.fruit}" mirip dengan "${sim}" yang sudah ada. Simpan sebagai buah baru?`, 'Ya, buah baru');
      if(!okNew){ const fi = $('#f-fruit'); if(fi) fi.focus(); return; }
    }
  }
  if(t!=='masuk'){
    const s = stock()[e.fruit]; const avail = s ? s.stok : 0;
    if(e.kg > avail + 0.001){
      const ok = await ask('Stok tidak cukup', `Stok ${e.fruit} tercatat ${kg(avail)}, sedangkan yang akan dicatat keluar ${kg(e.kg)}. Pastikan catatan buah masuk sudah diisi. Tetap simpan?`, 'Tetap simpan');
      if(!ok) return;
    }
  }
  let added = false;
  if(!known){ S.fruits.push(e.fruit); added = true; }
  else if(S.hidden.includes(e.fruit)) S.hidden = S.hidden.filter(f => f!==e.fruit);
  S.entries.push(e);
  S.settings.user = e.user;
  ui.draft = {date:e.date, fruit:e.fruit, user:e.user};
  if(save()) toast(`Tersimpan: ${TYPES[t].label.toLowerCase()} ${kg(e.kg)} ${e.fruit}.${added?' Buah baru masuk ke daftar.':''}`);
  render();
}

/* ---------- Tampilan: Laporan ---------- */
function bars(obj, labels){
  const tot = Object.values(obj).reduce((a,b)=>a+b,0);
  if(!tot) return '<p class="hint">Belum ada waste tercatat pada bulan ini.</p>';
  return '<div class="bars">'+Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<div><div class="bar-l"><span>${esc(labels[k]||k)}</span><b>${kg(v)} (${pct(v/tot*100)})</b></div><div class="bar-t"><i style="width:${(v/tot*100).toFixed(1)}%"></i></div></div>`).join('')+'</div>';
}
function viewLaporan(){
  const m = ui.month, cur = monthStats(m), prev = monthStats(addMonths(m,-1));
  const target = parseFloat(S.settings.target);
  let tag = '', cmp = '';
  if(cur.pct!=null && isFinite(target)){
    tag = cur.pct<=target ? `<span class="tag ok">Dalam target ${pct(target)}</span>` : `<span class="tag bad">Di atas target ${pct(target)}</span>`;
  }
  if(cur.pct!=null && prev.pct!=null){
    const df = cur.pct-prev.pct;
    cmp = Math.abs(df)<0.05 ? `Sama dengan ${esc(monthLabel(addMonths(m,-1)))}.` :
      `${df>0?'Naik':'Turun'} ${nf1.format(Math.abs(Math.round(df*10)/10))} poin dibanding ${esc(monthLabel(addMonths(m,-1)))}.`;
  }
  const fr = Object.entries(cur.fruits).filter(([,v])=>v.masuk||v.waste).sort((a,b)=>b[1].waste-a[1].waste);
  const frRows = fr.length ? fr.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="n">${kg(v.masuk)}</td><td class="n">${kg(v.waste)}</td><td class="n">${v.masuk>0?pct(v.waste/v.masuk*100):'\u2013'}</td></tr>`).join('')
    : '<tr><td colspan="4" class="hint">Belum ada data bulan ini.</td></tr>';
  const months = [5,4,3,2,1,0].map(i=>addMonths(m,-i));
  const tp = months.map(x=>monthStats(x).pct);
  const mx = Math.max(1, ...tp.filter(v=>v!=null));
  const trend = months.map((x,i)=>`<div class="${x===m?'cur':''}"><b>${tp[i]==null?'\u2013':pct(tp[i])}</b>${tp[i]==null?'':`<i style="height:${Math.max(4,tp[i]/mx*90).toFixed(0)}px"></i>`}<span>${esc(monthShort(x))}</span></div>`).join('');
  return `<div class="mbar"><button class="btn" data-act="month" data-v="-1" aria-label="Bulan sebelumnya">\u2039</button>
      <input type="month" id="m" value="${esc(m)}" aria-label="Pilih bulan"><button class="btn" data-act="month" data-v="1" aria-label="Bulan berikutnya">\u203A</button></div>
    <section class="card kpi"><span class="sub">Waste ${esc(monthLabel(m))}</span>
      <p class="big">${cur.pct==null?'\u2013':pct(cur.pct)}</p>
      <p class="sub">${cur.masuk>0?`${kg(cur.waste)} waste dari ${kg(cur.masuk)} buah masuk.`:'Belum ada buah masuk pada bulan ini.'}</p>
      ${tag}${cmp?`<p class="sub">${cmp}</p>`:''}
      ${cur.pctNet!=null?`<p class="hint">Tanpa sisa kupas: ${pct(cur.pctNet)} (${kg(cur.waste-cur.kupas)})</p>`:''}</section>
    <section class="grid2">
      <div><span class="lbl">Masuk</span><br><strong>${kg(cur.masuk)}</strong></div>
      <div><span class="lbl">Ke produksi</span><br><strong>${kg(cur.produksi)}</strong></div>
      <div><span class="lbl">Eceran</span><br><strong>${kg(cur.eceran)}</strong></div>
      <div><span class="lbl">Koreksi opname</span><br><strong>${skg(cur.koreksi)}</strong></div>
    </section>
    <section class="card sec"><h2>Waste per kategori</h2>${bars(cur.cats, CATS)}</section>
    <section class="card sec"><h2>Waste per tahap</h2>${bars(cur.stages, STAGES)}</section>
    <section class="card sec"><h2>Per jenis buah</h2><table><thead><tr><th>Buah</th><th class="n">Masuk</th><th class="n">Waste</th><th class="n">%</th></tr></thead><tbody>${frRows}</tbody></table></section>
    <section class="card sec"><h2>Waste 6 bulan terakhir</h2><div class="trend">${trend}</div></section>
    <button class="btn" data-act="export-csv">Unduh CSV bulan ini</button>`;
}

/* ---------- Unduh / pulihkan ---------- */
function download(name, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:mime}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCsv(){
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head = ['tanggal','jenis','buah','kg','harga_per_kg','asal','menu','kategori_waste','tahap','catatan','dicatat_oleh'];
  const rows = S.entries.filter(e=>e.date.startsWith(ui.month)).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts)
    .map(e=>[e.date,TYPES[e.type].label,e.fruit,e.kg,e.price,e.origin,e.menu,e.cat?CATS[e.cat]:'',e.stage?STAGES[e.stage]:'',e.note,e.user].map(q).join(','));
  download(`stok-buah-${ui.month}.csv`, '\ufeff'+[head.join(',')].concat(rows).join('\r\n'), 'text/csv;charset=utf-8');
}
function importJson(file){
  const rd = new FileReader();
  rd.onload = async () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d || !Array.isArray(d.entries) || !Array.isArray(d.fruits)) throw new Error('format');
      const ok = await ask('Pulihkan data?', `File ini berisi ${d.entries.length} catatan. Semua data di perangkat ini akan diganti.`, 'Ganti data');
      if(!ok) return;
      S = Object.assign(fresh(), d); S.settings = Object.assign({user:'',target:''}, d.settings||{});
      save(); ui.draft.user = S.settings.user||''; render(); toast('Data berhasil dipulihkan');
    }catch(e){ toast('File tidak valid. Pilih file cadangan dari aplikasi ini.'); }
  };
  rd.readAsText(file);
}

/* ---------- Event ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if(a==='tab'){ ui.tab = v; render(); window.scrollTo(0,0); }
  else if(a==='type'){ ui.type = v; render(); }
  else if(a==='month'){ ui.month = addMonths(ui.month, Number(v)); render(); }
  else if(a==='filter'){ ui.filter = v; render(); }
  else if(a==='opname'){ openOpname(b.dataset.fruit); }
  else if(a==='fruits'){ openFruits(); }
  else if(a==='fruit-ren'){ openRename(b.dataset.fruit); }
  else if(a==='fruit-hide'){
    const f = b.dataset.fruit;
    S.hidden = S.hidden.includes(f) ? S.hidden.filter(x => x!==f) : S.hidden.concat(f);
    save(); ui.dirty = true; openFruits();
  }
  else if(a==='pick-fruit'){
    const i = $('#f-fruit');
    if(i){ i.value = b.dataset.fruit; ui.draft.fruit = b.dataset.fruit;
      document.querySelectorAll('[data-act="pick-fruit"]').forEach(x => x.setAttribute('aria-pressed', x===b ? 'true' : 'false')); }
  }
  else if(a==='settings'){ openSettings(); }
  else if(a==='close'){ dlg.close(); }
  else if(a==='export-csv'){ exportCsv(); }
  else if(a==='export-json'){ download('cadangan-stok-buah-'+todayStr()+'.json', JSON.stringify(S,null,2), 'application/json'); }
  else if(a==='import-json'){ const i=$('#imp'); i.onchange=()=>{ if(i.files[0]) importJson(i.files[0]); }; i.click(); }
  else if(a==='del'){
    const e = S.entries.find(x=>x.id===b.dataset.id); if(!e) return;
    const ok = await ask('Hapus catatan ini?', `${TYPES[e.type].label} ${e.type==='koreksi'?skg(e.kg):kg(e.kg)} ${e.fruit}, ${dateLabel(e.date)}. Stok akan dihitung ulang.`, 'Hapus');
    if(ok){ S.entries = S.entries.filter(x=>x.id!==e.id); if(save()) toast('Catatan dihapus'); render(); }
  }
  else if(a==='fruit-del'){
    if(b.getAttribute('aria-disabled')==='true'){ toast('Buah ini sudah dipakai di catatan. Sembunyikan saja kalau tidak dipakai lagi.'); return; }
    S.fruits = S.fruits.filter(f => f!==b.dataset.fruit); S.hidden = S.hidden.filter(f => f!==b.dataset.fruit);
    save(); ui.dirty = true; openFruits();
  }
  else if(a==='reset'){
    const ok = await ask('Hapus semua data?', 'Semua catatan dan pengaturan di perangkat ini akan dihapus dan tidak bisa dikembalikan, kecuali kamu punya file cadangan.', 'Hapus semua');
    if(ok){ S = fresh(); save(); ui.draft = {date:todayStr(), fruit:'', user:''}; render(); toast('Semua data dihapus'); }
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target;
  if(f.method==='dialog') return;
  ev.preventDefault();
  if(f.id==='f') submitEntry(f);
  else if(f.id==='f-opname') submitOpname(f);
  else if(f.id==='f-fruit-add') submitAddFruit(f);
  else if(f.id==='f-fruit-ren') submitRename(f);
  else if(f.id==='f-set') submitSettings(f);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id==='m'){ if(t.value) ui.month = t.value; render(); }
  else if(t.id==='f-date') ui.draft.date = t.value;
  else if(t.id==='f-fruit') ui.draft.fruit = t.value;
  else if(t.id==='f-user') ui.draft.user = t.value;
});

render();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
</body>
