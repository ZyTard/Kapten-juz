<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Stok Buah Kapten Juz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --ink:#10281F; --green:#14513B; --leaf:#2E7D57; --mango:#E9902A;
  --paper:#F4F6F0; --card:#FFFFFF; --line:#DAE1D6; --muted:#566860;
  --waste:#A8480F; --wastebg:#FBEBDD; --okbg:#E2F0E6; --danger:#B3261E;
  --c-masuk:#14513B; --c-produksi:#5A7D2A; --c-eceran:#2F5D7C; --c-waste:#A8480F; --c-koreksi:#5B4B8A;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--green);color:#F4F6F0;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.top-r{display:flex;align-items:center;gap:10px}
.chip-s{border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;min-height:32px}
.chip-s.ok{background:#CFE9D8;color:#0E3B2A}
.chip-s.mid{background:#FBE3B8;color:#5A3A00}
.chip-s.bad{background:#F8D2CC;color:#7C1A13}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid #CFE3D6;background:var(--mango);color:var(--ink);font-weight:800;cursor:pointer;padding:0}
.noshell .top,.noshell .tabs{display:none}
.noshell{padding-bottom:24px}
main{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{font-size:20px}
.empty p{color:var(--muted)}

.btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.waste{background:var(--waste);border-color:var(--waste);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;min-height:36px;font-size:15px}
.btn.danger{color:var(--danger);border-color:#E8B9B4}
.btn[disabled]{opacity:.6;cursor:wait}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--green);font-weight:600;text-decoration:underline;cursor:pointer;text-align:left}

/* Login */
.login{max-width:420px;margin:7vh auto 0;display:flex;flex-direction:column;gap:20px}
.lg-brand{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.lg-brand img{width:64px;height:64px;border-radius:16px}
.lg-brand h1{font-size:28px;letter-spacing:-.02em}
.lg-brand p{color:var(--muted)}

/* Stok */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.sum .lbl{font-size:14px;color:var(--muted)}
.sum strong{font-size:26px;letter-spacing:-.01em}
.sum .w strong{color:var(--waste)}
.fc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.fc.neg{border-color:var(--danger)}
.fc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fc h3{font-size:20px}
.stk{font-size:15px;color:var(--muted)}
.stk strong{font-size:30px;color:var(--ink);letter-spacing:-.02em}
.warn{font-size:15px;color:var(--danger);font-weight:600}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.mini dt{font-size:13px;color:var(--muted)}
.mini dd{margin:0;font-weight:700;font-size:15px}
.mini .w dd{color:var(--waste)}

/* Catat */
.seg{display:grid;gap:6px;background:#E6EBE2;padding:5px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 2px;font-weight:700;font-size:15px;cursor:pointer;min-height:44px;color:var(--ink)}
.seg button[aria-selected="true"]{color:#fff}
.seg .seg-masuk[aria-selected="true"]{background:var(--c-masuk)}
.seg .seg-produksi[aria-selected="true"]{background:var(--c-produksi)}
.seg .seg-eceran[aria-selected="true"]{background:var(--c-eceran)}
.seg .seg-waste[aria-selected="true"]{background:var(--c-waste)}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:48px}
textarea{min-height:76px;resize:vertical}
.kg{display:flex;align-items:center;gap:10px}
.kg input{font-size:34px;font-weight:700;text-align:right;letter-spacing:-.02em;min-height:64px}
.kg span{font-size:22px;font-weight:700;color:var(--muted)}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{background:#FCE9E7;color:#7C1A13;border-radius:10px;padding:10px 14px;font-size:15px}
.err ul{margin:0;padding-left:18px}
.hint{font-size:14px;color:var(--muted)}

/* Laporan */
.mbar{display:flex;gap:8px;align-items:center}
.mbar input{text-align:center;font-weight:700}
.mbar .btn{padding:0;width:48px;flex:none;font-size:22px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--waste)}
.kpi .sub{color:var(--muted)}
.tag{display:inline-block;align-self:flex-start;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.tag.ok{background:var(--okbg);color:var(--green)}
.tag.bad{background:var(--wastebg);color:var(--waste)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.grid2 .lbl{font-size:14px;color:var(--muted)}
.grid2 strong{font-size:20px}
.sec h2{font-size:18px;margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-l{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:4px}
.bar-t{height:12px;background:#EDF0EA;border-radius:6px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--waste);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:14px;padding:6px 4px;border-bottom:1.5px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
.trend{display:flex;gap:8px;align-items:flex-end;height:150px}
.trend>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:13px;color:var(--muted)}
.trend i{display:block;width:100%;max-width:44px;background:#E3B28B;border-radius:6px 6px 0 0}
.trend .cur i{background:var(--waste)}
.trend b{color:var(--ink);font-size:13px}

/* Riwayat */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hist{display:flex;flex-direction:column;gap:10px}
.he{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.he.pend{border-style:dashed;border-color:var(--mango)}
.he-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.he-t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.he-t strong{font-size:17px}
.he-d{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.he-k{font-weight:800;font-size:18px;white-space:nowrap}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:700;color:#fff}
.b-masuk{background:var(--c-masuk)}.b-produksi{background:var(--c-produksi)}.b-eceran{background:var(--c-eceran)}.b-waste{background:var(--c-waste)}.b-koreksi{background:var(--c-koreksi)}
.b-pend{background:#8A5A00}
.r-manager{background:var(--c-masuk)}.r-admin{background:var(--c-eceran)}.r-produksi{background:var(--c-produksi)}.r-kasir{background:var(--c-koreksi)}
.x{border:0;background:transparent;color:var(--danger);font-weight:700;font-size:14px;padding:8px;cursor:pointer;min-height:40px}

/* Staf */
.sc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sc.off{background:#EEF0EA}
.sc-t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sc-t strong{font-size:18px}
.tag.off{background:#E3E5DF;color:#3B4A42}
.perm td:first-child{white-space:nowrap;font-weight:700}

/* Daftar buah */
.fr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fr-t{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.fr-t .hint{flex-basis:100%}
.fl2{display:flex;flex-direction:column;gap:10px}

/* Nav, dialog, toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;min-height:60px}
.tabs button[aria-current="page"]{color:var(--green)}
.tabs button[aria-current="page"] svg{stroke:var(--green)}
.tabs svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);color:var(--ink)}
dialog::backdrop{background:rgba(16,40,31,.55)}
.dl{padding:20px;display:flex;flex-direction:column;gap:14px}
.dl h2{font-size:20px}
.dl p{color:var(--muted)}
.dl hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}
.cred{background:#F1EBDA;border-radius:10px;padding:12px 14px;font-size:17px;display:flex;flex-direction:column;gap:4px;user-select:all;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:380px){.mini{grid-template-columns:1fr 1fr}.kpi .big{font-size:46px}.top h1{font-size:19px}}
</style>
</head>

<header class="top">

<main id="app"></main>

<script>
(() => {
'use strict';

/* =====================================================================
   Konfigurasi (kunci publishable memang aman ada di aplikasi web)
   ===================================================================== */
const SB_URL = 'https://ydkuivsjbmlyoztdnrmj.supabase.co';
const SB_KEY = 'sb_publishable_axDReuYImLoDhay1uONm3A_gz2iJHoA';
const FN_URL = SB_URL + '/functions/v1/staff-admin';
const POLL_MS = 30000;

const TYPES = {
  masuk:{label:'Masuk'}, produksi:{label:'Ke produksi'}, eceran:{label:'Eceran'},
  waste:{label:'Waste'}, koreksi:{label:'Koreksi opname'}
};
const CATS = {
  busuk:'Busuk atau terlalu matang', rusak:'Memar atau rusak', kupas:'Sisa kupas',
  jatuh:'Jatuh atau tumpah', lainnya:'Lainnya'
};
const STAGES = {gudang:'Gudang', produksi:'Produksi', eceran:'Eceran'};
const ROLE = {manager:'Manager', admin:'Admin', produksi:'Produksi', kasir:'Kasir'};
const ROLE_TYPES = {
  manager:['masuk','produksi','eceran','waste'], admin:['masuk','produksi','eceran','waste'],
  produksi:['produksi','waste'], kasir:['eceran','waste']
};
const FRIENDLY = {
  '23505':'Data dengan nama itu sudah ada.',
  '23503':'Data ini masih dipakai di catatan lain.',
  '42501':'Kamu tidak punya izin untuk tindakan ini.'
};

/* =====================================================================
   Util
   ===================================================================== */
const $ = s => document.querySelector(s);
const app = $('#app'), dlg = $('#dlg'), toastEl = $('#toast');
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const thisMonth = () => todayStr().slice(0,7);
const addMonths = (m,n) => { const [y,mo] = m.split('-').map(Number); const d = new Date(y,mo-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const nf = new Intl.NumberFormat('id-ID',{maximumFractionDigits:2});
const nf1 = new Intl.NumberFormat('id-ID',{maximumFractionDigits:1});
const kg = n => nf.format(Math.round(n*100)/100)+' kg';
const skg = n => (n>0?'+':n<0?'\u2212':'')+nf.format(Math.abs(Math.round(n*100)/100))+' kg';
const pct = n => nf1.format(Math.round(n*10)/10)+'%';
const rp = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
const dateLabel = d => new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
const monthLabel = m => new Date(m+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
const monthShort = m => new Date(m+'-01T00:00:00').toLocaleDateString('id-ID',{month:'short'});
const timeLabel = ms => new Date(ms).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const normName = s => cap(String(s==null?'':s).trim().replace(/\s+/g,' '));
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
const uuid = () => {
  if(crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6]&15)|64; b[8] = (b[8]&63)|128;
  const h = Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
};
function genPw(){
  const a = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const r = crypto.getRandomValues(new Uint32Array(10));
  return Array.from(r,x=>a[x%a.length]).join('');
}
function lev(a,b){
  const m=a.length, n=b.length, d=[];
  for(let i=0;i<=m;i++) d[i]=[i];
  for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function similar(a,b){ a=a.toLowerCase(); b=b.toLowerCase(); return Math.min(a.length,b.length)>=4 && lev(a,b)<=1; }

const LS = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(()=>toastEl.classList.remove('on'), 3200);
}

/* =====================================================================
   State
   ===================================================================== */
class NetErr extends Error { constructor(m){ super(m||'offline'); this.net = true; } }

const st = {
  session:null, me:null, profiles:[], fruits:[], entries:new Map(), settings:{waste_target:null},
  cursor:0, lastSync:0, queue:[], rejected:[],
  syncing:false, again:false, netFail:false, ready:false, ver:0
};
const ui = {tab:'stok', type:'masuk', month:thisMonth(), filter:'semua', draft:{date:todayStr(), fruit:''}, dirty:false};

const uidNow = () => st.session ? st.session.user.id : '';
const ck = () => 'sb.cache.'+uidNow(), qk = () => 'sb.queue.'+uidNow(), rk = () => 'sb.rej.'+uidNow();
function saveCache(){
  LS.set(ck(), {me:st.me, profiles:st.profiles, fruits:st.fruits, settings:st.settings, cursor:st.cursor, lastSync:st.lastSync, entries:Array.from(st.entries.values())});
}
function saveQueue(){ LS.set(qk(), st.queue); LS.set(rk(), st.rejected); st.ver++; }
function bump(){ st.ver++; }
function loadLocal(){
  const c = LS.get(ck(), null);
  if(c){
    st.me = c.me||null; st.profiles = c.profiles||[]; st.fruits = c.fruits||[];
    st.settings = c.settings||{waste_target:null}; st.cursor = c.cursor||0; st.lastSync = c.lastSync||0;
    st.entries = new Map((c.entries||[]).map(e=>[e.id,e]));
  }
  st.queue = LS.get(qk(), []); st.rejected = LS.get(rk(), []);
  bump();
  return !!c;
}

/* ---------- Hak akses ---------- */
const myRole = () => st.me ? st.me.role : null;
const isMgr = () => myRole()==='manager';
const canManage = () => myRole()==='manager' || myRole()==='admin';
const allowedTypes = () => ROLE_TYPES[myRole()] || [];
const canDelete = e => !!st.me && (isMgr() || (e.created_by===st.me.id && Date.now()-Date.parse(e.created_at) < 86400000));
const profName = id => { const p = st.profiles.find(x=>x.id===id); return p ? p.full_name : '(staf lama)'; };
const isOffline = () => !navigator.onLine || st.netFail;

/* =====================================================================
   Auth dan API
   ===================================================================== */
function setSession(j){
  st.session = {
    access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at:j.expires_at || Math.floor(Date.now()/1000)+(j.expires_in||3600),
    user:{id:j.user.id, email:j.user.email}
  };
  LS.set('sb.session', st.session);
}
let refreshP = null;
function refreshSession(){
  if(refreshP) return refreshP;
  refreshP = (async () => {
    const rt = st.session && st.session.refresh_token;
    if(!rt){ const e = new Error('Sesi berakhir'); e.auth = true; throw e; }
    let res;
    try{
      res = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:rt})});
    }catch(e){ throw new NetErr(); }
    if(res.status>=500) throw new NetErr('server');
    if(!res.ok){ const e = new Error('Sesi berakhir'); e.auth = true; throw e; }
    setSession(await res.json());
  })().finally(()=>{ refreshP = null; });
  return refreshP;
}
async function api(path, o){
  o = o || {};
  if(!st.session){ const e = new Error('Belum login'); e.auth = true; throw e; }
  if(st.session.expires_at - Date.now()/1000 < 60) await refreshSession();
  for(let attempt=0; attempt<2; attempt++){
    const h = Object.assign({apikey:SB_KEY, Authorization:'Bearer '+st.session.access_token}, o.headers||{});
    if(o.body!==undefined) h['Content-Type'] = 'application/json';
    let res;
    try{ res = await fetch(SB_URL+path, {method:o.method||'GET', headers:h, body:o.body!==undefined?JSON.stringify(o.body):undefined}); }
    catch(e){ throw new NetErr(); }
    if(res.status===401 && attempt===0){ await refreshSession(); continue; }
    return res;
  }
}
async function failure(res){
  let j = {}; try{ j = await res.json(); }catch(e){}
  let msg = j.message || j.msg || j.error_description || j.error || ('Kesalahan '+res.status);
  if(j.code && FRIENDLY[j.code]) msg = FRIENDLY[j.code];
  const e = new Error(msg); e.status = res.status; e.code = j.code; return e;
}
async function jget(path){ const r = await api(path); if(!r.ok) throw await failure(r); return r.json(); }
async function patchRow(path, body){
  const r = await api(path, {method:'PATCH', headers:{Prefer:'return=representation'}, body});
  if(!r.ok) throw await failure(r);
  const rows = await r.json();
  if(!rows.length){ const e = new Error(FRIENDLY['42501']); e.status = 403; throw e; }
  return rows;
}
async function staffCall(payload){
  if(st.session.expires_at - Date.now()/1000 < 60) await refreshSession();
  let res;
  try{
    res = await fetch(FN_URL, {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer '+st.session.access_token, 'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  }catch(e){ throw new NetErr(); }
  let j = {}; try{ j = await res.json(); }catch(e){}
  if(!res.ok){
    let msg = j.error || j.message || ('Kesalahan '+res.status);
    if(res.status===404) msg = 'Fungsi pengelola staf belum dipasang di Supabase.';
    if(res.status===401 && !j.error) msg = 'Fungsi staf menolak sesi ini. Matikan Verify JWT pada fungsi staff-admin, atau login ulang.';
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return j;
}
function needOnline(){ if(isOffline()){ toast('Butuh internet untuk tindakan ini.'); return false; } return true; }
async function mgmt(fn, okMsg, errSel){
  if(!needOnline()) return false;
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    if(e.auth){ forceLogin('Sesi berakhir. Silakan login lagi.'); return false; }
    const msg = e.net ? 'Tidak ada koneksi. Coba lagi.' : (e.message || 'Terjadi kesalahan.');
    const box = errSel && $(errSel);
    if(box) box.innerHTML = `<div class="err" role="alert">${esc(msg)}</div>`; else toast(msg);
    return false;

}

/* =====================================================================
   Data turunan (server + antrean yang belum terkirim)
   ===================================================================== */
let memo = {v:-1};
function derived(){
  if(memo.v===st.ver) return memo;
  const fr = st.fruits.slice(), fids = new Set(fr.map(f=>f.id));
  const em = new Map(st.entries), del = new Set();
  st.queue.forEach(op => {
    if(op.k==='fruit' && !fids.has(op.row.id)){ fids.add(op.row.id); fr.push({id:op.row.id, name:op.row.name, hidden:false, _p:true}); }
    if(op.k==='entry') op.rows.forEach(r => { if(!em.has(r.id)) em.set(r.id, Object.assign({}, r, {created_at:new Date(op.ts).toISOString(), _p:true})); });
    if(op.k==='del') del.add(op.id);
  });
  const all = Array.from(em.values()).map(e => (del.has(e.id) && !e.deleted_at) ? Object.assign({}, e, {deleted_at:new Date().toISOString()}) : e);
  const fmap = {}; fr.forEach(f => { fmap[f.id] = f; });
  memo = {v:st.ver, all, live:all.filter(e=>!e.deleted_at), fruits:fr, fmap};
  return memo;
}
const fruitName = id => { const f = derived().fmap[id]; return f ? f.name : '(buah dihapus)'; };
const findFruit = name => { const l = name.toLowerCase(); return derived().fruits.find(f => f.name.trim().toLowerCase()===l) || null; };

function stock(){
  const d = derived(), m = {};
  const get = id => m[id] || (m[id] = {masuk:0,produksi:0,eceran:0,waste:0,koreksi:0});
  d.fruits.forEach(f => get(f.id));
  d.live.forEach(e => { get(e.fruit_id)[e.type] += Number(e.kg); });
  Object.values(m).forEach(r => { r.stok = Math.round((r.masuk + r.koreksi - r.produksi - r.eceran - r.waste)*100)/100; });
  return m;
}
function monthStats(m){
  const r = {masuk:0,produksi:0,eceran:0,waste:0,koreksi:0,kupas:0,cats:{},stages:{},fruits:{}};
  derived().live.filter(e => e.entry_date.startsWith(m)).forEach(e => {
    const k = Number(e.kg); r[e.type] += k;
    const name = fruitName(e.fruit_id);
    const f = r.fruits[name] || (r.fruits[name] = {masuk:0,waste:0});
    if(e.type==='masuk') f.masuk += k;
    if(e.type==='waste'){
      f.waste += k;
      r.cats[e.category] = (r.cats[e.category]||0) + k;
      r.stages[e.stage] = (r.stages[e.stage]||0) + k;
      if(e.category==='kupas') r.kupas += k;
    }
  });
  r.pct = r.masuk>0 ? r.waste/r.masuk*100 : null;
  r.pctNet = r.masuk>0 ? (r.waste-r.kupas)/r.masuk*100 : null;
  return r;
}
function detail(e){
  const p = [];
  if(e.type==='masuk'){ if(e.price) p.push(rp(e.price)+'/kg'); if(e.origin) p.push(e.origin); }
  if(e.type==='produksi' && e.menu) p.push(e.menu);
  if(e.type==='eceran' && e.price) p.push(rp(e.price)+'/kg');
  if(e.type==='waste'){ p.push(CATS[e.category]||e.category); p.push('tahap '+(STAGES[e.stage]||e.stage).toLowerCase()); }
  if(e.note) p.push(e.note);
  p.push('oleh '+profName(e.created_by));
  return p.join(', ');
}

/* =====================================================================
   Antrean pengiriman (offline) dan sinkronisasi
   ===================================================================== */
const INS_KEYS = ['id','entry_date','type','fruit_id','kg','price','origin','menu','category','stage','note','created_by'];
const insPayload = r => { const o = {}; INS_KEYS.forEach(k => { o[k] = r[k]===undefined ? null : r[k]; }); return o; };

function enqueue(op){ op.ts = Date.now(); st.queue.push(op); saveQueue(); }

function remapFruit(oldId, newId){
  st.queue.forEach(o => { if(o.k==='entry') o.rows.forEach(r => { if(r.fruit_id===oldId) r.fruit_id = newId; }); });
}
async function sendOp(op){
  if(op.k==='fruit'){
    const r = await api('/rest/v1/fruits?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}, body:{id:op.row.id, name:op.row.name}});
    if(r.ok) return;
    const e = await failure(r);
    if(r.status===409 || e.code==='23505'){
      const list = await jget('/rest/v1/fruits?select=id,name');
      const hit = list.find(f => f.name.trim().toLowerCase()===op.row.name.trim().toLowerCase());
      if(hit){ remapFruit(op.row.id, hit.id); return; }
    }
    throw e;
  }
  if(op.k==='entry'){
    const r = await api('/rest/v1/entries?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}, body:op.rows.map(insPayload)});
    if(!r.ok) throw await failure(r);
    return;
  }
  if(op.k==='del'){
    await patchRow('/rest/v1/entries?id=eq.'+encodeURIComponent(op.id), {deleted_at:op.at});
    return;
  }
}
function describeOp(op){
  if(op.k==='fruit') return 'Buah baru '+op.row.name;
  if(op.k==='del') return 'Hapus satu catatan';
  if(op.rows.length>1) return op.rows.length+' catatan impor';
  const r = op.rows[0]; return TYPES[r.type].label+' '+kg(Number(r.kg))+' '+fruitName(r.fruit_id);
}
let flushing = false;
async function flush(){
  if(flushing || !st.session) return;
  flushing = true;
  try{
    while(st.queue.length){
      const op = st.queue[0];
      try{ await sendOp(op); st.queue.shift(); saveQueue(); }
      catch(e){
        if(e.net || e.auth || e.status>=500 || e.status===429 || e.status===408) throw e;
        st.rejected.push({desc:describeOp(op), msg:e.message, at:Date.now()});
        st.queue.shift(); saveQueue();
        toast('Satu catatan ditolak server. Ketuk status di atas untuk melihat.');
      }
    }
  } finally { flushing = false; }
}
async function pull(){
  const uid = st.session.user.id;
  const [me, profiles, fruits, settings] = await Promise.all([
    jget('/rest/v1/profiles?select=id,email,full_name,role,active&id=eq.'+uid),
    jget('/rest/v1/profiles?select=id,email,full_name,role,active&order=full_name.asc'),
    jget('/rest/v1/fruits?select=id,name,hidden&order=name.asc'),
    jget('/rest/v1/settings?select=waste_target&id=eq.1')
  ]);
  const from = st.cursor ? new Date(st.cursor-300000).toISOString() : null;
  let off = 0, maxMs = st.cursor||0;
  for(;;){
    let p = '/rest/v1/entries?select=*&order=updated_at.asc,id.asc&limit=1000&offset='+off;
    if(from) p += '&updated_at=gte.'+encodeURIComponent(from);
    const rows = await jget(p);
    rows.forEach(r => { st.entries.set(r.id, r); const ms = Date.parse(r.updated_at); if(ms>maxMs) maxMs = ms; });
    if(rows.length<1000) break;
    off += 1000;
  }
  st.cursor = maxMs;
  st.me = me[0] || null; st.profiles = profiles; st.fruits = fruits;
  st.settings = settings[0] || {waste_target:null};
  st.lastSync = Date.now();
  saveCache(); bump();
}
async function sync(manual){
  if(!st.session) return;
  if(st.syncing){ st.again = true; return; }
  if(!navigator.onLine){ updateHeader(); if(manual) toast('Sedang offline. Catatan terkirim otomatis saat sinyal kembali.'); return; }
  st.syncing = true; updateHeader();
  try{
    await flush();
    await pull();
    st.netFail = false;
    afterSync();
    if(manual) toast('Data sudah terbaru');
  }catch(e){
    if(e.auth) forceLogin('Sesi berakhir. Silakan login lagi.');
    else if(e.net) st.netFail = true;
    else if(manual) toast('Gagal sinkron: '+e.message);
  }finally{
    st.syncing = false; updateHeader();
    if(st.again){ st.again = false; setTimeout(()=>sync(), 300); }
  }
}
function afterSync(){
  if(!st.ready) return;
  if(!st.me || !st.me.active){ renderBlocked(); return; }
  updateNav(); updateHeader();
  if(ui.tab==='catat') return;
  const y = window.scrollY; keepForm(render); window.scrollTo(0,y);
}

async function submitEntry(form){
  const fd = new FormData(form), t = ui.type;
  if(!allowedTypes().includes(t)){ toast('Perananmu tidak bisa membuat catatan ini.'); return; }
  const typed = normName(fd.get('fruit'));
  const row = {id:uuid(), entry_date:String(fd.get('date')||''), type:t, fruit_id:null,
    kg:parseFloat(String(fd.get('kg')||'').replace(',','.')), price:null, origin:null, menu:null,
    category:null, stage:null, note:null, created_by:st.me.id};
  const errs = [];
  if(!row.entry_date) errs.push('Isi tanggal.'); else if(row.entry_date>todayStr()) errs.push('Tanggal tidak boleh di masa depan.');
  if(!typed) errs.push('Isi jenis buah.');
  if(!isFinite(row.kg) || row.kg<=0) errs.push('Isi berat lebih dari 0 kg.');
  else if(row.kg>99999) errs.push('Berat terlalu besar. Periksa lagi angkanya.');
  const price = parseFloat(fd.get('price')); if(isFinite(price) && price>=0) row.price = price;
  if(t==='masuk'){ const o = String(fd.get('origin')||'').trim(); if(o) row.origin = o; }
  if(t==='produksi'){ const m = String(fd.get('menu')||'').trim(); if(m) row.menu = m; }
  if(t==='waste'){
    row.category = String(fd.get('cat')||'') || null; row.stage = String(fd.get('stage')||'') || null;
    const n = String(fd.get('note')||'').trim(); if(n) row.note = n;
    if(!row.category) errs.push('Pilih kategori waste.');
    if(!row.stage) errs.push('Pilih tahap terjadinya waste.');
    if(row.category==='lainnya' && !row.note) errs.push('Tulis alasan waste pada catatan.');
  }
  const box = $('#f-err');
  if(errs.length){ box.innerHTML = `<div class="err" role="alert"><ul>${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; box.scrollIntoView({block:'center'}); return; }
  box.innerHTML = '';
  const known = findFruit(typed);
  let fname = typed;
  if(known) fname = known.name;
  else {
    const sim = derived().fruits.find(f => similar(f.name, typed));
    if(sim){
      const okNew = await ask('Buah baru?', `"${typed}" mirip dengan "${sim.name}" yang sudah ada. Simpan sebagai buah baru?`, 'Ya, buah baru');
      if(!okNew){ const fi = $('#f-fruit'); if(fi) fi.focus(); return; }
    }
  }
  if(t!=='masuk'){
    const avail = known ? stock()[known.id].stok : 0;
    if(row.kg > avail + 0.001){
      const ok = await ask('Stok tidak cukup', `Stok ${fname} tercatat ${kg(avail)}, sedangkan yang akan dicatat keluar ${kg(row.kg)}. Pastikan catatan buah masuk sudah diisi. Tetap simpan?`, 'Tetap simpan');
      if(!ok) return;
    }
  }
  if(known) row.fruit_id = known.id;
  else { row.fruit_id = uuid(); enqueue({k:'fruit', row:{id:row.fruit_id, name:typed}}); }
  enqueue({k:'entry', rows:[row]});
  ui.draft = {date:row.entry_date, fruit:fname};
  toast(`Tersimpan: ${TYPES[t].label.toLowerCase()} ${kg(row.kg)} ${fname}${known?'':'. Buah baru masuk ke daftar.'}`);
  render(); updateHeader(); sync();
}

function bars(obj, labels){
  const tot = Object.values(obj).reduce((a,b)=>a+b,0);
  if(!tot) return '<p class="hint">Belum ada waste tercatat pada bulan ini.</p>';
  return '<div class="bars">'+Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<div><div class="bar-l"><span>${esc(labels[k]||k)}</span><b>${kg(v)} (${pct(v/tot*100)})</b></div><div class="bar-t"><i style="width:${(v/tot*100).toFixed(1)}%"></i></div></div>`).join('')+'</div>';
}
function viewLaporan(){
  const m = ui.month, cur = monthStats(m), prev = monthStats(addMonths(m,-1));
  const target = parseFloat(st.settings.waste_target);
  let tag = '', cmp = '';
  if(cur.pct!=null && isFinite(target)){
    tag = cur.pct<=target ? `<span class="tag ok">Dalam target ${pct(target)}</span>` : `<span class="tag bad">Di atas target ${pct(target)}</span>`;
  }
  if(cur.pct!=null && prev.pct!=null){
    const df = cur.pct-prev.pct;
    cmp = Math.abs(df)<0.05 ? `Sama dengan ${esc(monthLabel(addMonths(m,-1)))}.` :
      `${df>0?'Naik':'Turun'} ${nf1.format(Math.abs(Math.round(df*10)/10))} poin dibanding ${esc(monthLabel(addMonths(m,-1)))}.`;
  }
  const fr = Object.entries(cur.fruits).filter(([,v])=>v.masuk||v.waste).sort((a,b)=>b[1].waste-a[1].waste);
  const frRows = fr.length ? fr.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="n">${kg(v.masuk)}</td><td class="n">${kg(v.waste)}</td><td class="n">${v.masuk>0?pct(v.waste/v.masuk*100):'\u2013'}</td></tr>`).join('')
    : '<tr><td colspan="4" class="hint">Belum ada data bulan ini.</td></tr>';
  const months = [5,4,3,2,1,0].map(i=>addMonths(m,-i));
  const tp = months.map(x=>monthStats(x).pct);
  const mx = Math.max(1, ...tp.filter(v=>v!=null));
  const trend = months.map((x,i)=>`<div class="${x===m?'cur':''}"><b>${tp[i]==null?'\u2013':pct(tp[i])}</b>${tp[i]==null?'':`<i style="height:${Math.max(4,tp[i]/mx*90).toFixed(0)}px"></i>`}<span>${esc(monthShort(x))}</span></div>`).join('');
  return `<div class="mbar"><button class="btn" data-act="month" data-v="-1" aria-label="Bulan sebelumnya">\u2039</button>
      <input type="month" id="m" value="${esc(m)}" aria-label="Pilih bulan"><button class="btn" data-act="month" data-v="1" aria-label="Bulan berikutnya">\u203A</button></div>
    <section class="card kpi"><span class="sub">Waste ${esc(monthLabel(m))}</span>
      <p class="big">${cur.pct==null?'\u2013':pct(cur.pct)}</p>
      <p class="sub">${cur.masuk>0?`${kg(cur.waste)} waste dari ${kg(cur.masuk)} buah masuk.`:'Belum ada buah masuk pada bulan ini.'}</p>
      ${tag}${cmp?`<p class="sub">${cmp}</p>`:''}
      ${cur.pctNet!=null?`<p class="hint">Tanpa sisa kupas: ${pct(cur.pctNet)} (${kg(cur.waste-cur.kupas)})</p>`:''}</section>
    <section class="grid2">
      <div><span class="lbl">Masuk</span><br><strong>${kg(cur.masuk)}</strong></div>
      <div><span class="lbl">Ke produksi</span><br><strong>${kg(cur.produksi)}</strong></div>
      <div><span class="lbl">Eceran</span><br><strong>${kg(cur.eceran)}</strong></div>
      <div><span class="lbl">Koreksi opname</span><br><strong>${skg(cur.koreksi)}</strong></div>
    </section>
    <section class="card sec"><h2>Waste per kategori</h2>${bars(cur.cats, CATS)}</section>
    <section class="card sec"><h2>Waste per tahap</h2>${bars(cur.stages, STAGES)}</section>
    <section class="card sec"><h2>Per jenis buah</h2><table><thead><tr><th>Buah</th><th class="n">Masuk</th><th class="n">Waste</th><th class="n">%</th></tr></thead><tbody>${frRows}</tbody></table></section>
    <section class="card sec"><h2>Waste 6 bulan terakhir</h2><div class="trend">${trend}</div></section>
    ${canManage()?'<button class="btn" data-act="export-csv">Unduh CSV bulan ini</button>':''}`;
}

function openSettings(){
  const leg = canManage() ? legacyData() : null;
  openDlg(`<div class="dl"><h2>Pengaturan</h2>
    ${isMgr()?`<form id="f-set" class="form" novalidate>
      <div class="field"><label for="s-target">Target waste maksimum per bulan (%), boleh kosong</label><input id="s-target" name="target" type="number" inputmode="decimal" step="any" min="0" value="${esc(st.settings.waste_target==null?'':st.settings.waste_target)}"></div>
      <div id="st-err"></div>
      <button class="btn pri" type="submit">Simpan target</button></form><hr>`:''}
    <h2 style="font-size:17px">Daftar buah</h2>
    <p>${derived().fruits.filter(f=>!f.hidden).length} buah aktif. Tambah, ganti nama, atau sembunyikan sesuai kebutuhan.</p>
    <button class="btn" type="button" data-act="fruits">Kelola daftar buah</button>
    ${leg?`<hr><h2 style="font-size:17px">Data lama di perangkat ini</h2>
      <p>Ditemukan ${leg.entries.length} catatan dari versi sebelumnya yang belum dikirim ke database bersama.</p>
      <button class="btn" type="button" data-act="legacy">Impor data lama</button>`:''}
    <div class="row"><button class="btn ghost" type="button" data-act="close">Tutup</button></div></div>`);
}
async function submitSettings(form){
  const t = parseFloat(new FormData(form).get('target')), val = isFinite(t) && t>=0 ? t : null;
  const ok = await mgmt(async()=>{
    await patchRow('/rest/v1/settings?id=eq.1', {waste_target:val});
    st.settings.waste_target = val; saveCache(); bump();
  }, 'Target tersimpan', '#st-err');
  if(ok){ dlg.close(); render(); }
}
async function importLegacy(){
  const d = legacyData(); if(!d) return;
  const ok = await ask('Impor data lama?', `${d.entries.length} catatan dari perangkat ini akan dikirim ke database bersama atas nama akunmu. Nama pencatat lama dicantumkan pada kolom catatan. Lakukan ini satu kali saja.`, 'Impor sekarang');
  if(!ok) return;
  const fm = {}; derived().fruits.forEach(f => { fm[f.name.trim().toLowerCase()] = f.id; });
  const valid = d.entries.filter(e => e && TYPES[e.type] && /^\d{4}-\d{2}-\d{2}$/.test(e.date||'') && isFinite(e.kg) && e.fruit);
  new Set(valid.map(e=>normName(e.fruit))).forEach(name => {
    const k = name.toLowerCase();
    if(!fm[k]){ const id = uuid(); fm[k] = id; enqueue({k:'fruit', row:{id, name}}); }
  });
  const rows = valid.map(e => ({
    id:uuid(), entry_date:e.date, type:e.type, fruit_id:fm[normName(e.fruit).toLowerCase()], kg:e.kg,
    price:isFinite(e.price)?e.price:null, origin:e.origin||null, menu:e.menu||null,
    category:e.type==='waste'?(e.cat||'lainnya'):null, stage:e.type==='waste'?(e.stage||'gudang'):null,
    note:[e.note, e.user?('Dicatat '+e.user+' (data lama)'):'(data lama)'].filter(Boolean).join('. '), created_by:st.me.id
  }));
  for(let i=0;i<rows.length;i+=100) enqueue({k:'entry', rows:rows.slice(i,i+100)});
  try{ localStorage.setItem('sb.legacyDone','1'); }catch(e){}
  toast(`${rows.length} catatan lama sedang dikirim`);
  dlg.close(); render(); updateHeader(); sync();
}

function openAccount(){
  const me = st.me;
  openDlg(`<div class="dl"><h2>${esc(me?me.full_name:'Akun')}</h2>
    <p>${esc(me?ROLE[me.role]:'')}${me?', ':''}${esc(st.session?st.session.user.email:'')}</p>
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="hint">${st.lastSync?'Terakhir sinkron pukul '+timeLabel(st.lastSync):'Belum pernah sinkron'}${st.queue.length?`, ${st.queue.length} belum terkirim`:''}</span>
      <button class="btn sm" type="button" data-act="sync">Sinkronkan</button></div>
    <hr>
    <form id="f-pw" class="form" novalidate><h2 style="font-size:17px">Ganti kata sandi</h2>
      <div class="field"><label for="pw1">Kata sandi baru (minimal 8 karakter)</label><input id="pw1" name="p1" type="password" autocomplete="new-password"></div>
      <div class="field"><label for="pw2">Ulangi kata sandi baru</label><input id="pw2" name="p2" type="password" autocomplete="new-password"></div>
      <div id="pw-err"></div>
      <button class="btn" type="submit">Simpan kata sandi</button></form>
    <hr>
    <div class="row"><button class="btn danger" type="button" data-act="logout">Keluar</button><button class="btn ghost" type="button" data-act="close">Tutup</button></div></div>`);
}
async function submitPw(form){
  const fd = new FormData(form), a = String(fd.get('p1')||''), b2 = String(fd.get('p2')||''), err = $('#pw-err');
  if(a.length<8){ err.innerHTML = '<div class="err" role="alert">Kata sandi minimal 8 karakter.</div>'; return; }
  if(a!==b2){ err.innerHTML = '<div class="err" role="alert">Kedua kata sandi tidak sama.</div>'; return; }
  const ok = await mgmt(async()=>{
    const r = await api('/auth/v1/user', {method:'PUT', body:{password:a}});
    if(!r.ok){
      const e = await failure(r);
      if(/different/i.test(e.message)) e.message = 'Kata sandi baru harus berbeda dari yang lama.';
      else if(/weak|short|least|characters/i.test(e.message)) e.message = 'Kata sandi terlalu lemah. Gunakan campuran huruf dan angka.';
      throw e;
    }
  }, 'Kata sandi diganti', '#pw-err');
  if(ok) form.reset();
}
function openRejected(){
  openDlg(`<div class="dl"><h2>Catatan ditolak server</h2>
    <p>Catatan ini tidak bisa disimpan di server, biasanya karena perananmu tidak mengizinkannya. Catat ulang bila perlu.</p>
    <div class="fl2">${st.rejected.map(r=>`<div class="fr"><strong>${esc(r.desc)}</strong><span class="hint">${esc(r.msg)}</span></div>`).join('')}</div>
    <div class="row"><button class="btn pri" data-act="rej-clear">Tutup dan buang</button></div></div>`);
}

/* =====================================================================
   Unduh CSV
   ===================================================================== */
function download(name, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:mime}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCsv(){
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head = ['tanggal','jenis','buah','kg','harga_per_kg','asal','menu','kategori_waste','tahap','catatan','dicatat_oleh'];
  const rows = derived().live.filter(e=>e.entry_date.startsWith(ui.month))
    .sort((a,b)=>a.entry_date.localeCompare(b.entry_date)||Date.parse(a.created_at)-Date.parse(b.created_at))
    .map(e=>[e.entry_date,TYPES[e.type].label,fruitName(e.fruit_id),e.kg,e.price,e.origin,e.menu,e.category?CATS[e.category]:'',e.stage?STAGES[e.stage]:'',e.note,profName(e.created_by)].map(q).join(','));
  download(`stok-buah-${ui.month}.csv`, '\ufeff'+[head.join(',')].concat(rows).join('\r\n'), 'text/csv;charset=utf-8');
}

   Render, navigasi, header

  const f = $('#f');
  const snap = f ? Array.from(new FormData(f).entries()) : null;

  const nf2 = $('#f');
  if(snap && nf2) snap.forEach(([k,v]) => { if(k==='fruit') return; const el = nf2.elements[k]; if(el && 'value' in el) el.value = v; });
}
const TAB_ICONS = {
  stok:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  catat:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',

};
const TAB_LABEL = {stok:'Stok', catat:'Catat', laporan:'Laporan', riwayat:'Riwayat', staf:'Staf'};
function tabsForRole(){ const t = ['stok','catat','laporan','riwayat']; if(isMgr()) t.push('staf'); return t; }
function updateNav(){
  const nav = $('#nav');
  nav.innerHTML = tabsForRole().map(k=>`<button data-act="tab" data-v="${k}" aria-current="${k===ui.tab?'page':'false'}"><svg viewBox="0 0 24 24">${TAB_ICONS[k]}</svg>${TAB_LABEL[k]}</button>`).join('');

function render(){
  if(!st.me) return;
  if(!tabsForRole().includes(ui.tab)) ui.tab = 'stok';
  app.innerHTML = {stok:viewStok, catat:viewCatat, laporan:viewLaporan, riwayat:viewRiwayat, staf:viewStaf}[ui.tab]();
  updateNav();
  $('#ttl').textContent = {stok:'Stok buah', catat:'Catat', laporan:'Laporan bulanan', riwayat:'Riwayat', staf:'Kelola staf'}[ui.tab];
  updateHeader();
}
function updateHeader(){
  const el = $('#sync'), av = $('#acct'); if(!el) return;
  const n = st.queue.length;
  let t, c;
  if(st.rejected.length){ t = st.rejected.length+' ditolak'; c = 'bad'; }
  else if(st.syncing){ t = 'Menyinkronkan'; c = 'mid'; }
  else if(isOffline()){ t = n ? 'Offline, '+n+' belum terkirim' : 'Offline'; c = 'bad'; }
  else if(n){ t = n+' belum terkirim'; c = 'mid'; }
  else { t = 'Tersinkron'; c = 'ok'; }
  el.textContent = t; el.className = 'chip-s '+c;
  av.textContent = st.me ? initials(st.me.full_name) : '?';
}
function enterApp(){
  setShell(true); render(); startTimers();
}

/* =====================================================================
   Login, logout, mulai sesi
   ===================================================================== */
async function doLogin(form){
  const fd = new FormData(form);
  const email = String(fd.get('email')||'').trim().toLowerCase(), pw = String(fd.get('password')||'');
  const err = $('#l-err');
  if(!email || !pw){ err.innerHTML = '<div class="err" role="alert">Isi email dan kata sandi.</div>'; return; }
  if(!navigator.onLine){ err.innerHTML = '<div class="err" role="alert">Butuh internet untuk login.</div>'; return; }
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Masuk...';
  let res;
  try{ res = await fetch(SB_URL+'/auth/v1/token?grant_type=password', {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify({email, password:pw})}); }
  catch(e){ btn.disabled = false; btn.textContent = 'Masuk'; err.innerHTML = '<div class="err" role="alert">Tidak ada koneksi ke server. Coba lagi.</div>'; return; }
  if(!res.ok){
    btn.disabled = false; btn.textContent = 'Masuk';
    let j = {}; try{ j = await res.json(); }catch(e){}
    const banned = j.error_code==='user_banned' || /banned/i.test(j.msg||j.message||'');
    const text = banned ? 'Akun ini dinonaktifkan. Hubungi manager.' : (res.status===400||res.status===401 ? 'Email atau kata sandi salah.' : 'Gagal masuk (kode '+res.status+'). Coba lagi.');
    err.innerHTML = `<div class="err" role="alert">${esc(text)}</div>`;
    return;
  }
  setSession(await res.json());
  await startSession();
}
async function startSession(){
  st.me = null; st.profiles = []; st.fruits = []; st.entries = new Map(); st.settings = {waste_target:null};
  st.cursor = 0; st.lastSync = 0; st.netFail = false; st.ready = false;
  const cached = loadLocal();
  if(cached && st.me){ st.ready = true; enterApp(); sync(); return; }
  showLoading();
  await sync();
  if(st.me && st.me.active){ st.ready = true; enterApp(); }
  else if(st.me){ renderBlocked(); }
  else if(isOffline()){ showFatal('Tidak bisa memuat data. Periksa koneksi internet, lalu coba lagi.'); }
  else if(st.session){ renderBlocked('Akunmu belum terdaftar sebagai staf. Hubungi manager.'); }
}
async function doLogout(){
  if(st.queue.length){
    const ok = await ask('Keluar sekarang?', `Masih ada ${st.queue.length} catatan yang belum terkirim. Catatan itu tetap tersimpan di perangkat ini dan terkirim saat kamu login lagi dengan akun yang sama.`, 'Tetap keluar');
    if(!ok) return;
  }
  if(dlg.open) dlg.close();
  try{ await api('/auth/v1/logout', {method:'POST'}); }catch(e){}
  LS.del(ck()); LS.del('sb.session');
  st.session = null; st.ready = false; st.me = null;
  showLogin();
}

/* =====================================================================
   Event
   ===================================================================== */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if(a==='tab'){ ui.tab = v; render(); window.scrollTo(0,0); }
  else if(a==='type'){ ui.type = v; render(); }
  else if(a==='month'){ ui.month = addMonths(ui.month, Number(v)); render(); }
  else if(a==='filter'){ ui.filter = v; render(); }
  else if(a==='sync'){
    if(st.rejected.length) openRejected(); else { if(dlg.open && b.closest('dialog')) { /* tetap di dialog */ } sync(true); }
  }
  else if(a==='account'){ openAccount(); }
  else if(a==='logout'){ doLogout(); }
  else if(a==='retry'){ if(st.session){ startSession(); } else showLogin(); }
  else if(a==='close'){ dlg.close(); }
  else if(a==='rej-clear'){ st.rejected = []; saveQueue(); dlg.close(); updateHeader(); }
  else if(a==='opname'){ openOpname(b.dataset.fid); }
  else if(a==='fruits'){ openFruits(); }
  else if(a==='fruit-ren'){ if(b.getAttribute('aria-disabled')==='true'){ toast('Tunggu sampai buah ini terkirim ke server.'); return; } openRename(b.dataset.fid); }
  else if(a==='fruit-hide'){ if(b.getAttribute('aria-disabled')==='true'){ toast('Tunggu sampai buah ini terkirim ke server.'); return; } toggleHide(b.dataset.fid); }
  else if(a==='fruit-del'){
    if(b.getAttribute('aria-disabled')==='true'){ toast('Buah ini sudah dipakai di catatan. Sembunyikan saja kalau tidak dipakai lagi.'); return; }
    deleteFruit(b.dataset.fid);
  }
  else if(a==='pick-fruit'){
    const i = $('#f-fruit');
    if(i){ i.value = b.dataset.fruit; ui.draft.fruit = b.dataset.fruit;
      document.querySelectorAll('[data-act="pick-fruit"]').forEach(x => x.setAttribute('aria-pressed', x===b ? 'true' : 'false')); }
  }
  else if(a==='settings'){ openSettings(); }
  else if(a==='legacy'){ importLegacy(); }
  else if(a==='export-csv'){ exportCsv(); }
  else if(a==='genpw'){ const i = $(b.dataset.t); if(i) i.value = genPw(); }
  else if(a==='staff-new'){ openStaffNew(); }
  else if(a==='staff-edit'){ openStaffEdit(b.dataset.id); }
  else if(a==='staff-pw'){ openStaffPw(b.dataset.id); }
  else if(a==='staff-active'){
    const p = st.profiles.find(x=>x.id===b.dataset.id); if(!p) return;
    const next = !p.active;
    const ok = await ask(next?'Aktifkan akun ini?':'Nonaktifkan akun ini?', next?`${p.full_name} bisa login dan mencatat lagi.`:`${p.full_name} tidak bisa login lagi. Riwayat catatannya tetap tersimpan.`, next?'Aktifkan':'Nonaktifkan');
    if(ok){ const done = await mgmt(async()=>{ await staffCall({action:'set_active', id:p.id, active:next}); await pull(); }, next?'Akun diaktifkan':'Akun dinonaktifkan'); if(done) render(); }
  }
  else if(a==='staff-del'){
    const p = st.profiles.find(x=>x.id===b.dataset.id); if(!p) return;
    const ok = await ask('Hapus akun ini?', `Akun ${p.full_name} dihapus permanen. Staf yang sudah punya catatan tidak bisa dihapus, nonaktifkan saja.`, 'Hapus akun');
    if(ok){ const done = await mgmt(async()=>{ await staffCall({action:'delete', id:p.id}); await pull(); }, 'Akun dihapus'); if(done) render(); }
  }
  else if(a==='del'){
    const e = derived().all.find(x=>x.id===b.dataset.id); if(!e) return;
    const ok = await ask('Hapus catatan ini?', `${TYPES[e.type].label} ${e.type==='koreksi'?skg(Number(e.kg)):kg(Number(e.kg))} ${fruitName(e.fruit_id)}, ${dateLabel(e.entry_date)}. Stok akan dihitung ulang.`, 'Hapus');
    if(!ok) return;
    const pendOp = st.queue.find(o => o.k==='entry' && o.rows.some(r=>r.id===e.id));
    if(pendOp){
      pendOp.rows = pendOp.rows.filter(r=>r.id!==e.id);
      if(!pendOp.rows.length) st.queue = st.queue.filter(o=>o!==pendOp);
      saveQueue();
    } else { enqueue({k:'del', id:e.id, at:new Date().toISOString()}); }
    toast('Catatan dihapus'); render(); updateHeader(); sync();
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target;
  if(f.method==='dialog') return;
  ev.preventDefault();
  const id = f.id;
  if(id==='f-login') doLogin(f);
  else if(id==='f') submitEntry(f);
  else if(id==='f-opname') submitOpname(f);
  else if(id==='f-fruit-add') submitAddFruit(f);
  else if(id==='f-fruit-ren') submitRename(f);
  else if(id==='f-set') submitSettings(f);
  else if(id==='f-pw') submitPw(f);
  else if(id==='f-staff-new') submitStaffNew(f);
  else if(id==='f-staff-edit') submitStaffEdit(f);
  else if(id==='f-staff-pw') submitStaffPw(f);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id==='m'){ if(t.value) ui.month = t.value; render(); }
  else if(t.id==='f-date') ui.draft.date = t.value;
  else if(t.id==='f-fruit') ui.draft.fruit = t.value;
});

let timersOn = false;
function startTimers(){
  if(timersOn) return; timersOn = true;
  setInterval(() => { if(st.session && st.ready && document.visibilityState==='visible') sync(); }, POLL_MS);
}
window.addEventListener('online', () => { st.netFail = false; updateHeader(); if(st.session && st.ready) sync(); });
window.addEventListener('offline', () => updateHeader());
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && st.session && st.ready) sync(); });

/* =====================================================================
   Mulai
   ===================================================================== */
(function boot(){
  const s = LS.get('sb.session', null);
  if(!s || !s.user || !s.refresh_token){ showLogin(); }
  else { st.session = s; startSession(); }
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
})();
