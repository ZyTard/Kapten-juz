  }
  const line = role => { const r = reviewOf(day, role);
    return `<div class="pf ${r?'ok':''}"><span class="pf-r">${ROLE[role]}</span>${r?`<span><b>Diparaf ${esc(profName(r.reviewed_by))}</b>, ${esc(timeLabel(Date.parse(r.created_at)))}${r.note?`<br><span class="hint">${esc(r.note)}</span>`:''}</span>`:'<span class="hint">Belum diparaf</span>'}</div>`; };
  const mine = canParaf() ? reviewOf(day, myRole()) : null;
  let act = '';
  if(canParaf() && !mine) act = `<div class="field" style="margin-top:12px"><label for="p-note">Catatan paraf, boleh kosong</label><textarea id="p-note" maxlength="500" placeholder="Misal: waste mangga tinggi, sudah ditegur."></textarea></div>
      <button class="btn pri" data-act="paraf">Paraf sebagai ${ROLE[myRole()]}</button>`;
  if(mine && mine.reviewed_by===st.me.id && Date.now()-Date.parse(mine.created_at) < 86400000) act = `<button class="btn sm" style="margin-top:10px" data-act="unparaf">Batalkan paraf saya</button>`;
  const owed = canParaf() ? unsignedDays(7) : [];
  return `<section class="card sec"><h2>Paraf</h2><div class="pf-l">${line('manager')}${line('owner')}</div>${act}
    ${owed.length?`<p class="hint" style="margin-top:12px">Belum kamu paraf (7 hari terakhir): ${owed.map(x=>`<button type="button" class="link" data-act="goto-day" data-v="${x}">${esc(dateLabel(x))}</button>`).join(', ')}</p>`:''}</section>`;
}
async function doParaf(){
  const role = myRole(), day = ui.day, nt = String(($('#p-note')||{}).value||'').trim() || null;
  const ok = await mgmt(async()=>{
    const r = await api('/rest/v1/daily_reviews', {method:'POST', headers:{Prefer:'return=representation'}, body:{review_date:day, role, reviewed_by:st.me.id, note:nt}});
    if(!r.ok){ const e = await failure(r); if(e.code==='23505') e.message = 'Tanggal ini sudah diparaf '+ROLE[role]+'.'; throw e; }
    const rows = await r.json();
    st.reviews = st.reviews.filter(x => !(x.review_date===day && x.role===role)).concat(rows); saveCache(); bump();
  }, 'Paraf tersimpan');
  if(ok) render();
}
async function undoParaf(){
  const role = myRole(), day = ui.day;
  if(!await ask('Batalkan paraf?', `Paraf ${ROLE[role]} untuk ${dateLabel(day)} akan dihapus.`, 'Batalkan paraf')) return;
  const ok = await mgmt(async()=>{
    const r = await api('/rest/v1/daily_reviews?review_date=eq.'+day+'&role=eq.'+role, {method:'DELETE', headers:{Prefer:'return=representation'}});
    if(!r.ok) throw await failure(r);
    const rows = await r.json(); if(!rows.length) throw new Error(FRIENDLY['42501']);
    st.reviews = st.reviews.filter(x => !(x.review_date===day && x.role===role)); saveCache(); bump();
  }, 'Paraf dibatalkan');
  if(ok) render();
}

function keepForm(fn){
  const f = $('#f') || $('#f-sup');
  const fid = f ? f.id : null;
  const snap = f ? Array.from(new FormData(f).entries()) : null;
  fn();
  const nf2 = fid ? document.getElementById(fid) : null;
  if(snap && nf2) snap.forEach(([k,v]) => {
    if(k==='fruit' || k==='item') return; const el = nf2.elements[k];
    if(!el || !('value' in el)) return;
    if(el.tagName==='SELECT' && !Array.from(el.options).some(o=>o.value===v)) return;
    el.value = v;
  });
  refreshForm();
}

function updateHeader(){
  const el = $('#sync'), av = $('#acct'); if(!el) return;
  const n = st.queue.length;

  if(st.rejected.length){ t = st.rejected.length+' ditolak'; c = 'bad'; }
  else if(st.syncing){ t = 'Menyinkronkan'; c = 'mid'; }
  else if(isOffline()){ t = n ? 'Offline, '+n+' belum terkirim' : 'Offline'; c = 'bad'; }
  else if(n){ t = n+' belum terkirim'; c = 'mid'; }
  else { t = 'Tersinkron'; c = 'ok'; }

async function doLogin(form){
  const fd = new FormData(form);
  const raw = String(fd.get('email')||'').trim(), pw = String(fd.get('password')||'');
  const err = $('#l-err');
  if(!raw || !pw){ err.innerHTML = '<div class="err" role="alert">Isi username dan kata sandi.</div>'; return; }
  const email = toLoginEmail(raw);
  if(!navigator.onLine){ err.innerHTML = '<div class="err" role="alert">Butuh internet untuk login.</div>'; return; }
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Masuk...';
  let res;
  try{ res = await fetch(SB_URL+'/auth/v1/token?grant_type=password', {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify({email, password:pw})}); }
  catch(e){ btn.disabled = false; btn.textContent = 'Masuk'; err.innerHTML = '<div class="err" role="alert">Tidak ada koneksi ke server. Coba lagi.</div>'; return; }
  if(!res.ok){
    btn.disabled = false; btn.textContent = 'Masuk';
    let j = {}; try{ j = await res.json(); }catch(e){}
    const banned = j.error_code==='user_banned' || /banned/i.test(j.msg||j.message||'');
    const text = banned ? 'Akun ini dinonaktifkan. Hubungi manager.' : (res.status===400||res.status===401 ? 'Username atau kata sandi salah.' : 'Gagal masuk (kode '+res.status+'). Coba lagi.');
    err.innerHTML = `<div class="err" role="alert">${esc(text)}</div>`;
    return;
  }
  setSession(await res.json());
  await startSession();
}
async function startSession(){
  st.me = null; st.profiles = []; st.fruits = []; st.entries = new Map(); st.settings = {waste_target:null};
  st.cursor = 0; st.lastSync = 0; st.netFail = false; st.ready = false;
  st.supplies = []; st.sEntries = new Map(); st.sCursor = 0; st.migrated = true; st.migrated2 = false;
  st.reviews = []; st.migrated5 = false; st.migrated6 = false; st.migrated7 = false; st.migrated8 = false; st.migrated9 = false; ui.started = false; ui.day = todayStr();
  const cached = loadLocal();
  if(cached && st.me){ st.ready = true; enterApp(); sync(); return; }
  showLoading();
  await sync();
  if(st.me && st.me.active){ st.ready = true; enterApp(); }
  else if(st.me){ renderBlocked(); }
  else if(isOffline()){ showFatal('Tidak bisa memuat data. Periksa koneksi internet, lalu coba lagi.'); }
  else if(st.session){ renderBlocked('Akunmu belum terdaftar sebagai staf. Hubungi manager.'); }
}
async function doLogout(){
  if(st.queue.length){
    const ok = await ask('Keluar sekarang?', `Masih ada ${st.queue.length} catatan yang belum terkirim. Catatan itu tetap tersimpan di perangkat ini dan terkirim saat kamu login lagi dengan akun yang sama.`, 'Tetap keluar');
    if(!ok) return;
  }
  if(dlg.open) dlg.close();
  try{ await api('/auth/v1/logout', {method:'POST'}); }catch(e){}
  LS.del(ck()); LS.del('sb.session');
  st.session = null; st.ready = false; st.me = null;
  showLogin();
}

document.addEventListener('click', async ev => {

  else if(a==='goto-day'){ ui.day = v; render(); window.scrollTo(0,0); }
  else if(a==='day-riwayat'){ ui.q.riwayat = ''; ui.rd = {from:ui.day, to:ui.day}; ui.filter = 'semua'; ui.tab = 'riwayat'; render(); window.scrollTo(0,0); }

  else if(a==='tmode'){ ui.tmode = v; render(); }
  else if(a==='type'){ ui.type = v; render(); }
  else if(a==='dest'){ ui.dest = v; saveUnits(); keepForm(render); }
  else if(a==='su'){ ui.su = v; saveUnits(); render(); }
  else if(a==='month'){ ui.month = addMonths(ui.month, Number(v)); render(); }
  else if(a==='filter'){ ui.filter = v; render(); }
  else if(a==='ripe-q'){ const i = $('#f-ripe'); if(i){ i.value = v; document.querySelectorAll('[data-act="ripe-q"]').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false')); } }
  else if(a==='rd'){ ui.rd = {from:b.dataset.from||'', to:b.dataset.to||''}; render(); }
  else if(a==='sync'){
    if(st.rejected.length) openRejected(); else { if(dlg.open && b.closest('dialog')) { /* tetap di dialog */ } sync(true); }
  }
  else if(a==='account'){ openAccount(); }
  else if(a==='logout'){ doLogout(); }
  else if(a==='retry'){ if(st.session){ startSession(); } else showLogin(); }
  else if(a==='close'){ dlg.close(); }
  else if(a==='rej-clear'){ st.rejected = []; saveQueue(); dlg.close(); updateHeader(); }
  else if(a==='opname'){ openOpname(b.dataset.fid); }
  else if(a==='fruits'){ openFruits(); }
  else if(a==='fruit-ren'){ if(b.getAttribute('aria-disabled')==='true'){ toast('Tunggu sampai buah ini terkirim ke server.'); return; } openRename(b.dataset.fid); }
  else if(a==='fruit-hide'){ if(b.getAttribute('aria-disabled')==='true'){ toast('Tunggu sampai buah ini terkirim ke server.'); return; } toggleHide(b.dataset.fid); }
  else if(a==='fruit-del'){
    if(b.getAttribute('aria-disabled')==='true'){ toast('Buah ini sudah dipakai di catatan. Sembunyikan saja kalau tidak dipakai lagi.'); return; }

  }
  else if(a==='pick-fruit'){
    const i = $('#f-fruit');

  }

    deleteSupply(b.dataset.sid);

  else if(a==='s-opname'){ openSOpname(b.dataset.sid); }

      document.querySelectorAll('[data-act="pick-item"]').forEach(x => x.setAttribute('aria-pressed', x===b ? 'true' : 'false')); }

    if(!ok) return;

    if(pendOp){
      pendOp.rows = pendOp.rows.filter(r=>r.id!==e.id);
      if(!pendOp.rows.length) st.queue = st.queue.filter(o=>o!==pendOp);
      saveQueue();
    } else { enqueue({k:'sdel', id:e.id, at:new Date().toISOString()}); }
    toast('Catatan dihapus'); render(); updateHeader(); sync();
  }

      pendOp.rows = pendOp.rows.filter(r=>r.id!==e.id);
      if(!pendOp.rows.length) st.queue = st.queue.filter(o=>o!==pendOp);
      saveQueue();
    } else { enqueue({k:'del', id:e.id, at:new Date().toISOString()}); }
    toast('Catatan dihapus'); render(); updateHeader(); sync();
  }
