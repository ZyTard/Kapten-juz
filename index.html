<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4631">
<title>Stok Buah Kapten Juz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --ink:#0E2219; --green:#0F4631; --leaf:#1F7A57; --pucuk:#D3EB74; --pucuk-s:#E9F4BE; --mango:#F0A03C;
  --paper:#F1F6F1; --card:#FFFFFF; --line:#DCE5DC; --muted:#536860;
  --waste:#B8501A; --wastebg:#FBE6D6; --okbg:#E2F0E6; --danger:#B3261E;
  --c-masuk:#0F4631; --c-produksi:#5A7D2A; --c-eceran:#2F5D7C; --c-waste:#B8501A; --c-koreksi:#5B4B8A; --c-frozen:#2A7F9E; --c-dfreezer:#4B6A88;
  --viz-a:#1F7A57; --viz-b:#2A78D6; --viz-w:#C2561A;
  --r:20px; --r-in:12px;
  --fz:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--fz);padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}

/* Header */
.top{position:sticky;top:0;z-index:5;background:var(--green);color:#F4F8F2;padding:calc(10px + env(safe-area-inset-top)) 16px 14px;border-radius:0 0 24px 24px}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.top-r{display:flex;align-items:center;gap:10px}
.chip-s{border:0;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;min-height:32px}
.chip-s.ok{background:var(--pucuk);color:#0E3B2A}
.chip-s.mid{background:#FBE3B8;color:#5A3A00}
.chip-s.bad{background:#F8D2CC;color:#7C1A13}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:var(--mango);color:var(--ink);font-weight:800;cursor:pointer;padding:0}
.noshell .top,.noshell .tabs{display:none}
.noshell{padding-bottom:24px}
main{max-width:720px;margin:0 auto;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px}
main.pg{animation:pg .16s ease-out}
@keyframes pg{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{font-size:20px;letter-spacing:-.01em}
.empty p{color:var(--muted)}

.btn{border:1.5px solid var(--line);background:#fff;border-radius:var(--r-in);padding:11px 16px;font-weight:700;cursor:pointer;min-height:46px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.waste{background:var(--waste);border-color:var(--waste);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;min-height:36px;font-size:15px;border-radius:10px}
.btn.danger{color:var(--danger);border-color:#E8B9B4}
.btn[disabled]{opacity:.6;cursor:wait}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--leaf);font-weight:700;text-decoration:underline;cursor:pointer;text-align:left}

/* Login */
.login{max-width:420px;margin:7vh auto 0;display:flex;flex-direction:column;gap:20px}
.lg-brand{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.lg-brand img{width:68px;height:68px;border-radius:20px}
.lg-brand h1{font-size:30px;letter-spacing:-.03em;font-weight:800}
.lg-brand p{color:var(--muted)}

/* Stok */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;background:var(--green);color:#F4F8F2;border-radius:var(--r);padding:20px}
.sum>div{display:flex;flex-direction:column;gap:2px}
.sum .lbl{font-size:14px;color:#B7D2C3}
.sum strong{font-size:30px;letter-spacing:-.025em;line-height:1.1;color:var(--pucuk)}
.sum .w strong{color:var(--mango)}
.sum .fz{grid-column:1/-1;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);flex-direction:row;justify-content:space-between;align-items:baseline}
.sum .fz strong{font-size:22px;color:#fff}
.fc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.fc.neg{border-color:var(--danger)}
.fc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fc h3{font-size:20px;letter-spacing:-.015em}
.stk{font-size:15px;color:var(--muted)}
.stk strong{font-size:30px;color:var(--ink);letter-spacing:-.025em}
.warn{font-size:15px;color:var(--danger);font-weight:700}
.lvl{height:8px;border-radius:999px;background:#E7EEE6;overflow:hidden}
.lvl i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pucuk),var(--leaf))}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.mini dt{font-size:13px;color:var(--muted)}
.mini dd{margin:0;font-weight:800;font-size:15px}
.mini .w dd{color:var(--waste)}

/* Catat */
.seg{display:grid;gap:6px;background:#E3ECE3;padding:5px;border-radius:16px}
.seg button{border:0;background:transparent;border-radius:12px;padding:10px 2px;font-weight:700;font-size:15px;cursor:pointer;min-height:46px;color:var(--ink);transition:background .12s}
.seg button[aria-selected="true"]{color:#fff}
.seg .seg-masuk[aria-selected="true"]{background:var(--c-masuk)}
.seg .seg-produksi[aria-selected="true"]{background:var(--c-produksi)}
.seg .seg-eceran[aria-selected="true"]{background:var(--c-eceran)}
.seg .seg-waste[aria-selected="true"]{background:var(--c-waste)}
.seg .seg-frozen[aria-selected="true"]{background:var(--c-frozen)}
.seg .seg-dari_freezer[aria-selected="true"]{background:var(--c-dfreezer)}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:700}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-in);background:#fff;min-height:48px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--leaf);box-shadow:0 0 0 4px rgba(31,122,87,.16)}
textarea{min-height:76px;resize:vertical}
.kg{display:flex;align-items:center;gap:10px}
.kg input{font-size:34px;font-weight:800;text-align:right;letter-spacing:-.025em;min-height:66px}
.kg span{font-size:22px;font-weight:700;color:var(--muted)}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{background:#FCE9E7;color:#7C1A13;border-radius:var(--r-in);padding:10px 14px;font-size:15px}
.err ul{margin:0;padding-left:18px}
.hint{font-size:14px;color:var(--muted)}

/* Laporan */
.mbar{display:flex;gap:8px;align-items:center}
.mbar input{text-align:center;font-weight:800}
.mbar .btn{padding:0;width:48px;flex:none;font-size:22px}
.kpi{display:flex;flex-direction:column;gap:8px}
.kpi .big{font-size:58px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--waste)}
.kpi .sub{color:var(--muted)}
.tag{display:inline-block;align-self:flex-start;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.tag.ok{background:var(--okbg);color:var(--green)}
.tag.bad{background:var(--wastebg);color:var(--waste)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.grid2 .lbl{font-size:14px;color:var(--muted)}
.grid2 strong{font-size:20px;letter-spacing:-.01em}
.sec h2{font-size:18px;margin-bottom:12px;letter-spacing:-.015em}
.sec .hint+.viz,.sec h2+.hint{margin-top:-6px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-l{display:flex;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:5px}
.bar-t{height:10px;background:#E7EEE6;border-radius:999px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--waste);border-radius:999px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:14px;padding:6px 4px;border-bottom:1.5px solid var(--line)}
td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{min-width:420px}

/* Grafik */
.meter{position:relative;height:10px;border-radius:999px;background:#E7EEE6;margin:6px 0 20px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.meter u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);text-decoration:none}
.meter u span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap;margin-top:3px}
.viz{display:block;width:100%;height:auto;overflow:visible;touch-action:manipulation}
.viz text{font:11px var(--fz);fill:var(--muted)}
.viz .vl{fill:var(--ink);font-weight:800;font-size:12px}
.viz .ax{stroke:#E4EBE3;stroke-width:1}
.viz .tg{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.viz .hit{fill:transparent;cursor:pointer}
.viz .hit:hover,.viz .hit:focus{fill:rgba(15,70,49,.07);outline:0}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.35;max-width:230px;opacity:0;transition:opacity .1s;box-shadow:0 6px 18px rgba(14,34,25,.25)}
#tip.on{opacity:1}
details.dt{margin-top:10px}
details.dt summary{cursor:pointer;color:var(--leaf);font-weight:700;font-size:14px;min-height:36px;display:flex;align-items:center}
.sm-grid{display:grid;grid-template-columns:1fr;gap:10px}
.sm{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff}
.sm-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.sm-h strong{font-size:16px}
.sm-h span{font-size:13px;color:var(--muted)}
.rsub{margin-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.st-aman{background:#E2F0E6;color:#0F4631}
.st-menipis{background:#FFEBC2;color:#6B4200}
.st-segera{background:#FBDCC8;color:#7F3208}
.st-habis,.st-minus{background:#F8D2CC;color:#7C1A13}
.st-nodata{background:#E8ECE7;color:#3B4A42}
.an{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.an-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.an-h strong{font-size:17px}
.an dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:0}
.an dt{font-size:13px;color:var(--muted)}
.an dd{margin:0;font-weight:800;font-size:15px}
.an .buy{background:var(--pucuk-s);border-radius:10px;padding:8px 12px;font-size:14px;color:#2B3D00}

/* Riwayat */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hist{display:flex;flex-direction:column;gap:10px}
.he{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.he.pend{border-style:dashed;border-color:var(--mango)}
.he-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.he-t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.he-t strong{font-size:17px}
.he-d{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.he-k{font-weight:800;font-size:18px;white-space:nowrap}
.badge{display:inline-block;border-radius:7px;padding:2px 8px;font-size:13px;font-weight:700;color:#fff}
.b-masuk{background:var(--c-masuk)}.b-produksi{background:var(--c-produksi)}.b-eceran{background:var(--c-eceran)}.b-waste{background:var(--c-waste)}.b-koreksi{background:var(--c-koreksi)}.b-frozen{background:var(--c-frozen)}.b-dari_freezer{background:var(--c-dfreezer)}
.b-pend{background:#8A5A00}
.r-manager{background:var(--c-masuk)}.r-admin{background:var(--c-eceran)}.r-produksi{background:var(--c-produksi)}.r-kasir{background:var(--c-koreksi)}
.x{border:0;background:transparent;color:var(--danger);font-weight:700;font-size:14px;padding:8px;cursor:pointer;min-height:40px}

/* Staf */
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sc.off{background:#ECF0EA}
.sc-t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sc-t strong{font-size:18px}
.tag.off{background:#E3E7E1;color:#3B4A42}
.perm td:first-child{white-space:nowrap;font-weight:700}

/* Daftar buah */
.fr{border:1px solid var(--line);border-radius:var(--r-in);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fr-t{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.fr-t .hint{flex-basis:100%}
.fl2{display:flex;flex-direction:column;gap:10px}

/* Bahan, hasil produksi */
.fc.low{border-color:var(--mango);background:#FFF8EC}
.card.low{border-color:var(--mango);background:#FFF8EC;display:block;width:100%;font:inherit;color:inherit}
.yield{background:#E6F2E9;border-radius:var(--r-in);padding:10px 14px;font-size:15px;color:var(--green)}
.yield.bad{background:#FCE9E7;color:#7C1A13}
.stk.frz strong{color:var(--c-frozen)}
.upd{border-color:var(--mango);background:#FFF8EC}

/* Nav, dialog, toast */
.tabs{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;z-index:6;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 28px rgba(14,34,25,.16);display:flex;padding:6px;gap:2px}
.tabs button{flex:1;border:0;background:none;border-radius:18px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;min-height:56px;transition:background .12s}
.tabs button[aria-current="page"]{color:var(--green);background:var(--pucuk-s)}
.tabs button[aria-current="page"] svg{stroke:var(--green)}
.tabs svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
dialog{border:0;border-radius:24px;padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);color:var(--ink);box-shadow:0 20px 50px rgba(14,34,25,.3)}
dialog::backdrop{background:rgba(14,34,25,.55)}
.dl{padding:22px;display:flex;flex-direction:column;gap:14px}
.dl h2{font-size:20px;letter-spacing:-.015em}
.dl p{color:var(--muted)}
.dl hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}
.cred{background:#F1EBDA;border-radius:var(--r-in);padding:12px 14px;font-size:17px;display:flex;flex-direction:column;gap:4px;user-select:all;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (min-width:600px){.sm-grid{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){#toast,main.pg,.btn,.seg button,.tabs button,#tip{transition:none;animation:none}}
@media (max-width:380px){.mini{grid-template-columns:1fr 1fr}.kpi .big{font-size:48px}.top h1{font-size:19px}.sum strong{font-size:26px}}
@media (max-width:430px){.tabs button{font-size:11px}}
</style>
</head>
<body class="noshell">
<header class="top">
  <div class="top-in">
    <h1 id="ttl">Stok buah</h1>
    <div class="top-r">
      <button id="sync" class="chip-s ok" data-act="sync" type="button">Tersinkron</button>
      <button id="acct" class="avatar" data-act="account" type="button" aria-label="Akun saya">?</button>
    </div>
  </div>
</header>
<main id="app"></main>
<nav class="tabs" id="nav" aria-label="Menu utama"></nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Konfigurasi (kunci publishable memang aman ada di aplikasi web)
   ===================================================================== */
const SB_URL = 'https://ydkuivsjbmlyoztdnrmj.supabase.co';

};

};

};

const $ = s => document.querySelector(s);
const app = $('#app'), dlg = $('#dlg'), toastEl = $('#toast');
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const thisMonth = () => todayStr().slice(0,7);
const addMonths = (m,n) => { const [y,mo] = m.split('-').map(Number); const d = new Date(y,mo-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };

const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
const uuid = () => {
  if(crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6]&15)|64; b[8] = (b[8]&63)|128;
  const h = Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
};
function genPw(){
  const a = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const r = crypto.getRandomValues(new Uint32Array(10));
  return Array.from(r,x=>a[x%a.length]).join('');
}
function lev(a,b){
  const m=a.length, n=b.length, d=[];
  for(let i=0;i<=m;i++) d[i]=[i];
  for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function similar(a,b){ a=a.toLowerCase(); b=b.toLowerCase(); return Math.min(a.length,b.length)>=4 && lev(a,b)<=1; }

function setSession(j){
  st.session = {
    access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at:j.expires_at || Math.floor(Date.now()/1000)+(j.expires_in||3600),
    user:{id:j.user.id, email:j.user.email}
  };
  LS.set('sb.session', st.session);
}
let refreshP = null;
function refreshSession(){
  if(refreshP) return refreshP;
  refreshP = (async () => {
    const rt = st.session && st.session.refresh_token;
    if(!rt){ const e = new Error('Sesi berakhir'); e.auth = true; throw e; }
    let res;
    try{
      res = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token', {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:rt})});
    }catch(e){ throw new NetErr(); }
    if(res.status>=500) throw new NetErr('server');
    if(!res.ok){ const e = new Error('Sesi berakhir'); e.auth = true; throw e; }
    setSession(await res.json());
  })().finally(()=>{ refreshP = null; });
  return refreshP;
}
async function api(path, o){
  o = o || {};
  if(!st.session){ const e = new Error('Belum login'); e.auth = true; throw e; }
  if(st.session.expires_at - Date.now()/1000 < 60) await refreshSession();
  for(let attempt=0; attempt<2; attempt++){
    const h = Object.assign({apikey:SB_KEY, Authorization:'Bearer '+st.session.access_token}, o.headers||{});
    if(o.body!==undefined) h['Content-Type'] = 'application/json';
    let res;
    try{ res = await fetch(SB_URL+path, {method:o.method||'GET', headers:h, body:o.body!==undefined?JSON.stringify(o.body):undefined}); }
    catch(e){ throw new NetErr(); }
    if(res.status===401 && attempt===0){ await refreshSession(); continue; }
    return res;
  }
}
async function failure(res){
  let j = {}; try{ j = await res.json(); }catch(e){}
  let msg = j.message || j.msg || j.error_description || j.error || ('Kesalahan '+res.status);
  if(j.code && FRIENDLY[j.code]) msg = FRIENDLY[j.code];
  const e = new Error(msg); e.status = res.status; e.code = j.code; return e;
}
async function jget(path){ const r = await api(path); if(!r.ok) throw await failure(r); return r.json(); }
async function patchRow(path, body){
  const r = await api(path, {method:'PATCH', headers:{Prefer:'return=representation'}, body});
  if(!r.ok) throw await failure(r);
  const rows = await r.json();
  if(!rows.length){ const e = new Error(FRIENDLY['42501']); e.status = 403; throw e; }
  return rows;
}
async function staffCall(payload){
  if(st.session.expires_at - Date.now()/1000 < 60) await refreshSession();
  let res;
  try{
    res = await fetch(FN_URL, {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer '+st.session.access_token, 'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  }catch(e){ throw new NetErr(); }
  let j = {}; try{ j = await res.json(); }catch(e){}
  if(!res.ok){
    let msg = j.error || j.message || ('Kesalahan '+res.status);
    if(res.status===404) msg = 'Fungsi pengelola staf belum dipasang di Supabase.';
    if(res.status===401 && !j.error) msg = 'Fungsi staf menolak sesi ini. Matikan Verify JWT pada fungsi staff-admin, atau login ulang.';
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return j;
}

let memo = {v:-1};
function derived(){
  if(memo.v===st.ver) return memo;
  const fr = st.fruits.slice(), fids = new Set(fr.map(f=>f.id));
  const sp = st.supplies.slice(), sids = new Set(sp.map(s=>s.id));
  const em = new Map(st.entries), sem = new Map(st.sEntries), del = new Set(), sdel = new Set();
  st.queue.forEach(op => {
    if(op.k==='fruit' && !fids.has(op.row.id)){ fids.add(op.row.id); fr.push({id:op.row.id, name:op.row.name, hidden:false, _p:true}); }
    if(op.k==='supply' && !sids.has(op.row.id)){ sids.add(op.row.id); sp.push({id:op.row.id, name:op.row.name, unit:op.row.unit, min_stock:op.row.min_stock==null?null:op.row.min_stock, hidden:false, _p:true}); }
    if(op.k==='entry') op.rows.forEach(r => { if(!em.has(r.id)) em.set(r.id, Object.assign({}, r, {created_at:new Date(op.ts).toISOString(), _p:true})); });
    if(op.k==='sentry') op.rows.forEach(r => { if(!sem.has(r.id)) sem.set(r.id, Object.assign({}, r, {created_at:new Date(op.ts).toISOString(), _p:true})); });
    if(op.k==='del') del.add(op.id);
    if(op.k==='sdel') sdel.add(op.id);
  });
  const mark = (e, set) => (set.has(e.id) && !e.deleted_at) ? Object.assign({}, e, {deleted_at:new Date().toISOString()}) : e;
  const all = Array.from(em.values()).map(e => mark(e, del));
  const sAll = Array.from(sem.values()).map(e => mark(e, sdel));
  const fmap = {}; fr.forEach(f => { fmap[f.id] = f; });
  const smap = {}; sp.forEach(s => { smap[s.id] = s; });
  memo = {v:st.ver, all, live:all.filter(e=>!e.deleted_at), fruits:fr, fmap, sAll, sLive:sAll.filter(e=>!e.deleted_at), supplies:sp, smap};
  return memo;
}
const fruitName = id => { const f = derived().fmap[id]; return f ? f.name : '(buah dihapus)'; };
const findFruit = name => { const l = name.toLowerCase(); return derived().fruits.find(f => f.name.trim().toLowerCase()===l) || null; };

function stock(){
  const d = derived(), m = {};
  const get = id => m[id] || (m[id] = {masuk:0,produksi:0,eceran:0,waste:0,koreksi:0,frozen:0,dari_freezer:0,fnet:0});
  d.fruits.forEach(f => get(f.id));
  d.live.forEach(e => { const r = get(e.fruit_id); r[e.type] += Number(e.kg); if(e.type==='frozen') r.fnet += Number(e.kg_net||0); });
  Object.values(m).forEach(r => {
    // Stok gudang: buah yang dibekukan dihitung masuk produksi (berat kotor keluar dari gudang)
    r.stok = Math.round((r.masuk + r.koreksi - r.produksi - r.eceran - r.waste - r.frozen)*100)/100;
    // Stok freezer: berat bersih yang dibekukan dikurangi yang diambil ke dapur
    r.freezer = Math.round((r.fnet - r.dari_freezer)*100)/100;
  });
  return m;
}
function monthStats(m){
  const r = {masuk:0,produksi:0,eceran:0,waste:0,koreksi:0,frozen:0,dari_freezer:0,fnet:0,kupas:0,cats:{},stages:{},fruits:{},yield:{},kotor:0,bersih:0,noNet:0};
  derived().live.filter(e => e.entry_date.startsWith(m)).forEach(e => {
    const k = Number(e.kg); r[e.type] += k;
    const name = fruitName(e.fruit_id);
    const f = r.fruits[name] || (r.fruits[name] = {masuk:0,waste:0});
    if(e.type==='masuk') f.masuk += k;
    if(e.type==='produksi' || e.type==='frozen'){
      if(e.kg_net!=null){
        // Sisa kupas = berat kotor dikurangi berat bersih. Otomatis dihitung sebagai waste tahap produksi.
        const net = Number(e.kg_net), peel = Math.max(0, k-net);
        const y = r.yield[name] || (r.yield[name] = {kotor:0,bersih:0});
        y.kotor += k; y.bersih += net; r.kotor += k; r.bersih += net; if(e.type==='frozen') r.fnet += net;
        r.waste += peel; r.kupas += peel; f.waste += peel;
        r.cats.kupas = (r.cats.kupas||0) + peel;
        r.stages.produksi = (r.stages.produksi||0) + peel;
      } else r.noNet += k;
    }
    if(e.type==='waste'){
      f.waste += k;
      r.cats[e.category] = (r.cats[e.category]||0) + k;
      r.stages[e.stage] = (r.stages[e.stage]||0) + k;
      if(e.category==='kupas') r.kupas += k;
    }
  });
  r.pct = r.masuk>0 ? r.waste/r.masuk*100 : null;
  r.pctNet = r.masuk>0 ? (r.waste-r.kupas)/r.masuk*100 : null;
  return r;
}
function detail(e){
  const p = [];
  if(e.type==='masuk'){ if(e.price) p.push(rp(e.price)+'/kg'); if(e.origin) p.push(e.origin); }
  if(e.type==='produksi' || e.type==='frozen'){ if(e.kg_net!=null){ const n = Number(e.kg_net), g = Number(e.kg); p.push('bersih '+kg(n)+', hasil '+pct(g>0?n/g*100:0)); } if(e.type==='produksi' && e.menu) p.push(e.menu); }
  if(e.type==='eceran' && e.price) p.push(rp(e.price)+'/kg');
  if(e.type==='waste'){ p.push(CATS[e.category]||e.category); p.push('tahap '+(STAGES[e.stage]||e.stage).toLowerCase()); }
  if(e.note) p.push(e.note);
  p.push('oleh '+profName(e.created_by));
  return p.join(', ');
}

const INS_KEYS = ['id','entry_date','type','fruit_id','kg','price','origin','menu','category','stage','note','created_by'];
const insPayload = r => { const o = {}; INS_KEYS.forEach(k => { o[k] = r[k]===undefined ? null : r[k]; }); if(r.kg_net!=null) o.kg_net = r.kg_net; return o; };
const SINS_KEYS = ['id','entry_date','type','supply_id','qty','price','note','created_by'];
const sinsPayload = r => { const o = {}; SINS_KEYS.forEach(k => { o[k] = r[k]===undefined ? null : r[k]; }); if(r.loc!=null) o.loc = r.loc; return o; };

function enqueue(op){ op.ts = Date.now(); st.queue.push(op); saveQueue(); }

function remapFruit(oldId, newId){
  st.queue.forEach(o => { if(o.k==='entry') o.rows.forEach(r => { if(r.fruit_id===oldId) r.fruit_id = newId; }); });
}
async function sendOp(op){
  if(op.k==='fruit'){
    const r = await api('/rest/v1/fruits?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}, body:{id:op.row.id, name:op.row.name}});
    if(r.ok) return;
    const e = await failure(r);
    if(r.status===409 || e.code==='23505'){
      const list = await jget('/rest/v1/fruits?select=id,name');
      const hit = list.find(f => f.name.trim().toLowerCase()===op.row.name.trim().toLowerCase());
      if(hit){ remapFruit(op.row.id, hit.id); return; }
    }
    throw e;
  }
  if(op.k==='entry'){
    const r = await api('/rest/v1/entries?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}, body:op.rows.map(insPayload)});
    if(!r.ok) throw await failure(r);
    return;
  }
  if(op.k==='del'){
    await patchRow('/rest/v1/entries?id=eq.'+encodeURIComponent(op.id), {deleted_at:op.at});
    return;
  }
  if(op.k==='supply'){
    const r = await api('/rest/v1/supplies?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}, body:{id:op.row.id, name:op.row.name, unit:op.row.unit, min_stock:op.row.min_stock==null?null:op.row.min_stock}});
    if(r.ok) return;
    const e = await failure(r);
    if(r.status===409 || e.code==='23505'){
      const list = await jget('/rest/v1/supplies?select=id,name');
      const hit = list.find(s => s.name.trim().toLowerCase()===op.row.name.trim().toLowerCase());
      if(hit){ st.queue.forEach(o => { if(o.k==='sentry') o.rows.forEach(x => { if(x.supply_id===op.row.id) x.supply_id = hit.id; }); }); return; }
    }
    throw e;
  }
  if(op.k==='sentry'){
    const r = await api('/rest/v1/supply_entries?on_conflict=id', {method:'POST', headers:{Prefer:'resolution=ignore-duplicates,return=minimal'}, body:op.rows.map(sinsPayload)});
    if(!r.ok) throw await failure(r);
    return;
  }
  if(op.k==='sdel'){
    await patchRow('/rest/v1/supply_entries?id=eq.'+encodeURIComponent(op.id), {deleted_at:op.at});
    return;
  }
}
function describeOp(op){
  if(op.k==='fruit') return 'Buah baru '+op.row.name;
  if(op.k==='supply') return 'Bahan baru '+op.row.name;
  if(op.k==='del' || op.k==='sdel') return 'Hapus satu catatan';
  if(op.k==='sentry'){ const r = op.rows[0]; return STYPES[r.type].label+' '+fq(Number(r.qty),sUnit(r.supply_id))+' '+sName(r.supply_id); }
  if(op.rows.length>1) return op.rows.length+' catatan impor';
  const r = op.rows[0]; return TYPES[r.type].label+' '+kg(Number(r.kg))+' '+fruitName(r.fruit_id);
}
let flushing = false;
async function flush(){
  if(flushing || !st.session) return;
  flushing = true;
  try{
    while(st.queue.length){
      const op = st.queue[0];
      try{ await sendOp(op); st.queue.shift(); saveQueue(); }
      catch(e){
        if(e.net || e.auth || e.status>=500 || e.status===429 || e.status===408) throw e;
        st.rejected.push({desc:describeOp(op), msg:e.message, at:Date.now()});
        st.queue.shift(); saveQueue();
        toast('Satu catatan ditolak server. Ketuk status di atas untuk melihat.');
      }
    }
  } finally { flushing = false; }
}
async function pull(){
  const uid = st.session.user.id;
  const [me, profiles, fruits, settings] = await Promise.all([
    jget('/rest/v1/profiles?select=id,email,full_name,role,active&id=eq.'+uid),
    jget('/rest/v1/profiles?select=id,email,full_name,role,active&order=full_name.asc'),
    jget('/rest/v1/fruits?select=id,name,hidden&order=name.asc'),
    jget('/rest/v1/settings?select=waste_target&id=eq.1')
  ]);
  const from = st.cursor ? new Date(st.cursor-300000).toISOString() : null;
  let off = 0, maxMs = st.cursor||0;
  for(;;){
    let p = '/rest/v1/entries?select=*&order=updated_at.asc,id.asc&limit=1000&offset='+off;
    if(from) p += '&updated_at=gte.'+encodeURIComponent(from);
    const rows = await jget(p);
    rows.forEach(r => { st.entries.set(r.id, r); const ms = Date.parse(r.updated_at); if(ms>maxMs) maxMs = ms; });
    if(rows.length<1000) break;
    off += 1000;
  }
  // Bahan dan kemasan (butuh 3-update.sql di database)
  try{
    const sups = await jget('/rest/v1/supplies?select=id,name,unit,min_stock,hidden&order=name.asc');
    const sfrom = st.sCursor ? new Date(st.sCursor-300000).toISOString() : null;
    let soff = 0, smax = st.sCursor||0;
    for(;;){
      let sp = '/rest/v1/supply_entries?select=*&order=updated_at.asc,id.asc&limit=1000&offset='+soff;
      if(sfrom) sp += '&updated_at=gte.'+encodeURIComponent(sfrom);
      const srows = await jget(sp);
      srows.forEach(r => { st.sEntries.set(r.id, r); const ms = Date.parse(r.updated_at); if(ms>smax) smax = ms; });
      if(srows.length<1000) break;
      soff += 1000;
    }
    st.supplies = sups; st.sCursor = smax; st.migrated = true;
    // Pembaruan 4 (freezer dan stok gudang/dapur): ada kolom loc di supply_entries
    if(!st.migrated2){
      try{ await jget('/rest/v1/supply_entries?select=loc&limit=1'); st.migrated2 = true; }
      catch(e2){ if(e2.net || e2.auth) throw e2; st.migrated2 = false; }
    }
  }catch(e){
    if(e.net || e.auth) throw e;
    if(e.status===404 || e.status===400 || e.code==='PGRST205' || e.code==='42P01'){ st.migrated = false; st.migrated2 = false; }
    else throw e;
  }
  st.cursor = maxMs;
  st.me = me[0] || null; st.profiles = profiles; st.fruits = fruits;
  st.settings = settings[0] || {waste_target:null};
  st.lastSync = Date.now();
  saveCache(); bump();
}
async function sync(manual){
  if(!st.session) return;
  if(st.syncing){ st.again = true; return; }
  if(!navigator.onLine){ updateHeader(); if(manual) toast('Sedang offline. Catatan terkirim otomatis saat sinyal kembali.'); return; }
  st.syncing = true; updateHeader();
  try{
    await flush();
    await pull();
    st.netFail = false;
    afterSync();
    if(manual) toast('Data sudah terbaru');
  }catch(e){
    if(e.auth) forceLogin('Sesi berakhir. Silakan login lagi.');
    else if(e.net) st.netFail = true;
    else if(manual) toast('Gagal sinkron: '+e.message);
  }finally{
    st.syncing = false; updateHeader();
    if(st.again){ st.again = false; setTimeout(()=>sync(), 300); }
  }
}
function afterSync(){
  if(!st.ready) return;
  if(!st.me || !st.me.active){ renderBlocked(); return; }
  updateNav(); updateHeader();
  if(ui.tab==='catat' || (ui.tab==='bahan' && ui.sub==='catat')) return;
  const y = window.scrollY; keepForm(render); window.scrollTo(0,y);
}

async function submitEntry(form){
  const fd = new FormData(form), t = ui.type;
  if(!allowedTypes().includes(t)){ toast('Perananmu tidak bisa membuat catatan ini.'); return; }
  const typed = normName(fd.get('fruit'));
  const row = {id:uuid(), entry_date:String(fd.get('date')||''), type:t, fruit_id:null,
    kg:parseFloat(String(fd.get('kg')||'').replace(',','.')), price:null, origin:null, menu:null,
    category:null, stage:null, note:null, created_by:st.me.id};
  const errs = [];
  if(!row.entry_date) errs.push('Isi tanggal.'); else if(row.entry_date>todayStr()) errs.push('Tanggal tidak boleh di masa depan.');
  if(!typed) errs.push('Isi jenis buah.');
  if(!isFinite(row.kg) || row.kg<=0) errs.push('Isi berat lebih dari 0 kg.');
  else if(row.kg>99999) errs.push('Berat terlalu besar. Periksa lagi angkanya.');
  const price = parseFloat(fd.get('price')); if(isFinite(price) && price>=0) row.price = price;
  if(t==='masuk'){ const o = String(fd.get('origin')||'').trim(); if(o) row.origin = o; }
  if(t==='produksi' || t==='frozen'){
    if(t==='produksi'){ const m = String(fd.get('menu')||'').trim(); if(m) row.menu = m; }
    const net = parseFloat(String(fd.get('net')||'').replace(',','.'));
    if(!isFinite(net) || net<=0) errs.push('Isi berat setelah dikupas, lebih dari 0 kg.');
    else if(isFinite(row.kg) && net>row.kg+0.0001) errs.push('Berat bersih tidak boleh lebih besar dari berat kotor.');
    else row.kg_net = net;
    if(t==='produksi' && !st.migrated) errs.push('Database belum diperbarui. Minta manager menjalankan 3-update.sql di Supabase.');
    if(t==='frozen' && !st.migrated2) errs.push('Fitur freezer belum aktif. Minta manager menjalankan 4-update.sql di Supabase.');
  }
  if(t==='waste'){
    row.category = String(fd.get('cat')||'') || null; row.stage = String(fd.get('stage')||'') || null;
    const n = String(fd.get('note')||'').trim(); if(n) row.note = n;
    if(!row.category) errs.push('Pilih kategori waste.');
    if(!row.stage) errs.push('Pilih tahap terjadinya waste.');
    if(row.category==='lainnya' && !row.note) errs.push('Tulis alasan waste pada catatan.');
  }
  if(t==='dari_freezer' && !st.migrated2) errs.push('Fitur freezer belum aktif. Minta manager menjalankan 4-update.sql di Supabase.');
  const box = $('#f-err');
  if(errs.length){ box.innerHTML = `<div class="err" role="alert"><ul>${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; box.scrollIntoView({block:'center'}); return; }
  box.innerHTML = '';
  const known = findFruit(typed);
  let fname = typed;
  if(known) fname = known.name;
  else {
    const sim = derived().fruits.find(f => similar(f.name, typed));
    if(sim){
      const okNew = await ask('Buah baru?', `"${typed}" mirip dengan "${sim.name}" yang sudah ada. Simpan sebagai buah baru?`, 'Ya, buah baru');
      if(!okNew){ const fi = $('#f-fruit'); if(fi) fi.focus(); return; }
    }
  }
  if(t!=='masuk'){
    const sx = known ? stock()[known.id] : null, fz = t==='dari_freezer';
    const avail = sx ? (fz ? sx.freezer : sx.stok) : 0;
    if(row.kg > avail + 0.001){
      const msg = fz
        ? `Stok freezer ${fname} tercatat ${kg(avail)}, sedangkan yang akan diambil ${kg(row.kg)}. Pastikan catatan "Ke freezer" sudah diisi. Tetap simpan?`
        : `Stok ${fname} tercatat ${kg(avail)}, sedangkan yang akan dicatat keluar ${kg(row.kg)}. Pastikan catatan buah masuk sudah diisi. Tetap simpan?`;
      const ok = await ask('Stok tidak cukup', msg, 'Tetap simpan');
      if(!ok) return;
    }
  }
  if(known) row.fruit_id = known.id;
  else { row.fruit_id = uuid(); enqueue({k:'fruit', row:{id:row.fruit_id, name:typed}}); }
  enqueue({k:'entry', rows:[row]});
  ui.draft = {date:row.entry_date, fruit:fname};
  toast(`Tersimpan: ${TYPES[t].label.toLowerCase()} ${kg(row.kg)} ${fname}${row.kg_net!=null?', hasil '+pct(row.kg_net/row.kg*100):''}${known?'':'. Buah baru masuk ke daftar.'}`);
  render(); updateHeader(); sync();
}

function bars(obj, labels){
  const tot = Object.values(obj).reduce((a,b)=>a+b,0);
  if(!tot) return '<p class="hint">Belum ada waste tercatat pada bulan ini.</p>';

/* =====================================================================
   Grafik (SVG inline, tanpa library) dan analisis bahan
   ===================================================================== */
const VIZ = {a:'#1F7A57', b:'#2A78D6', w:'#C2561A'};
const W = 320;
const dshort = d => new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const addDays = (d,n) => { const [y,m,dd] = d.split('-').map(Number); const t = new Date(y,m-1,dd+n); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); };
const daysIn = m => { const [y,mo] = m.split('-').map(Number); return new Date(y,mo,0).getDate(); };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const cnum = n => n>=1000 ? nf1.format(n/1000)+' rb' : nf1.format(Math.round(n*10)/10);
function niceMax(v){
  if(!(v>0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v/p;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
}
function topRound(x,y,w,h,r){
  if(h<=0) return '';
  r = Math.min(r, w/2, h);
  return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`;
}
function gridY(mx, L, R, T, B, fmt){
  const H = B-T;
  return [0,.5,1].map(f => {
    const y = B - H*f, v = mx*f;
    return `<line class="ax" x1="${L}" x2="${R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`;
  }).join('');
}
/* Kolom berkelompok. series: [{name,color,vals}], target: angka atau null, lastLabel: tampilkan nilai di kolom terakhir */
function colChart(labels, series, o){
  o = o || {};
  const fmt = o.fmt || cnum, tipFmt = o.tipFmt || fmt;
  const L = 34, R = W-4, T = 16, B = 128, H = B-T, n = labels.length, slot = (R-L)/n;
  let top = 0; series.forEach(s => s.vals.forEach(v => { if(v>top) top = v; }));
  if(o.target!=null && o.target>top) top = o.target;
  const mx = niceMax(top*1.08);
  const ns = series.length, bw = Math.min(ns>1?15:24, slot*0.7/ns), gap = ns>1?2:0, gw = ns*bw+(ns-1)*gap;
  const y = v => B - H*(v/mx);
  let g = gridY(mx, L, R, T, B, fmt), hits = '';
  labels.forEach((lb, i) => {
    const cx = L + slot*i + slot/2, x0 = cx - gw/2;
    series.forEach((s, k) => {
      const v = s.vals[i]; if(!(v>0)) return;
      const h = Math.max(2, H*(v/mx)), bx = x0 + k*(bw+gap);
      g += `<path d="${topRound(bx, B-h, bw, h, 4)}" fill="${s.color}"/>`;
    });
    if(o.lastLabel && i===n-1){
      series.forEach((s, k) => { const v = s.vals[i]; if(v>0) g += `<text class="vl" x="${x0 + k*(bw+gap) + bw/2}" y="${y(v)-5}" text-anchor="middle">${fmt(v)}</text>`; });
    }
    g += `<text x="${cx}" y="${B+16}" text-anchor="middle">${esc(lb)}</text>`;
    const tip = lb + '\n' + series.map(s => s.name+': '+tipFmt(s.vals[i]||0)).join('\n');
    hits += `<rect class="hit" tabindex="0" role="img" aria-label="${esc(tip.replace(/\n/g,', '))}" data-tip="${esc(tip)}" x="${L+slot*i}" y="${T-6}" width="${slot}" height="${H+30}"/>`;
  });
  if(o.target!=null){
    const ty = y(o.target);
    g += `<line class="tg" x1="${L}" x2="${R}" y1="${ty}" y2="${ty}"/><text x="${L+4}" y="${ty-4}" text-anchor="start">${esc(o.targetLabel||'Target')}</text>`;
  }
  return `<svg class="viz" viewBox="0 0 ${W} ${B+24}" role="group" aria-label="${esc(o.label||'Grafik')}">${g}${hits}</svg>`;
}
/* Garis kecil satu seri dengan wash 10%. vals: angka, labels: label x, unit: satuan */
function lineChart(labels, tips, vals, unit, color){
  const L = 4, R = W-14, T = 18, B = 66, H = B-T, n = vals.length;
  const mx = niceMax(Math.max.apply(null, vals.concat([0]))*1.1);
  const xs = i => n>1 ? L + (R-L)*i/(n-1) : (L+R)/2, ys = v => B - H*(v/mx);
  const pts = vals.map((v,i) => [xs(i), ys(v)]);
  const line = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
  const area = line + `L${pts[n-1][0].toFixed(1)},${B}L${pts[0][0].toFixed(1)},${B}Z`;
  let hits = '';
  const step = (R-L)/Math.max(1,n-1);
  vals.forEach((v,i) => {
    const tip = tips[i]+'\n'+fq(v, unit);
    hits += `<rect class="hit" tabindex="0" role="img" aria-label="${esc(tip.replace(/\n/g,': '))}" data-tip="${esc(tip)}" x="${(xs(i)-step/2).toFixed(1)}" y="0" width="${step.toFixed(1)}" height="${B+22}"/>`;
  });
  const last = pts[n-1];
  return `<svg class="viz" viewBox="0 0 ${W} ${B+22}" role="group">
    <line class="ax" x1="${L}" x2="${R}" y1="${B}" y2="${B}"/><line class="ax" x1="${L}" x2="${R}" y1="${T}" y2="${T}"/>
    <text x="${L}" y="${T-5}">${cnum(mx)}</text>
    <path d="${area}" fill="${color}" fill-opacity=".1"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="${color}" stroke="#fff" stroke-width="2"/>
    <text x="${L}" y="${B+16}">${esc(labels[0])}</text><text x="${R}" y="${B+16}" text-anchor="end">${esc(labels[n-1])}</text>${hits}</svg>`;
}
function legend(items){ return `<div class="leg">${items.map(i=>`<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`; }
function tableHtml(head, rows){
  return `<div class="tw"><table><thead><tr>${head.map((h,i)=>`<th${i?' class="n"':''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="n"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function meter(pctVal, target){
  const mx = Math.max(target!=null?target*2:0, pctVal*1.15, 5);
  const col = target==null ? VIZ.a : (pctVal<=target ? VIZ.a : pctVal<=target*1.25 ? '#E0A020' : VIZ.w);
  return `<div class="meter" role="img" aria-label="Waste ${pct(pctVal)}${target!=null?' dari target '+pct(target):''}"><i style="width:${Math.min(100,pctVal/mx*100).toFixed(1)}%;background:${col}"></i>${target!=null?`<u style="left:${(target/mx*100).toFixed(1)}%"><span>Target ${pct(target)}</span></u>`:''}</div>`;
}

/* ---------- Tooltip (sentuh atau arahkan) ---------- */
let tipEl = null, tipFor = null;
function showTip(el){
  if(!tipEl){ tipEl = document.createElement('div'); tipEl.id = 'tip'; tipEl.setAttribute('role','tooltip'); document.body.appendChild(tipEl); }
  tipFor = el; tipEl.innerHTML = esc(el.getAttribute('data-tip')).replace(/\n/g,'<br>');
  const r = el.getBoundingClientRect(), tw = tipEl.offsetWidth || 160;
  let x = r.left + r.width/2 - tw/2; x = Math.max(8, Math.min(window.innerWidth - tw - 8, x));
  tipEl.style.left = x+'px'; tipEl.style.top = Math.max(8, r.top - (tipEl.offsetHeight||44) - 6)+'px';
  tipEl.classList.add('on');
}
function hideTip(){ if(tipEl) tipEl.classList.remove('on'); tipFor = null; }
document.addEventListener('pointerover', e => { if(e.pointerType==='mouse'){ const t = e.target.closest('[data-tip]'); if(t) showTip(t); else hideTip(); } });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if(t) showTip(t); });
document.addEventListener('focusout', hideTip);
document.addEventListener('pointerdown', e => { const t = e.target.closest('[data-tip]'); if(t && e.pointerType!=='mouse') showTip(t); else if(!t) hideTip(); });
window.addEventListener('scroll', hideTip, {passive:true});

/* ---------- Analisis stok bahan ---------- */
function supAnchor(m){ const end = m+'-'+pad(daysIn(m)); return end < todayStr() ? end : todayStr(); }
const STATUS = {
  aman:{label:'Aman', icon:'✓'}, menipis:{label:'Menipis', icon:'!'}, segera:{label:'Segera beli', icon:'!'},
  habis:{label:'Habis', icon:'✕'}, minus:{label:'Stok minus', icon:'✕'}, nodata:{label:'Belum ada pemakaian', icon:'–'}
};
function analyzeSupplies(m){
  const d = derived(), s = supplyStock(), anchor = supAnchor(m), from = addDays(anchor, -27), m2 = st.migrated2;
  const rows = [];
  d.supplies.filter(x => !x.hidden || (s[x.id] && s[x.id].stok!==0)).forEach(x => {
    const r = s[x.id] || {stok:0,gudang:0,dapur:0,masuk:0,pakai:0,rusak:0};
    const ent = d.sLive.filter(e => e.supply_id===x.id);
    const first = ent.reduce((a,e) => (!a || e.entry_date<a) ? e.entry_date : a, null);
    const use28 = ent.filter(e => e.type==='pakai' && e.entry_date>=from && e.entry_date<=anchor).reduce((t,e)=>t+Number(e.qty),0);
    const bad28 = ent.filter(e => e.type==='rusak' && e.entry_date>=from && e.entry_date<=anchor).reduce((t,e)=>t+Number(e.qty),0);
    const span = first ? Math.max(7, Math.min(28, daysBetween(first, anchor)+1)) : 28;
    const rate = use28>0 ? use28/span : 0;
    const total = m2 ? r.gudang + r.dapur : r.stok;
    const left = rate>0 ? Math.max(0, total/rate) : null;
    let status = 'aman';
    if((m2 && (r.gudang<0 || r.dapur<0)) || (!m2 && r.stok<0)) status = 'minus';
    else if(rate>0 && total<=0) status = 'habis';
    else if(left!=null && left<=7) status = 'segera';
    else if((left!=null && left<=14) || (x.min_stock!=null && (m2?r.gudang:r.stok) <= Number(x.min_stock))) status = 'menipis';
    else if(rate===0 && !ent.length) status = 'nodata';
    const buy = rate>0 ? Math.max(0, Math.ceil(rate*14 - total)) : 0;
    rows.push({x, r, total, rate, left, status, buy, use28, bad28, badPct: (use28+bad28)>0 ? bad28/(use28+bad28)*100 : null});
  });
  const rank = {minus:0, habis:1, segera:2, menipis:3, aman:4, nodata:5};
  rows.sort((a,b) => rank[a.status]-rank[b.status] || (a.left==null?1e9:a.left)-(b.left==null?1e9:b.left) || a.x.name.localeCompare(b.x.name,'id'));
  return rows;
}
function supTrend(mode, m){
  const d = derived(), anchor = supAnchor(m), bk = [];
  if(mode==='bulan'){
    for(let i=5;i>=0;i--){ const mm = addMonths(m,-i); bk.push({s:mm+'-01', e:mm+'-'+pad(daysIn(mm)), label:monthShort(mm), full:monthLabel(mm)}); }
  } else {
    for(let k=7;k>=0;k--){ const e = addDays(anchor,-7*k), s0 = addDays(e,-6); bk.push({s:s0, e, label:dshort(s0), full:dshort(s0)+' – '+dshort(e)}); }
  }
  const use = {};
  d.sLive.forEach(e => {
    if(e.type!=='pakai') return;
    const b = bk.findIndex(x => e.entry_date>=x.s && e.entry_date<=x.e); if(b<0) return;
    const a = use[e.supply_id] || (use[e.supply_id] = bk.map(()=>0)); a[b] += Number(e.qty);
  });
  return {bk, use};
}

function viewLapBahan(m){
  if(!st.migrated) return `<section class="card empty"><h2>Database belum diperbarui</h2><p>Analisis bahan butuh pembaruan database. Minta manager menjalankan 3-update.sql di Supabase.</p></section>`;
  const rows = analyzeSupplies(m);
  if(!rows.length) return `<section class="card empty"><h2>Belum ada bahan</h2><p>Tambahkan bahan di tab Bahan, lalu catat pemakaiannya. Analisis muncul setelah ada catatan.</p></section>`;
  const urgent = rows.filter(r => ['minus','habis','segera'].includes(r.status)).length;
  const thin = rows.filter(r => r.status==='menipis').length;
  const use = rows.reduce((t,r)=>t+r.use28,0), bad = rows.reduce((t,r)=>t+r.bad28,0);

    return `<article class="an">

      ${r.buy>0?`<p class="buy">Saran beli sekitar <b>${fq(r.buy,x.unit)}</b> agar cukup 14 hari.</p>`:''}
    </article>`;
  }).join('');
  const mode = ui.tmode, tr = supTrend(mode, m);
  const ranked = rows.filter(r => tr.use[r.x.id] && tr.use[r.x.id].some(v=>v>0)).sort((a,b) => tr.use[b.x.id].reduce((p,c)=>p+c,0) - tr.use[a.x.id].reduce((p,c)=>p+c,0));
  const labels = tr.bk.map(b => b.label);
  const cards = ranked.slice(0,8).map(r => {
    const v = tr.use[r.x.id], tot = v.reduce((p,c)=>p+c,0), last = v[v.length-1], prev = v[v.length-2] || 0;
    const delta = prev>0 ? ((last-prev)/prev*100) : null;
    const tl = tr.bk.map((b,i)=>b.full);
    return `<div class="sm"><div class="sm-h"><strong>${esc(r.x.name)}</strong><span>${fq(tot,r.x.unit)} total</span></div>

      <p class="hint">${mode==='bulan'?'Bulan ini':'Minggu terakhir'} ${fq(last,r.x.unit)}${delta==null?'':', '+(delta>=0?'naik ':'turun ')+pct(Math.abs(delta))+' dari sebelumnya'}.</p></div>`;
  }).join('');
  const tableRows = ranked.map(r => [r.x.name+' ('+r.x.unit+')'].concat(tr.use[r.x.id].map(v => nf.format(Math.round(v*10)/10))));
  const trendSec = `<section class="card sec"><h2>Tren pemakaian</h2>
      <div class="chips" role="group" aria-label="Rentang tren" style="margin-bottom:10px"><button class="chip" data-act="tmode" data-v="minggu" aria-pressed="${mode==='minggu'}">8 minggu</button><button class="chip" data-act="tmode" data-v="bulan" aria-pressed="${mode==='bulan'}">6 bulan</button></div>
      ${ranked.length ? `<div class="sm-grid">${cards}</div>${ranked.length>8?'<p class="hint" style="margin-top:8px">Menampilkan 8 bahan dengan pemakaian terbanyak.</p>':''}
      <details class="dt"><summary>Lihat angka</summary>${tableHtml(['Bahan'].concat(labels), tableRows)}</details>`
      : '<p class="hint">Belum ada catatan pemakaian pada rentang ini. Catat "Dipakai" di tab Bahan agar tren muncul.</p>'}
    </section>`;
  const sm = supMonth(m), m2 = st.migrated2;
  const sRows = Object.entries(sm).sort((a,b)=>sName(a[0]).localeCompare(sName(b[0]),'id')).map(([id,v])=>`<tr><td>${esc(sName(id))}</td><td class="n">${fq(v.masuk,'')}</td>${m2?`<td class="n">${fq(v.pindah,'')}</td>`:''}<td class="n">${fq(v.pakai,'')}</td><td class="n">${fq(v.rusak,'')}</td><td>${esc(sUnit(id))}</td></tr>`).join('');

  return `${tiles}
    <section class="card sec"><h2>Analisis stok</h2><div class="sm-grid" style="grid-template-columns:1fr">${list}</div>
      <p class="hint" style="margin-top:12px">Perkiraan memakai rata-rata pemakaian 28 hari terakhir dan stok gudang ditambah dapur. Makin rutin pemakaian dicatat, makin akurat angkanya.${bad>0?` Rusak atau hilang: ${pct(bad/(use+bad)*100)} dari total pemakaian.`:''}</p></section>

function viewLapBuah(m, cur, prev){
  const target = parseFloat(st.settings.waste_target);
  let tag = '', cmp = '';
  if(cur.pct!=null && isFinite(target)){
    tag = cur.pct<=target ? `<span class="tag ok">Dalam target ${pct(target)}</span>` : `<span class="tag bad">Di atas target ${pct(target)}</span>`;
  }
  if(cur.pct!=null && prev.pct!=null){
    const df = cur.pct-prev.pct;
    cmp = Math.abs(df)<0.05 ? `Sama dengan ${esc(monthLabel(addMonths(m,-1)))}.` :
      `${df>0?'Naik':'Turun'} ${nf1.format(Math.abs(Math.round(df*10)/10))} poin dibanding ${esc(monthLabel(addMonths(m,-1)))}.`;
  }
  const fr = Object.entries(cur.fruits).filter(([,v])=>v.masuk||v.waste).sort((a,b)=>b[1].waste-a[1].waste);
  const frRows = fr.length ? fr.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="n">${kg(v.masuk)}</td><td class="n">${kg(v.waste)}</td><td class="n">${v.masuk>0?pct(v.waste/v.masuk*100):'–'}</td></tr>`).join('')
    : '<tr><td colspan="4" class="hint">Belum ada data bulan ini.</td></tr>';
  const months = [5,4,3,2,1,0].map(i=>addMonths(m,-i));
  const tp = months.map(x=>monthStats(x).pct);
  const hasTrend = tp.some(v=>v!=null);
  const trendChart = hasTrend ? colChart(months.map(monthShort), [{name:'Waste', color:VIZ.w, vals:tp.map(v=>v==null?0:Math.round(v*10)/10)}],
    {fmt:v=>nf1.format(Math.round(v*10)/10)+'%', target:isFinite(target)?target:null, targetLabel:isFinite(target)?'Target '+pct(target):null, lastLabel:true, label:'Waste per bulan'}) : '<p class="hint">Belum ada data waste.</p>';
  // Buah masuk dan keluar per minggu pada bulan terpilih

    if(e.type==='masuk') inW[w] += k;

  });
  const wl = inW.map((_,i)=> (i*7+1)+'–'+Math.min(nd,(i+1)*7));
  const flowSer = [{name:'Masuk', color:VIZ.a, vals:inW.map(v=>Math.round(v*10)/10)}, {name:'Keluar', color:VIZ.b, vals:outW.map(v=>Math.round(v*10)/10)}];
  const flowHas = inW.some(v=>v>0) || outW.some(v=>v>0);
  const flowSec = `<section class="card sec"><h2>Buah masuk dan keluar per minggu</h2>${flowHas ? legend(flowSer)+colChart(wl, flowSer, {fmt:v=>cnum(v), tipFmt:v=>kg(v), label:'Buah masuk dan keluar per minggu'})+`<details class="dt"><summary>Lihat angka</summary>${tableHtml(['Tanggal','Masuk','Keluar'], wl.map((l,i)=>[l, kg(inW[i]), kg(outW[i])]))}</details><p class="hint" style="margin-top:6px">Keluar = ke produksi, ke freezer, dan eceran (dalam kg).</p>` : '<p class="hint">Belum ada data bulan ini.</p>'}</section>`;
  const yEntries = Object.entries(cur.yield).sort((a,b)=>b[1].kotor-a[1].kotor);
  const yRows = yEntries.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="n">${kg(v.kotor)}</td><td class="n">${kg(v.bersih)}</td><td class="n">${pct(v.bersih/v.kotor*100)}</td></tr>`).join('');

  const yieldSec = `<section class="card sec"><h2>Hasil produksi setelah dikupas</h2>${yBars}<div class="tw"><table><thead><tr><th>Buah</th><th class="n">Kotor</th><th class="n">Bersih</th><th class="n">Hasil</th></tr></thead><tbody>${yRows?yRows+yTot:'<tr><td colspan="4" class="hint">Belum ada data bulan ini.</td></tr>'}</tbody></table></div>${cur.noNet>0?`<p class="hint" style="margin-top:8px">${kg(cur.noNet)} produksi belum punya berat bersih (catatan lama).</p>`:''}<p class="hint" style="margin-top:8px">Sisa kupas dihitung otomatis dari berat kotor dikurangi berat bersih, dan sudah termasuk dalam angka waste. Buah yang dibekukan ikut dihitung di sini.</p></section>`;

      <p class="big">${cur.pct==null?'–':pct(cur.pct)}</p>
      ${cur.pct!=null?meter(cur.pct, isFinite(target)?target:null):''}

      ${cur.pctNet!=null?`<p class="hint">Tanpa sisa kupas: ${pct(cur.pctNet)} (${kg(cur.waste-cur.kupas)})</p>`:''}</section>
    <section class="grid2">
      <div><span class="lbl">Masuk</span><br><strong>${kg(cur.masuk)}</strong></div>
      <div><span class="lbl">Ke produksi</span><br><strong>${kg(cur.produksi+cur.frozen)}</strong>${cur.frozen>0?`<br><span class="hint">termasuk ${kg(cur.frozen)} ke freezer</span>`:''}</div>

      <div><span class="lbl">Koreksi opname</span><br><strong>${skg(cur.koreksi)}</strong></div>
      ${st.migrated2?`<div><span class="lbl">Dibekukan (bersih)</span><br><strong>${kg(cur.fnet)}</strong></div>
      <div><span class="lbl">Dari freezer ke dapur</span><br><strong>${kg(cur.dari_freezer)}</strong></div>`:''}
    </section>
    <section class="card sec"><h2>Waste 6 bulan terakhir</h2>${trendChart}${hasTrend?`<details class="dt"><summary>Lihat angka</summary>${tableHtml(['Bulan','Waste'], months.map((x,i)=>[monthLabel(x), tp[i]==null?'–':pct(tp[i])]))}</details>`:''}</section>
    ${flowSec}
    <section class="card sec"><h2>Waste per kategori</h2>${bars(cur.cats, CATS)}</section>
    <section class="card sec"><h2>Waste per tahap</h2>${bars(cur.stages, STAGES)}</section>
    <section class="card sec"><h2>Per jenis buah</h2><div class="tw"><table><thead><tr><th>Buah</th><th class="n">Masuk</th><th class="n">Waste</th><th class="n">%</th></tr></thead><tbody>${frRows}</tbody></table></div></section>
    ${yieldSec}
    ${canManage()?'<button class="btn" data-act="export-csv">Unduh CSV bulan ini</button>':''}`;
}

async function importLegacy(){
  const d = legacyData(); if(!d) return;
  const ok = await ask('Impor data lama?', `${d.entries.length} catatan dari perangkat ini akan dikirim ke database bersama atas nama akunmu. Nama pencatat lama dicantumkan pada kolom catatan. Lakukan ini satu kali saja.`, 'Impor sekarang');
  if(!ok) return;
  const fm = {}; derived().fruits.forEach(f => { fm[f.name.trim().toLowerCase()] = f.id; });
  const valid = d.entries.filter(e => e && TYPES[e.type] && /^\d{4}-\d{2}-\d{2}$/.test(e.date||'') && isFinite(e.kg) && e.fruit);
  new Set(valid.map(e=>normName(e.fruit))).forEach(name => {
    const k = name.toLowerCase();
    if(!fm[k]){ const id = uuid(); fm[k] = id; enqueue({k:'fruit', row:{id, name}}); }
  });
  const rows = valid.map(e => ({
    id:uuid(), entry_date:e.date, type:e.type, fruit_id:fm[normName(e.fruit).toLowerCase()], kg:e.kg,
    price:isFinite(e.price)?e.price:null, origin:e.origin||null, menu:e.menu||null,
    category:e.type==='waste'?(e.cat||'lainnya'):null, stage:e.type==='waste'?(e.stage||'gudang'):null,
    note:[e.note, e.user?('Dicatat '+e.user+' (data lama)'):'(data lama)'].filter(Boolean).join('. '), created_by:st.me.id
  }));
  for(let i=0;i<rows.length;i+=100) enqueue({k:'entry', rows:rows.slice(i,i+100)});
  try{ localStorage.setItem('sb.legacyDone','1'); }catch(e){}
  toast(`${rows.length} catatan lama sedang dikirim`);
  dlg.close(); render(); updateHeader(); sync();
}

async function submitPw(form){
  const fd = new FormData(form), a = String(fd.get('p1')||''), b2 = String(fd.get('p2')||''), err = $('#pw-err');
  if(a.length<8){ err.innerHTML = '<div class="err" role="alert">Kata sandi minimal 8 karakter.</div>'; return; }
  if(a!==b2){ err.innerHTML = '<div class="err" role="alert">Kedua kata sandi tidak sama.</div>'; return; }
  const ok = await mgmt(async()=>{
    const r = await api('/auth/v1/user', {method:'PUT', body:{password:a}});
    if(!r.ok){
      const e = await failure(r);
      if(/different/i.test(e.message)) e.message = 'Kata sandi baru harus berbeda dari yang lama.';
      else if(/weak|short|least|characters/i.test(e.message)) e.message = 'Kata sandi terlalu lemah. Gunakan campuran huruf dan angka.';
      throw e;
    }
  }, 'Kata sandi diganti', '#pw-err');
  if(ok) form.reset();
}

function download(name, text, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:mime}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCsv(){
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head = ['tanggal','jenis','buah','kg','kg_bersih','harga_per_kg','asal','menu','kategori_waste','tahap','catatan','dicatat_oleh'];
  const rows = derived().live.filter(e=>e.entry_date.startsWith(ui.month))
    .sort((a,b)=>a.entry_date.localeCompare(b.entry_date)||Date.parse(a.created_at)-Date.parse(b.created_at))
    .map(e=>[e.entry_date,TYPES[e.type].label,fruitName(e.fruit_id),e.kg,e.kg_net,e.price,e.origin,e.menu,e.category?CATS[e.category]:'',e.stage?STAGES[e.stage]:'',e.note,profName(e.created_by)].map(q).join(','));
  download(`stok-buah-${ui.month}.csv`, '\ufeff'+[head.join(',')].concat(rows).join('\r\n'), 'text/csv;charset=utf-8');
}

const sName = id => { const s = derived().smap[id]; return s ? s.name : '(bahan dihapus)'; };
const sUnit = id => { const s = derived().smap[id]; return s ? s.unit : ''; };
const fq = (n,u) => nf.format(Math.round(n*100)/100)+(u?' '+u:'');
const sfq = (n,u) => (n>0?'+':n<0?'−':'')+fq(Math.abs(n),u);
const findSupply = name => { const l = name.toLowerCase(); return derived().supplies.find(s => s.name.trim().toLowerCase()===l) || null; };
const allowedSTypes = () => (ROLE_STYPES[myRole()] || []).filter(t => st.migrated2 || !NEW_STYPES.includes(t));

const locOf = e => e.loc==='dapur' ? 'dapur' : 'gudang';
function supplyStock(){
  const d = derived(), m = {};
  const get = id => m[id] || (m[id] = {masuk:0,pindah:0,pakai:0,rusak:0,koreksi:0,rG:0,rD:0,kG:0,kD:0});
  d.supplies.forEach(s => get(s.id));
  d.sLive.forEach(e => {
    const r = get(e.supply_id), q = Number(e.qty);
    r[e.type] += q;
    if(e.type==='rusak'){ if(locOf(e)==='dapur') r.rD += q; else r.rG += q; }
    if(e.type==='koreksi'){ if(locOf(e)==='dapur') r.kD += q; else r.kG += q; }
  });
  const rd = n => Math.round(n*100)/100;
  Object.values(m).forEach(r => {
    r.gudang = rd(r.masuk + r.kG - r.pindah - r.rG);
    r.dapur = rd(r.pindah + r.kD - r.pakai - r.rD);
    r.stok = rd(r.masuk + r.koreksi - r.pakai - r.rusak);   // total gudang + dapur
  });
  return m;
}
// Batas minimum membandingkan stok gudang (tempat pembelian ulang), atau total jika belum ada pembaruan 4
function lowSupplies(){
  if(!st.migrated) return [];
  const s = supplyStock(), lv = r => st.migrated2 ? r.gudang : r.stok;
  return derived().supplies.filter(x => !x.hidden && x.min_stock!=null && lv(s[x.id]||{stok:0,gudang:0}) <= Number(x.min_stock));
}
function supMonth(m){
  const r = {};
  derived().sLive.filter(e => e.entry_date.startsWith(m)).forEach(e => {
    const x = r[e.supply_id] || (r[e.supply_id] = {masuk:0,pindah:0,pakai:0,rusak:0,koreksi:0});
    x[e.type] += Number(e.qty);
  });
  return r;
}

function quickSupplies(){
  const d = derived(), act = d.supplies.filter(s=>!s.hidden).map(s=>s.name), out = [];
  d.sLive.slice().sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at)).forEach(e => {
    const n = sName(e.supply_id);
    if(out.length<8 && act.includes(n) && !out.includes(n)) out.push(n);
  });
  act.slice().sort((a,b)=>a.localeCompare(b,'id')).forEach(n => { if(out.length<8 && !out.includes(n)) out.push(n); });
  return out;
}
function sDetail(e){
  const p = [];
  if(e.price!=null) p.push(rp(Number(e.price))+'/'+sUnit(e.supply_id));
  if(e.type==='pindah') p.push('gudang ke dapur');
  if((e.type==='rusak' || e.type==='koreksi') && e.loc) p.push(e.loc==='dapur'?'di dapur produksi':'di gudang');
  if(e.note) p.push(e.note);
  p.push('oleh '+profName(e.created_by));
  return p.join(', ');
}
function updateYield(){
  const box = $('#yield-box'); if(!box) return;
  const g = parseFloat(String(($('#f-kg')||{}).value||'').replace(',','.'));
  const n = parseFloat(String(($('#f-net')||{}).value||'').replace(',','.'));
  if(!isFinite(g) || g<=0 || !isFinite(n) || n<=0){ box.textContent = 'Isi berat kotor dan berat bersih untuk melihat persentase hasil.'; box.classList.remove('bad'); return; }
  if(n>g){ box.textContent = 'Berat bersih lebih besar dari berat kotor. Periksa lagi angkanya.'; box.classList.add('bad'); return; }
  box.classList.remove('bad');
  box.innerHTML = `Hasil <b>${pct(n/g*100)}</b>. Sisa kupas ${kg(g-n)} (${pct((g-n)/g*100)}).`;
}

async function submitSupply(form){
  const fd = new FormData(form), t = ui.stype;
  if(!allowedSTypes().includes(t)){ toast('Perananmu tidak bisa membuat catatan ini.'); return; }
  const typed = normName(fd.get('item'));
  const row = {id:uuid(), entry_date:String(fd.get('date')||''), type:t, supply_id:null,
    qty:parseFloat(String(fd.get('qty')||'').replace(',','.')), price:null, note:null, created_by:st.me.id};
  const errs = [];
  if(!row.entry_date) errs.push('Isi tanggal.'); else if(row.entry_date>todayStr()) errs.push('Tanggal tidak boleh di masa depan.');
  if(!typed) errs.push('Isi nama bahan.');
  if(!isFinite(row.qty) || row.qty<=0) errs.push('Isi jumlah lebih dari 0.');
  else if(row.qty>9999999) errs.push('Jumlah terlalu besar. Periksa lagi angkanya.');
  const price = parseFloat(fd.get('price')); if(isFinite(price) && price>=0) row.price = price;
  const note = String(fd.get('note')||'').trim(); if(note) row.note = note;
  if(t==='rusak' && !note) errs.push('Tulis alasan rusak atau hilang.');
  if(t==='rusak' && st.migrated2){ const lc = String(fd.get('loc')||''); if(lc==='gudang' || lc==='dapur') row.loc = lc; else errs.push('Pilih lokasi rusak atau hilang: gudang atau dapur produksi.'); }
  let sup = typed ? findSupply(typed) : null;
  if(typed && !sup && !canManage()) errs.push('Bahan "'+typed+'" belum ada di daftar. Minta admin atau manager menambahkannya.');
  if(!st.migrated) errs.push('Database belum diperbarui. Minta manager menjalankan 3-update.sql di Supabase.');
  if(t==='pindah' && !st.migrated2) errs.push('Fitur gudang dan dapur belum aktif. Minta manager menjalankan 4-update.sql di Supabase.');
  const box = $('#f-err');
  if(errs.length){ box.innerHTML = `<div class="err" role="alert"><ul>${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; box.scrollIntoView({block:'center'}); return; }
  box.innerHTML = '';
  if(!sup){
    const sim = derived().supplies.find(x => similar(x.name, typed));
    if(sim){
      const okNew = await ask('Bahan baru?', `"${typed}" mirip dengan "${sim.name}" yang sudah ada. Simpan sebagai bahan baru?`, 'Ya, bahan baru');
      if(!okNew){ const i = $('#s-item'); if(i) i.focus(); return; }
    }
  }
  if(t!=='masuk'){
    const sx = sup ? supplyStock()[sup.id] : null, m2 = st.migrated2;
    const where = !m2 ? null : (t==='pindah' ? 'gudang' : t==='pakai' ? 'dapur' : (row.loc||'gudang'));
    const avail = sx ? (m2 ? (where==='dapur' ? sx.dapur : sx.gudang) : sx.stok) : 0;
    if(row.qty > avail + 0.001){
      const label = !m2 ? 'Stok' : (where==='dapur' ? 'Stok dapur produksi' : 'Stok gudang');
      const tip = (!m2 || where==='gudang') ? 'Pastikan catatan bahan masuk sudah diisi.' : 'Pastikan catatan pindah ke dapur sudah diisi.';
      const ok = await ask('Stok tidak cukup', `${label} ${sup?sup.name:typed} tercatat ${fq(avail,sup?sup.unit:'')}, sedangkan yang akan dicatat ${fq(row.qty,sup?sup.unit:'')}. ${tip} Tetap simpan?`, 'Tetap simpan');
      if(!ok) return;
    }
  }
  let unit = sup ? sup.unit : '';
  if(sup) row.supply_id = sup.id;
  else { unit = String(fd.get('unit')||'pcs'); row.supply_id = uuid(); enqueue({k:'supply', row:{id:row.supply_id, name:typed, unit, min_stock:null}}); }
  enqueue({k:'sentry', rows:[row]});
  const nm = sup ? sup.name : typed;
  ui.sdraft = {date:row.entry_date, item:nm};
  toast(`Tersimpan: ${STYPES[t].label.toLowerCase()} ${fq(row.qty,unit)} ${nm}${sup?'':'. Bahan baru masuk ke daftar.'}`);
  render(); updateHeader(); sync();
}

function openSupplies(){
  const d = derived(), s = supplyStock();
  const list = d.supplies.slice().sort((a,b)=>a.name.localeCompare(b.name,'id')).map(x => {

async function doLogin(form){
  const fd = new FormData(form);
  const email = String(fd.get('email')||'').trim().toLowerCase(), pw = String(fd.get('password')||'');
  const err = $('#l-err');
  if(!email || !pw){ err.innerHTML = '<div class="err" role="alert">Isi email dan kata sandi.</div>'; return; }
  if(!navigator.onLine){ err.innerHTML = '<div class="err" role="alert">Butuh internet untuk login.</div>'; return; }
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Masuk...';
  let res;
  try{ res = await fetch(SB_URL+'/auth/v1/token?grant_type=password', {method:'POST', headers:{apikey:SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify({email, password:pw})}); }
  catch(e){ btn.disabled = false; btn.textContent = 'Masuk'; err.innerHTML = '<div class="err" role="alert">Tidak ada koneksi ke server. Coba lagi.</div>'; return; }
  if(!res.ok){
    btn.disabled = false; btn.textContent = 'Masuk';
    let j = {}; try{ j = await res.json(); }catch(e){}
    const banned = j.error_code==='user_banned' || /banned/i.test(j.msg||j.message||'');
    const text = banned ? 'Akun ini dinonaktifkan. Hubungi manager.' : (res.status===400||res.status===401 ? 'Email atau kata sandi salah.' : 'Gagal masuk (kode '+res.status+'). Coba lagi.');
    err.innerHTML = `<div class="err" role="alert">${esc(text)}</div>`;
    return;
  }
  setSession(await res.json());
  await startSession();
}
async function startSession(){
  st.me = null; st.profiles = []; st.fruits = []; st.entries = new Map(); st.settings = {waste_target:null};
  st.cursor = 0; st.lastSync = 0; st.netFail = false; st.ready = false;
  st.supplies = []; st.sEntries = new Map(); st.sCursor = 0; st.migrated = true; st.migrated2 = false;
  const cached = loadLocal();
  if(cached && st.me){ st.ready = true; enterApp(); sync(); return; }
  showLoading();
  await sync();
  if(st.me && st.me.active){ st.ready = true; enterApp(); }
  else if(st.me){ renderBlocked(); }
  else if(isOffline()){ showFatal('Tidak bisa memuat data. Periksa koneksi internet, lalu coba lagi.'); }
  else if(st.session){ renderBlocked('Akunmu belum terdaftar sebagai staf. Hubungi manager.'); }
}
async function doLogout(){
  if(st.queue.length){
    const ok = await ask('Keluar sekarang?', `Masih ada ${st.queue.length} catatan yang belum terkirim. Catatan itu tetap tersimpan di perangkat ini dan terkirim saat kamu login lagi dengan akun yang sama.`, 'Tetap keluar');
    if(!ok) return;
  }
  if(dlg.open) dlg.close();
  try{ await api('/auth/v1/logout', {method:'POST'}); }catch(e){}
  LS.del(ck()); LS.del('sb.session');
  st.session = null; st.ready = false; st.me = null;
  showLogin();
}

  else if(id==='f-pw') submitPw(f);
  else if(id==='f-staff-new') submitStaffNew(f);
  else if(id==='f-staff-edit') submitStaffEdit(f);
  else if(id==='f-staff-pw') submitStaffPw(f);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id==='m'){ if(t.value) ui.month = t.value; render(); }
  else if(t.id==='f-date') ui.draft.date = t.value;
  else if(t.id==='f-fruit'){ ui.draft.fruit = t.value; updateFreezerHint(); }
  else if(t.id==='so-loc') updateOpnameInfo();
  else if(t.id==='s-date') ui.sdraft.date = t.value;
  else if(t.id==='s-item'){ ui.sdraft.item = t.value; updateUnitLabel(); }
});

document.addEventListener('input', ev => {
  const id = ev.target.id;
  if(id==='f-kg' || id==='f-net') updateYield();
  else if(id==='s-item') updateUnitLabel();
  else if(id==='f-fruit') updateFreezerHint();
});

let timersOn = false;
function startTimers(){
  if(timersOn) return; timersOn = true;
  setInterval(() => { if(st.session && st.ready && document.visibilityState==='visible') sync(); }, POLL_MS);
}
window.addEventListener('online', () => { st.netFail = false; updateHeader(); if(st.session && st.ready) sync(); });
window.addEventListener('offline', () => updateHeader());
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && st.session && st.ready) sync(); });

/* =====================================================================
   Mulai
   ===================================================================== */
(function boot(){
  const s = LS.get('sb.session', null);
  if(!s || !s.user || !s.refresh_token){ showLogin(); }
  else { st.session = s; startSession(); }
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
})();
</script>
